# Contêiner nginx que serve o site estático da Moobe atrás do Traefik existente.
# Fica FORA da pasta publicada (não é servido ao público). Não altera nenhum outro contêiner.
name: moobe
services:
  web:
    image: nginx:1.27-alpine
    container_name: moobe_site
    restart: unless-stopped
    mem_limit: 64m
    volumes:
      - /var/www/http/moobe:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [traefik_public]
    labels:
      traefik.enable: "true"
      traefik.docker.network: traefik_public
      traefik.http.routers.moobe.rule: Host(`moobe.com.br`) || Host(`www.moobe.com.br`)
      traefik.http.routers.moobe.entrypoints: websecure
      traefik.http.routers.moobe.tls.certresolver: tenants
      traefik.http.services.moobe.loadbalancer.server.port: "80"
networks:
  traefik_public:
    external: true
