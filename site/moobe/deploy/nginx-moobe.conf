# EXEMPLO para nginx. Confirme qual proxy o servidor usa antes de aplicar.
# Salve como um arquivo NOVO (ex.: /etc/nginx/conf.d/moobe.conf). Nao edite a config do manda4.com.br.
server {
    listen 80;
    server_name moobe.com.br www.moobe.com.br;

    root /var/www/http/moobe;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # cache leve para arquivos estaticos
    location ~* \.(png|svg|ico|css|js)$ {
        expires 7d;
        add_header Cache-Control "public";
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
# HTTPS (depois que o DNS apontar para o servidor):  sudo certbot --nginx -d moobe.com.br -d www.moobe.com.br
