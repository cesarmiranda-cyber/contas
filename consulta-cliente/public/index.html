<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consulta de cliente</title>
<style>
 :root{--navy:#1f2f6b;--teal:#0e9f9a;--bg:#eef1f5;--card:#fff;--tx:#1d2a4d;--mut:#6b7794;--bd:#e3e8f0;--ok:#16895a;--okbg:#e0f4ec;--no:#c0392b;--nobg:#fdeaea;--nh:#6b7794;--nhbg:#eceff4}
 *{box-sizing:border-box}
 body{margin:0;font:15px/1.45 "Segoe UI",system-ui,sans-serif;color:var(--tx);background:var(--bg) radial-gradient(circle,#d9dfe9 1px,transparent 1px) 0 0/22px 22px;min-height:100vh}
 main{max-width:860px;margin:0 auto;padding:34px 16px 48px}
 header{text-align:center;margin-bottom:22px}
 h1{margin:0 0 6px;font-size:30px;color:var(--navy);letter-spacing:-.01em}
 header p{margin:0;color:var(--mut)}
 .panel{background:var(--card);border-radius:18px;box-shadow:0 8px 30px rgba(31,47,107,.10);overflow:hidden}
 .panel:before{content:"";display:block;height:5px;background:linear-gradient(90deg,var(--navy),var(--teal))}
 .inner{padding:22px}
 form{display:flex;gap:10px}
 input{flex:1;min-width:0;padding:13px 16px;font-size:16px;border:1px solid var(--bd);border-radius:12px;color:var(--tx);background:#fff}
 input:focus{outline:2px solid var(--teal);outline-offset:1px}
 button{padding:13px 24px;font-size:15px;font-weight:600;border:0;border-radius:12px;background:var(--navy);color:#fff;cursor:pointer}
 button:hover{background:#17255a}
 #out{margin-top:18px;display:grid;gap:14px}
 .res{border:1px solid var(--bd);border-radius:14px;padding:16px 18px;background:#fff;border-left:5px solid var(--nh)}
 .res.Ativo{border-left-color:var(--ok)}.res.Inativo{border-left-color:var(--no)}
 .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
 .nome{font-weight:700;font-size:17px;color:var(--navy)}
 .chip{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;border-radius:99px;padding:3px 10px;margin-left:6px;vertical-align:middle;background:#e6f6f5;color:#0b7c78}
 .st{font-size:13px;font-weight:700;border-radius:99px;padding:5px 13px;white-space:nowrap}
 .st.Ativo{background:var(--okbg);color:var(--ok)}.st.Inativo{background:var(--nobg);color:var(--no)}.st.Sem{background:var(--nhbg);color:var(--nh)}
 .resp{display:flex;align-items:center;gap:12px;margin:14px 0}
 .av{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--navy),var(--teal));color:#fff;font-weight:700;display:grid;place-items:center;flex:none}
 .resp small{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
 .resp b{font-size:17px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
 @media(max-width:600px){.grid{grid-template-columns:1fr}form{flex-direction:column}h1{font-size:25px}}
 .box{background:#f6f8fb;border-radius:12px;padding:12px 14px}
 .lbl{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-bottom:6px}
 .lbl svg{width:16px;height:16px;stroke:var(--navy);fill:none;stroke-width:1.8}
 .val{font-weight:600}.sub{color:var(--mut);font-size:14px}.none{color:var(--mut)}
 .orc{margin-top:12px}.orc summary{cursor:pointer;font-weight:700;color:var(--navy)}.orc table{width:100%;border-collapse:collapse;margin-top:8px;font-size:13.5px}.orc th{text-align:left;color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;padding:4px 6px}.orc td{padding:6px;border-top:1px solid var(--bd);vertical-align:top}.orc .scroll{overflow-x:auto}
 .pill{font-size:12px;font-weight:700;border-radius:99px;padding:2px 9px;white-space:nowrap}.pill.Ganho{background:var(--okbg);color:var(--ok)}.pill.Perdido{background:var(--nobg);color:var(--no)}.pill.Em{background:#e8eefb;color:#2d4fa3}
 .grp{margin-top:8px;border:1px solid var(--bd);border-radius:10px;padding:8px 12px}.grp summary{cursor:pointer;font-weight:600}.grp.none{color:var(--mut);font-weight:400}
 .cons{margin-top:12px;border-top:1px dashed var(--bd);padding-top:10px}.cons .lbl{margin-bottom:4px}.cons li{font-size:13.5px;color:var(--mut);list-style:none}.cons ul{margin:0;padding:0}.cons b{color:var(--tx);font-weight:600}
 .msg{text-align:center;color:var(--mut);padding:14px}.err{color:var(--no)}
</style></head><body><main>
<header><h1>Consulta de cliente</h1><p>Digite o nome do cliente para saber quem é o responsável e se ele está ativo ou inativo.</p></header>
<div class="panel"><div class="inner">
<form id="f"><input id="q" placeholder="Nome do cliente ou da empresa" autofocus autocomplete="off"><button>Consultar</button></form>
<div id="out"></div>
</div></div>
<script>
const TOKEN='__TOKEN__';
const $=id=>document.getElementById(id), out=$('out');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>{const d=new Date(s);if(isNaN(d))return '';const dias=Math.floor((Date.now()-d)/864e5);
  return d.toLocaleDateString('pt-BR')+' ('+(dias<=0?'hoje':dias===1?'ontem':'há '+dias+' dias')+')'};
const ini=n=>String(n||'?').split(' ').filter(Boolean).slice(0,2).map(p=>p[0]).join('').toUpperCase();
const hora=s=>{const d=new Date(s);return isNaN(d)?'':d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'})};
const I={neg:'<svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>',
         usr:'<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
         ati:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>'};
const pill=x=>`<span class="pill ${String(x||'').split(' ')[0]}">${esc(x||'-')}</span>`;
function grupoNeg(nome,cls,g,aberto){
  if(!g.total)return `<div class="grp none"><span class="pill ${cls}">${nome}</span> nenhum negócio</div>`;
  const mais=g.total>g.itens.length?`<div class="sub" style="margin-top:6px">Mostrando os ${g.itens.length} mais recentes de ${g.total}.</div>`:'';
  return `<details class="grp"${aberto?' open':''}><summary><span class="pill ${cls}">${nome}</span> ${g.total} negócio(s)</summary><div class="scroll"><table><tr><th>Negócio</th><th>Funil</th><th>Data</th><th>Responsável</th></tr>${g.itens.map(i=>`<tr><td>${esc(i.titulo)}</td><td>${esc(i.funil)}</td><td>${dt(i.data)}</td><td>${esc(i.responsavel)}</td></tr>`).join('')}</table></div>${mais}</details>`}
function negs(n){
  if(!n.total)return '';
  return `<div class="orc"><div style="font-weight:700;color:var(--navy)">Negócios (${n.total})</div>${grupoNeg('Em andamento','Em',n.andamento,false)}${grupoNeg('Ganho','Ganho',n.ganhos,false)}${grupoNeg('Perdido','Perdido',n.perdidos,false)}</div>`}
function orc(o){
  if(!o||!o.itens&&!o.erro)return '';
  if(o.erro)return '<div class="orc none">Não foi possível carregar os orçamentos agora.</div>';
  if(!o.total)return '<div class="orc"><b style="color:var(--navy)">Orçamentos</b> <span class="none">· nenhum orçamento</span></div>';
  const mais=o.total>o.itens.length?`<div class="sub" style="margin-top:6px">Mostrando os ${o.itens.length} mais recentes de ${o.total}.</div>`:'';
  return `<details class="orc"><summary>Orçamentos (${o.total})</summary><div class="scroll"><table><tr><th>Orçamento</th><th>Etapa</th><th>Situação</th><th>Data</th><th>Responsável</th></tr>${o.itens.map(i=>`<tr><td>${esc(i.titulo)}</td><td>${esc(i.etapa)}</td><td>${pill(i.situacao)}</td><td>${dt(i.data)}</td><td>${esc(i.responsavel)}</td></tr>`).join('')}</table></div>${mais}</details>`}
function card(r){
  const n=r.negocios,a=r.atividades,sit=r.situacao.split(' ')[0];
  const neg=n.total?`<div class="val">${esc(n.ultimo.titulo)}</div><div class="sub">${pill(n.ultimo.situacao)} ${dt(n.ultimo.data)}</div><div class="sub">${n.total} negócio(s) no total</div>`:'<div class="none">Nenhum negócio</div>';
  const at=a.total&&a.ultima?`<div class="val">${esc(a.ultima.tipo)}</div><div class="sub">${dt(a.ultima.data)}</div><div class="sub">${a.total} atividade(s) no total</div>`:'<div class="none">Nenhuma atividade</div>';
  return `<div class="res ${sit}"><div class="top"><div class="nome">${esc(r.nome)}<span class="chip">${esc(r.tipo)}</span></div>
  <span class="st ${sit}">${esc(r.situacao)}${r.diasSemMovimento!==null?' · último movimento há '+r.diasSemMovimento+' dias':''}</span></div>
  <div class="resp"><div class="av">${esc(ini(r.responsavel))}</div><div><small>Responsável</small><b>${esc(r.responsavel)}</b></div></div>
  <div class="grid"><div class="box"><div class="lbl">${I.neg}Último negócio</div>${neg}</div><div class="box"><div class="lbl">${I.ati}Última atividade</div>${at}</div></div>
  ${negs(r.negocios)}
  ${orc(r.orcamentos)}
  <div class="cons"><div class="lbl">${I.usr}Últimas consultas a este cliente</div>${r.consultas&&r.consultas.length?'<ul>'+r.consultas.map(c=>`<li><b>${c.voce?'Você':esc(c.nome)}</b> · ${hora(c.data)}</li>`).join('')+'</ul>':'<div class="none">Ninguém consultou este cliente antes.</div>'}</div></div>`}
$('f').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();
  if(q.length<3){out.innerHTML='<div class="msg">Digite pelo menos 3 letras.</div>';return}
  out.innerHTML='<div class="msg">Consultando…</div>';
  try{const r=await fetch('/api/consulta?q='+encodeURIComponent(q),{headers:{Authorization:'Bearer '+TOKEN}});const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Erro');
    out.innerHTML=j.resultados.length?j.resultados.map(card).join('')+(j.maisResultados?'<div class="msg">Mostrando os 15 primeiros. Refine a busca.</div>':''):'<div class="msg">Nenhum cliente encontrado.</div>'
  }catch(x){out.innerHTML='<div class="msg err">'+esc(x.message)+'</div>'}};
</script></main></body></html>
