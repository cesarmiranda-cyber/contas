<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Consultar cliente</title>
<style>
 :root{--bg:#f4f6f8;--card:#fff;--tx:#1f2933;--mut:#66788a;--bd:#dde3e9;--ac:#2067b0}
 @media(prefers-color-scheme:dark){:root{--bg:#161b20;--card:#1f262d;--tx:#e6ebf0;--mut:#98a8b8;--bd:#33404c;--ac:#6aa8e8}}
 *{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
 main{max-width:860px;margin:0 auto;padding:20px 16px}
 h1{font-size:20px;margin:0 0 14px}
 form{display:flex;gap:8px;margin-bottom:16px}
 input{flex:1;padding:10px 12px;font-size:16px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx)}
 button{padding:10px 18px;font-size:15px;border:0;border-radius:8px;background:var(--ac);color:#fff;cursor:pointer}
 .card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px 16px;margin-bottom:10px}
 .top{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
 .nome{font-weight:600;font-size:16px}.tag{font-size:12px;color:var(--mut);border:1px solid var(--bd);border-radius:99px;padding:1px 8px}
 .resp{color:var(--mut);margin:2px 0 10px}
 .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:600px){.grid{grid-template-columns:1fr}}
 .box{border-top:1px solid var(--bd);padding-top:8px}.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
 .none{color:var(--mut)}.msg{color:var(--mut);padding:8px 2px}.err{color:#c0392b}
</style></head><body><main>
<h1>Consultar cliente</h1>
<form id="f"><input id="q" placeholder="Nome do cliente ou da empresa" autofocus autocomplete="off"><button>Consultar</button></form>
<div id="out"></div>
<script>
const TOKEN='__TOKEN__';
const $=id=>document.getElementById(id), out=$('out');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dt=s=>{const d=new Date(s);if(isNaN(d))return '';const dias=Math.floor((Date.now()-d)/864e5);
  return d.toLocaleDateString('pt-BR')+' ('+(dias<=0?'hoje':dias===1?'ontem':'há '+dias+' dias')+')'};
const money=(v,m)=>v?new Intl.NumberFormat('pt-BR',{style:'currency',currency:m||'BRL'}).format(v):'';
function card(r){
  const n=r.negocios,a=r.atividades;
  const neg=n.total?`<b>${n.total}</b> negócio(s)<br>Último: ${esc(n.ultimo.titulo)} — ${esc(n.ultimo.situacao)}${n.ultimo.valor?' · '+money(n.ultimo.valor,n.ultimo.moeda):''}<br>${dt(n.ultimo.data)}`:'<span class="none">Nenhum negócio</span>';
  const at=a.total&&a.ultima?`<b>${a.total}</b> atividade(s)<br>Última: ${esc(a.ultima.tipo)} — ${esc(a.ultima.assunto)}<br>${dt(a.ultima.data)}`:'<span class="none">Nenhuma atividade</span>';
  return `<div class="card"><div class="top"><span class="nome">${esc(r.nome)}</span><span class="tag">${esc(r.tipo)}</span></div>
  <div class="resp">Responsável: ${esc(r.responsavel)}</div>
  <div class="grid"><div class="box"><div class="lbl">Negócios</div>${neg}</div><div class="box"><div class="lbl">Atividades</div>${at}</div></div></div>`}
$('f').onsubmit=async e=>{e.preventDefault();const q=$('q').value.trim();
  if(q.length<3){out.innerHTML='<div class="msg">Digite pelo menos 3 letras.</div>';return}
  out.innerHTML='<div class="msg">Consultando…</div>';
  try{const r=await fetch('/api/consulta?q='+encodeURIComponent(q),{headers:{Authorization:'Bearer '+TOKEN}});const j=await r.json();
    if(!r.ok)throw new Error(j.error||'Erro');
    out.innerHTML=j.resultados.length?j.resultados.map(card).join('')+(j.maisResultados?'<div class="msg">Mostrando os 15 primeiros. Refine a busca.</div>':''):'<div class="msg">Nenhum cliente encontrado.</div>'
  }catch(x){out.innerHTML='<div class="msg err">'+esc(x.message)+'</div>'}};
</script></main></body></html>
