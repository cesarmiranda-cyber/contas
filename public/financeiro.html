<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro</title>
<link rel="icon" href="/_gw/icon">
<style>
:root{
  --bg:#f5f6fa;--surface:#fff;--surface2:#f8f9fc;--ink:#10162b;--ink2:#4a5270;--mut:#6a7390;--line:#e6e9f2;--line2:#d9deeb;
  --brand:#3b4fd8;--brand2:#5b6cf0;--brandbg:#eceefd;--side:#10162b;--sideink:#c9d0ea;--sidemut:#8a94b8;--sidehi:#1c2547;
  --s1:#2a78d6;--s2:#eb6834;
  --ok:#0b7f46;--okbg:#e2f6ec;--warn:#9a5b00;--warnbg:#fff3dc;--bad:#c02626;--badbg:#fde9e9;--info:#1d4ed8;--infobg:#e8f0fe;--neutral:#4a5270;--neutralbg:#eef0f6;
  --shadow:0 1px 2px rgba(16,22,43,.05),0 10px 28px -16px rgba(16,22,43,.18);--r:14px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b0e1a;--surface:#141a2c;--surface2:#192036;--ink:#eef1fb;--ink2:#b7bfd9;--mut:#8f99ba;--line:#242c45;--line2:#303a5a;
  --brand:#8a95ff;--brand2:#a6aeff;--brandbg:#222850;--side:#0a0d18;--sidehi:#182040;
  --s1:#3987e5;--s2:#d95926;
  --ok:#4cd694;--okbg:#0f3023;--warn:#f5b94a;--warnbg:#352a10;--bad:#ff8a8a;--badbg:#3b1717;--info:#7aa8ff;--infobg:#16264d;--neutral:#b7bfd9;--neutralbg:#222a40;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -16px rgba(0,0,0,.7)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sideink);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;color:#fff;font-weight:750;font-size:16px;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand2),#8a5cf0);display:grid;place-items:center;color:#fff}
aside nav{display:flex;flex-direction:column;gap:2px}
aside nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--sideink);padding:9px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
aside nav button:hover{background:var(--sidehi);color:#fff}aside nav button[aria-current=page]{background:var(--sidehi);color:#fff;box-shadow:inset 3px 0 0 var(--brand2)}
.sep{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sidemut);padding:14px 12px 4px}
.sidefoot{margin-top:auto;padding:12px;border-top:1px solid #ffffff1a;font-size:12px;color:var(--sidemut);display:flex;flex-direction:column;gap:6px}
.dotl{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:#6b7390}.dotl.ok{background:#4cd694}.dotl.bad{background:#ff8a8a}
.col{min-width:0}
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px;flex-wrap:wrap}
.top h1{margin:0;font-size:19px;letter-spacing:-.02em;flex:1;min-width:140px}
.btn.menu{display:none}
main{padding:22px 24px 48px;max-width:1280px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;max-width:100%}
:is(button,a,input,select,textarea):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:650;color:var(--ink2)}label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:500;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.ch h2{margin:0;font-size:15px;letter-spacing:-.01em}.cb{padding:18px}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.g2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g2 .card{margin-bottom:0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;gap:12px}
.kpi .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--brandbg);color:var(--brand)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:650}.kpi .v{font-size:22px;font-weight:760;letter-spacing:-.02em;line-height:1.25}.kpi .s{font-size:12px;color:var(--mut)}
.kpi.bad .ico{background:var(--badbg);color:var(--bad)}.kpi.ok .ico{background:var(--okbg);color:var(--ok)}.kpi.warn .ico{background:var(--warnbg);color:var(--warn)}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--mut)}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl tbody tr:hover{background:var(--surface2)}
.tbl th.num,.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.wrap{overflow-x:auto}.tbl td.emp{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tbl .t2{display:block;color:var(--mut);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--infobg);color:var(--info)}.p-mut{background:var(--neutralbg);color:var(--neutral)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;margin-bottom:10px;font-weight:550}.alert.alta{background:var(--badbg);color:var(--bad)}.alert.media{background:var(--warnbg);color:var(--warn)}.alert.info{background:var(--infobg);color:var(--info)}
.empty{padding:34px 20px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line2);background:var(--surface);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-weight:600;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--brandbg);border-color:var(--brand);color:var(--brand)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{min-width:220px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}.steps li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--neutralbg);color:var(--neutral);flex:none}.steps .done .n{background:var(--okbg);color:var(--ok)}.steps li div{flex:1}.steps small{display:block;color:var(--mut)}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}.list li:last-child{border-bottom:0}.list .t2{color:var(--mut);font-size:12px;display:block}
.bar{height:8px;border-radius:99px;background:var(--neutralbg);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--s1)}
.hrow{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;padding:6px 0}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:0}.dl dt{font-size:12px;color:var(--mut);font-weight:600}.dl dd{margin:0;font-weight:620;word-break:break-word}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:20px;width:min(580px,94vw)}dialog::backdrop{background:rgba(8,10,20,.55)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:92vw;font-weight:600}#toast.on{opacity:1}
.sk{height:96px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:14px}@keyframes sk{to{background-position:-200% 0}}
.chart{width:100%;height:auto}.chart text{fill:var(--mut);font-size:11px}.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:9px;font-size:12px;z-index:70;display:none;line-height:1.5}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
details summary{cursor:pointer;color:var(--brand);font-weight:600;padding:8px 0}
@media(max-width:900px){.btn.menu{display:inline-flex}.app{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;z-index:40;width:250px;transform:translateX(-100%);transition:.2s}aside.open{transform:none}main{padding:16px}.top{padding:10px 16px}.hrow{grid-template-columns:90px 1fr 90px}}
@media print{aside,.top,.tools,.btn{display:none!important}.app{display:block}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside id="side"><div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg></span>Financeiro</div><nav id="nav"></nav>
  <div class="sidefoot" id="foot"></div></aside>
<div class="col">
  <div class="top"><button class="btn menu" id="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1 id="ttl">Painel</h1>
    <label class="inline" id="empWrap">Empresa <select id="emp" aria-label="Empresa"></select></label>
    <button class="btn" id="reload" title="Atualizar dados" aria-label="Atualizar dados"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg></button>
    <a class="btn" href="/">Cobranças</a></div>
  <main id="main"></main>
</div></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><div class="tip" id="tip"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brk=v=>{v=Number(v||0);const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(1).replace('.',',')+' mi':a>=1e3?(v/1e3).toFixed(a>=1e4?0:1).replace('.',',')+' mil':String(Math.round(v))};
const fdoc=d=>{d=String(d||'').replace(/\D/g,'');return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):d.length===14?d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):d};
const dt=d=>d?d.split('-').reverse().join('/'):'—';
const mesNome=m=>['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m.slice(5)-1]+'/'+m.slice(2,4);
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const P=new URLSearchParams(location.search), DEAL=P.get('deal');
let B={empresas:[],config:{},categorias:[],hoje:'',host:''}, EMP=ls.get('fin.emp')||'todas', TAB=ls.get('fin.tab')||'painel', BUSY=false, ST=null;
async function api(m,u,b){const r=await fetch('/api/fin'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Erro '+r.status));return j}
const q=(x='')=>`?empresa=${encodeURIComponent(EMP)}${x}`;
function toast(m,err){const t=$('#toast');t.textContent=m;t.style.background=err?'var(--bad)':'';t.style.color=err?'#fff':'';t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),4200)}
const act=async(fn,ok)=>{try{await fn();if(ok)toast(ok);await render()}catch(e){toast(e.message,1)}};
const I={
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',inbox:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>',out:'<path d="M4 7h16v12H4z"/><path d="M4 11h16M8 15h3"/>',wallet:'<path d="M3 7h16a2 2 0 012 2v9H5a2 2 0 01-2-2z"/><path d="M3 7l12-3v3M16 13h2"/>',
  file:'<path d="M7 3h8l4 4v14H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M17 11a3 3 0 100-6M21.5 19c-.3-2.4-1.6-4-3.5-4.7"/>',
  doc:'<path d="M6 3h9l3 3v15H6z"/><path d="M9 11h6M9 15h6"/>',bld:'<path d="M4 21V5l8-2v18M12 9l8 2v10M8 9h1M8 13h1M8 17h1M16 15h1M16 18h1"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',trend:'<path d="M3 17l6-6 4 4 8-9"/>',cal:'<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24">${I[n]||''}</svg>`;
const SK='<div class="sk"></div><div class="sk"></div><div class="sk" style="height:260px"></div>';
const PILL={paga:['ok','Paga'],pago:['ok','Pago'],aberta:['info','Em aberto'],aberto:['info','Em aberto'],a_vencer:['warn','Vence em breve'],vencida:['bad','Vencida'],atrasado:['bad','Atrasado'],cancelada:['mut','Cancelada'],cancelado:['mut','Cancelado'],vigente:['ok','Vigente'],vencendo:['warn','Vencendo'],vencido:['bad','Vencido'],sem_data:['mut','Sem vencimento']};
const pl=s=>{const[c,t]=PILL[s]||['mut',s];return `<span class="pill p-${c}">${t}</span>`};
const empOpts=(sel,blank)=>(blank?'<option value="">—</option>':'')+B.empresas.filter(e=>e.ativa).map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.nome)}</option>`).join('');
const FORMAS=[['PIX','Pix'],['BOLETO','Boleto'],['CARTAO','Cartão'],['TRANSFERENCIA','Transferência'],['DINHEIRO','Dinheiro']];
const fnome=c=>(FORMAS.find(f=>f[0]===c)||[0,c||'—'])[1];
const dealUrl=id=>B.host?`https://${B.host}/crm/deal/details/${id}/`:'#';
const empty=(t,s,cta='')=>`<div class="empty"><b>${t}</b>${s||''}${cta?`<div style="margin-top:12px">${cta}</div>`:''}</div>`;
const table=(cols,rows,emptyHtml)=>rows.length?`<div class="wrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th class="${c[0]==='>'?'num':''}">${esc(c.replace(/^>/,''))}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:emptyHtml||empty('Nada por aqui ainda.');
const kpi=(i,l,v,s,tone='')=>`<div class="kpi ${tone}"><div class="ico">${ic(i)}</div><div><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||'&nbsp;'}</div></div></div>`;
const card=(title,body,right='',sub='')=>`<section class="card"><div class="ch"><div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>${right}</div>${body}</section>`;
function ask(title,html,onOk,okLabel='Salvar'){const f=$('#dlgForm');f.innerHTML=`<h2 style="margin:0 0 14px;font-size:17px">${esc(title)}</h2><div class="form">${html}</div><div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn pri" id="dlgOk" value="ok">${okLabel}</button></div>`;
  const d=$('#dlg');d.showModal();f.onsubmit=async ev=>{ev.preventDefault();const v=Object.fromEntries([...f.querySelectorAll('[name]')].map(i=>[i.name,i.type==='checkbox'?i.checked:i.value]));const b=$('#dlgOk');b.disabled=true;try{await onOk(v);d.close();await render()}catch(e){toast(e.message,1)}finally{b.disabled=false}}}
document.addEventListener('click',e=>{if(e.target.value==='cancel')$('#dlg').close()});
const fld=(n,l,t='text',v='',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const sel=(n,l,o,v)=>`<label>${l}<select name="${n}">${o.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${esc(x[1])}</option>`).join('')}</select></label>`;
const onAll=(s,ev,fn)=>document.querySelectorAll(s).forEach(el=>el['on'+ev]=()=>fn(el));
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---------- gráficos (SVG, tooltip, tabela equivalente) ---------- */
function tipOn(el,html){const t=$('#tip');const mv=e=>{t.style.left=Math.min(innerWidth-190,e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px'};el.onmouseenter=e=>{t.innerHTML=html;t.style.display='block';mv(e)};el.onmousemove=mv;el.onmouseleave=()=>t.style.display='none'}
function cashChart(L){const W=760,H=270,pl=54,pr=14,pt=14,pb=30,n=L.length,cw=(W-pl-pr)/n;
  const vals=L.flatMap(l=>[l.entradaReal+l.entradaPrev,l.saidaReal+l.saidaPrev,l.saldo]);const mx=Math.max(1,...vals),mn=Math.min(0,...vals),rg=mx-mn||1;
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/rg),ticks=[0,.25,.5,.75,1].map(t=>mn+rg*t);
  const bw=Math.min(22,cw/3);let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas, saídas e saldo por mês">`;
  for(const t of ticks)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${brk(t)}</text>`;
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line2)"/>`;
  L.forEach((l,i)=>{const cx=pl+cw*i+cw/2,e=l.entradaReal+l.entradaPrev,o=l.saidaReal+l.saidaPrev;
    s+=`<rect x="${cx-bw-1}" y="${Math.min(y(e),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(0)-y(e)))}" rx="4" fill="var(--s1)" ${l.futuro?'fill-opacity=".72"':''}/><rect x="${cx+1}" y="${Math.min(y(o),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(0)-y(o)))}" rx="4" fill="var(--s2)" ${l.futuro?'fill-opacity=".72"':''}/>`;
    s+=`<text x="${cx}" y="${H-10}" text-anchor="middle" ${l.atual?'style="font-weight:700;fill:var(--ink)"':''}>${mesNome(l.mes)}</text>`;});
  const pts=L.map((l,i)=>[pl+cw*i+cw/2,y(l.saldo)]);s+=`<polyline fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;

  L.forEach((l,i)=>s+=`<rect class="hit" data-i="${i}" x="${pl+cw*i}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent"/>`);
  return s+'</svg><div class="legend"><span><i style="background:var(--s1)"></i>Entradas</span><span><i style="background:var(--s2)"></i>Saídas</span><span><i style="background:var(--ink2);border-radius:50%"></i>Saldo acumulado</span><span class="mut">Meses futuros em tom mais claro</span></div>'}
function cashTips(L){document.querySelectorAll('.chart .hit').forEach(el=>{const l=L[+el.dataset.i];tipOn(el,`<b>${mesNome(l.mes)}</b><br>Entradas ${brl(l.entradaReal+l.entradaPrev)}<br>Saídas ${brl(l.saidaReal+l.saidaPrev)}<br>Resultado ${brl(l.resultado)}<br>Saldo ${brl(l.saldo)}`)})}
const cashTable=L=>table(['Mês','>Entradas realizadas','>Entradas previstas','>Saídas realizadas','>Saídas previstas','>Resultado','>Saldo'],L.map(l=>`<tr ${l.atual?'style="background:var(--brandbg)"':''}><td><b>${mesNome(l.mes)}</b>${l.atual?' <span class="pill p-info">atual</span>':''}</td><td class="num">${brl(l.entradaReal)}</td><td class="num">${brl(l.entradaPrev)}</td><td class="num">${brl(l.saidaReal)}</td><td class="num">${brl(l.saidaPrev)}</td><td class="num ${l.resultado<0?'neg':'pos'}">${brl(l.resultado)}</td><td class="num ${l.saldo<0?'neg':''}"><b>${brl(l.saldo)}</b></td></tr>`));
const hbars=(rows,color='var(--s1)')=>{const m=Math.max(1,...rows.map(r=>r.valor));return rows.map(r=>`<div class="hrow"><span title="${esc(r.nome)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.nome)}</span><div class="bar"><i style="width:${Math.max(2,r.valor/m*100)}%;background:${color}"></i></div><span class="num">${brl(r.valor)}</span></div>`).join('')};

  ${cl.contatos.length?card('Contatos',table(['Nome','Cargo','E-mail','Telefone'],cl.contatos.map(x=>`<tr><td><b>${esc(x.nome)}</b></td><td>${esc(x.cargo||'—')}</td><td>${esc(x.email||'—')}</td><td>${esc(x.telefone||'—')}</td></tr>`))):''}
  ${d.dados.length?card('Dados do contrato',`<div class="cb"><dl class="dl">${d.dados.map(x=>`<div><dt>${esc(x.nome)}</dt><dd>${esc(x.valor)}</dd></div>`).join('')}</dl></div>`,'','Campos preenchidos na deal'):''}
  <div class="grid">${kpi('inbox','Em aberto',brl(f.aberto),'')}${kpi('alert','Atrasado',brl(f.atrasado),'',f.atrasado?'bad':'')}${kpi('trend','Pago',brl(f.pago),'','ok')}</div>
  ${card('Parcelas e cobranças do cliente',table(['Vencimento','Descrição','Situação','>Valor',''],f.parcelas.map(p=>`<tr><td>${dt(p.venc)}</td><td>${esc(p.descricao)}</td><td>${pl(p.status)}</td><td class="num"><b>${brl(p.valor)}</b></td><td class="num">${p.link?`<a class="btn sm" href="${esc(p.link)}" target="_blank" rel="noopener">Link</a>`:''}</td></tr>`),empty('Sem cobranças para este cliente','Quando as cobranças forem geradas no funil de cobranças, elas aparecem aqui.')))}`};

VIEWS.contratos=async()=>{const V=VIEWS.contratos;
  if(V.open){const d=await api('GET','/contratos/'+V.open);setTimeout(()=>{$('#voltar').onclick=()=>{V.open=null;render()}});return `<p><button class="btn" id="voltar">← Voltar aos contratos</button></p>${contratoBox(d)}`}
  const all=await api('GET','/contratos'+q());V.f??='';V.txt??='';
  const defs=[['','Todos',()=>true],['vencido','Vencidos',x=>x.status==='vencido'],['vencendo','Vencem em 30 dias',x=>x.status==='vencendo'],['vigente','Vigentes',x=>x.status==='vigente'],['sem_data','Sem vencimento',x=>x.status==='sem_data']];
  const l=filtrar(all.filter(x=>!V.f||x.status===V.f),V.txt,['titulo','cliente','empresa','responsavelNome']);
  setTimeout(()=>{bindList(V);
    $('#avisar').onclick=()=>act(async()=>{const r=await api('POST','/contratos/avisar',{});toast(r.enviados.length?`${r.enviados.length} aviso(s) enviado(s) ao(s) responsável(is)`:'Nenhum aviso pendente agora')});$('#cfgCt').onclick=cfgContratos;
    onAll('[data-open]','click',b=>{V.open=b.dataset.open;render()})});
  const inc=all.filter(c=>c.faltas.length).length;
  return `${inc?`<div class="alert media">${ic('alert')}<span>${inc} contrato(s) com dados incompletos no Bitrix (cliente, valor, vencimento, empresa ou responsável). Eles aparecem marcados na lista.</span></div>`:''}
  ${card('Contratos ativos',`<div class="cb" style="padding-bottom:0"><div class="tools" style="justify-content:space-between">${chips(all,defs,V.f)}<input id="busca" class="search" type="search" placeholder="Buscar contrato, cliente ou responsável" value="${esc(V.txt)}" aria-label="Buscar"></div></div>
   ${table(['Contrato','Cliente','Empresa','Responsável','Vencimento','Situação','>Valor'],l.map(c=>`<tr style="cursor:pointer" data-open="${c.id}"><td><b>${esc(c.titulo)}</b><span class="t2">${esc(c.etapaNome)}${c.faltas.length?' · '+faltaTxt(c.faltas):''}</span></td><td>${esc(c.cliente||'—')}</td><td class="emp" title="${esc(c.empresa||'—')}">${esc(c.empresa||'—')}</td><td>${esc(c.responsavelNome||'—')}</td><td>${dt(c.venc)}${c.diasParaVencer!==null?`<span class="t2">${c.diasParaVencer<0?'há '+(-c.diasParaVencer)+' dia(s)':'em '+c.diasParaVencer+' dia(s)'}</span>`:''}</td><td>${pl(c.status)}</td><td class="num"><b>${brl(c.valor)}</b></td></tr>`),
    all.length?empty('Nenhum resultado','Ajuste o filtro ou a busca.'):empty('Nenhum contrato ativo','Os contratos vêm do funil Contratos do Bitrix. Em “Campos e avisos” você escolhe o campo de vencimento e as etapas que contam como ativas.'))}`,
   `<div class="row"><button class="btn" id="cfgCt">Campos e avisos</button><button class="btn pri" id="avisar">Avisar responsáveis agora</button></div>`,`O responsável recebe notificação no Bitrix a ${(B.config.marcosAviso||[]).join(', ')} dia(s) do vencimento e se o contrato vencer.`)}`};
async function cfgContratos(){const c=await api('GET','/contratos/campos').catch(e=>{toast(e.message,1);return null});if(!c)return;
  ask('Contratos: campos e avisos',`<label style="grid-column:1/-1">Campo com a data de vencimento do contrato<select name="campo"><option value="">Data de fechamento (padrão)</option>${c.campos.map(x=>`<option value="${x.campo}" ${x.campo===B.config.contratoCampoVenc?'selected':''}>${esc(x.nome)}</option>`).join('')}</select></label>
  <label style="grid-column:1/-1">Dias de aviso antes do vencimento (separados por vírgula)<input name="marcos" value="${(B.config.marcosAviso||[]).join(', ')}"></label>
  <fieldset style="grid-column:1/-1;border:1px solid var(--line);border-radius:10px"><legend class="mut">Etapas que contam como contrato ativo (nenhuma marcada = todas, menos perdidas)</legend>${c.etapas.map(s=>`<label class="inline"><input type="checkbox" name="et_${s.id}" ${(B.config.contratoEtapasAtivas||[]).includes(s.id)?'checked':''}> ${esc(s.nome)}</label>`).join('')}</fieldset>`,
  async v=>{await api('PUT','/config',{contratoCampoVenc:v.campo,marcosAviso:v.marcos.split(/[ ,;]+/).filter(Boolean).map(Number),contratoEtapasAtivas:c.etapas.filter(s=>v['et_'+s.id]).map(s=>s.id)});Object.assign(B,await api('GET','/bootstrap'));toast('Configuração salva')})}

VIEWS.folha=async()=>{const V=VIEWS.folha;const comp=V.comp||B.hoje.slice(0,7);const [fs,fl]=await Promise.all([api('GET','/funcionarios'+q()),api('GET',`/folha${q('&competencia='+comp)}`)]);
  const fm=f=>`${fld('nome','Nome','text',f.nome||'','required')}<label>Empresa<select name="empresaId">${empOpts(f.empresaId||(EMP!=='todas'?EMP:''))}</select></label>${fld('cargo','Cargo','text',f.cargo||'')}${fld('cpf','CPF','text',f.cpf||'')}${fld('salario','Salário bruto (R$)','number',f.salario??'','step="0.01" min="0" required')}${fld('descontos','Descontos: INSS, IR… (R$)','number',f.descontos??0,'step="0.01" min="0"')}${fld('beneficios','Benefícios (R$)','number',f.beneficios??0,'step="0.01" min="0"')}${fld('encargos','Encargos: FGTS, patronal… (R$)','number',f.encargos??0,'step="0.01" min="0"')}${fld('diaPagamento','Dia de pagamento (1-28)','number',f.diaPagamento||5,'min="1" max="28"')}${sel('forma','Forma',FORMAS.slice(0,4),f.forma||'PIX')}${fld('admissao','Admissão','date',f.admissao||'')}${fld('desligamento','Desligamento','date',f.desligamento||'')}`;
  setTimeout(()=>{$('#comp').onchange=e=>{V.comp=e.target.value;render()};$('#novoFn').onclick=()=>ask('Novo funcionário',fm({}),v=>api('POST','/funcionarios',v).then(()=>toast('Funcionário cadastrado')));
    onAll('[data-fn]','click',b=>{const f=fs.find(x=>x.id===b.dataset.fn);ask('Editar funcionário',fm(f),v=>api('PUT','/funcionarios/'+f.id,v).then(()=>toast('Salvo')))});
    onAll('[data-gerar]','click',b=>act(async()=>{const r=await api('POST','/folha/gerar',{empresaId:b.dataset.gerar,competencia:comp});toast(r.novas?`${r.novas} conta(s) a pagar lançada(s): ${brl(r.total)}`:'A folha já estava lançada')}))});
  const ativos=fs.filter(f=>f.ativo);
  return `<div class="grid">${kpi('users','Funcionários ativos',ativos.length,'')}${kpi('wallet','Custo mensal total',brl(ativos.reduce((a,f)=>a+f.custoTotal,0)),'salário + benefícios + encargos')}</div>
  ${card('Lançamento da folha',table(['Empresa','Funcionários','>Custo','Situação',''],fl.empresas.map(e=>`<tr><td><b>${esc(e.empresa)}</b></td><td>${e.funcionarios}</td><td class="num">${brl(e.custo)}</td><td>${e.gerada?`<span class="pill p-ok">Lançada em ${dt(e.gerada.em.slice(0,10))}</span>`:'<span class="pill p-warn">Não lançada</span>'}</td><td class="num"><button class="btn sm" data-gerar="${e.empresaId}" ${e.funcionarios?'':'disabled'}>${e.gerada?'Lançar novos':'Lançar folha'}</button></td></tr>`),empty('Cadastre uma empresa primeiro')),`<label class="inline">Competência <input type="month" id="comp" value="${comp}"></label>`,`Salário líquido, benefícios e encargos viram contas a pagar para o mês seguinte${B.config.folhaAuto===false?' (lançamento automático desligado)':'; o lançamento é automático todo mês'}.`)}
  ${card('Funcionários',table(['Nome','Empresa','>Salário','>Benefícios','>Encargos','>Custo total','Situação',''],fs.map(f=>`<tr><td><b>${esc(f.nome)}</b><span class="t2">${esc(f.cargo||'—')}</span></td><td class="emp" title="${esc(f.empresa)}">${esc(f.empresa)}</td><td class="num">${brl(f.salario)}</td><td class="num">${brl(f.beneficios)}</td><td class="num">${brl(f.encargos)}</td><td class="num"><b>${brl(f.custoTotal)}</b></td><td>${f.ativo?'<span class="pill p-ok">Ativo</span>':'<span class="pill p-mut">Inativo</span>'}</td><td class="num"><button class="btn sm" data-fn="${f.id}">Editar</button></td></tr>`),empty('Nenhum funcionário cadastrado','Cadastre a equipe para lançar a folha todo mês.')),`<button class="btn pri" id="novoFn">+ Funcionário</button>`)}`};

VIEWS.relatorios=async()=>{const V=VIEWS.relatorios;const t=V.t||'receber',de=V.de||'',ate=V.ate||'';const r=await api('GET','/relatorio'+q(`&tipo=${t}&de=${de}&ate=${ate}`));
  setTimeout(()=>{['t','de','ate'].forEach(k=>{const el=$('#r_'+k);if(el)el.onchange=e=>{V[k]=e.target.value;render()}});$('#csv').href='/api/fin/relatorio'+q(`&tipo=${t}&de=${de}&ate=${ate}&formato=csv`)});
  const stat=['aberto','a_vencer','atrasado','pago','vencida','paga','aberta'];
  return card(esc(r.titulo),`${table(r.colunas.map((c,i)=>(typeof r.linhas[0]?.[i]==='number'?'>':'')+c),r.linhas.map(l=>`<tr>${l.map(v=>typeof v==='number'?`<td class="num">${brl(v)}</td>`:/^\d{4}-\d\d-\d\d$/.test(v)?`<td>${dt(v)}</td>`:stat.includes(v)?`<td>${pl(v)}</td>`:`<td>${esc(v)}</td>`).join('')}</tr>`),empty('Sem dados no período'))}<div class="cb" style="text-align:right;font-weight:750;border-top:1px solid var(--line)">${r.totalLabel}: ${brl(r.total)}</div>`,
   `<div class="tools"><select id="r_t" aria-label="Relatório">${[['receber','A receber'],['pagar','A pagar'],['folha','Folha']].map(([v,l])=>`<option value="${v}" ${v===t?'selected':''}>${l}</option>`).join('')}</select>${t!=='folha'?`<label class="inline">De <input type="date" id="r_de" value="${de}"></label><label class="inline">Até <input type="date" id="r_ate" value="${ate}"></label>`:''}<a class="btn" id="csv" href="#">Baixar CSV</a><button class="btn" onclick="print()">Imprimir</button></div>`)};

VIEWS.empresas=async()=>{Object.assign(B,await api('GET','/bootstrap'));const s=await api('GET','/status');ST=s;drawFoot();
  const naoVinc=s.minhas.filter(m=>!m.vinculada);
  setTimeout(()=>{$('#novaEmp').onclick=()=>ask('Nova empresa',`${fld('nome','Nome (aparece como opção no Bitrix)','text','','required')}${fld('cnpj','CNPJ')}`,v=>api('POST','/empresas',v).then(async()=>{await api('POST','/empresas/sincronizar-campo').catch(()=>{});Object.assign(B,await api('GET','/bootstrap'));fillEmp();toast('Empresa criada')}));
    onAll('.imp','click',()=>act(async()=>{const r=await api('POST','/empresas/importar-bitrix');await api('POST','/empresas/sincronizar-campo').catch(()=>{});Object.assign(B,await api('GET','/bootstrap'));fillEmp();toast(r.criadas?`${r.criadas} empresa(s) importada(s) do Bitrix`:'Empresas já estavam vinculadas')}));
    $('#syncCampo').onclick=()=>act(async()=>{const r=await api('POST','/empresas/sincronizar-campo');toast(`Campo “CR · Empresa” atualizado: ${r.opcoes.length} opção(ões)`)});
    onAll('[data-ed]','click',b=>{const e=B.empresas.find(x=>x.id===b.dataset.ed);ask('Editar empresa',`${fld('nome','Nome','text',e.nome,'required')}${fld('cnpj','CNPJ','text',e.cnpj)}<label style="grid-column:1/-1">“Minha empresa” no Bitrix (vincula as deals dessa empresa)<select name="bitrixCompanyId"><option value="">— nenhuma —</option>${s.minhas.map(m=>`<option value="${m.id}" ${m.id===e.bitrixCompanyId?'selected':''}>${esc(m.nome)}</option>`).join('')}</select></label><label class="inline"><input type="checkbox" name="ativa" ${e.ativa?'checked':''}> Ativa</label>`,v=>api('PUT','/empresas/'+e.id,{nome:v.nome,cnpj:v.cnpj,ativa:v.ativa,bitrixCompanyId:v.bitrixCompanyId}).then(async()=>{Object.assign(B,await api('GET','/bootstrap'));fillEmp()}))});
    onAll('[data-key]','click',b=>{const e=B.empresas.find(x=>x.id===b.dataset.key);ask(`Asaas — ${e.nome}`,`${sel('env','Ambiente',[['sandbox','Sandbox (testes)'],['production','Produção']],e.asaas.env)}<label style="grid-column:1/-1">Chave de API ${e.asaas.configurado?`(atual ${e.asaas.dica})`:''}<input name="apiKey" type="password" autocomplete="off" placeholder="$aact_..."></label>`,async v=>{await api('PUT',`/empresas/${e.id}/asaas`,v);const t=await api('POST',`/empresas/${e.id}/asaas/test`);toast(`Chave válida${t.nome?' · '+t.nome:''} · saldo ${brl(t.saldo)}`);Object.assign(B,await api('GET','/bootstrap'))},'Salvar e testar')});
    onAll('[data-rmkey]','click',b=>confirm('Remover a chave do Asaas desta empresa?')&&act(async()=>{await api('DELETE',`/empresas/${b.dataset.rmkey}/asaas`);Object.assign(B,await api('GET','/bootstrap'))},'Chave removida'));
    $('#folhaAuto').onchange=e=>api('PUT','/config',{folhaAuto:e.target.checked}).then(()=>toast('Salvo')).catch(x=>toast(x.message,1))});
  return `${naoVinc.length?`<div class="alert info">${ic('bld')}<span>${naoVinc.length} “Minha empresa” do Bitrix ainda não cadastrada(s): ${naoVinc.map(m=>esc(m.nome)).join(', ')}. <button class="btn sm imp">Importar agora</button></span></div>`:''}
  ${card('Empresas',table(['Empresa','CNPJ','No Bitrix','Situação','Asaas',''],B.empresas.map(e=>{const m=s.minhas.find(x=>x.id===e.bitrixCompanyId);return `<tr><td><b>${esc(e.nome)}</b></td><td>${esc(fdoc(e.cnpj)||'—')}</td><td>${m?esc(m.nome):'<span class="mut">por campo de lista</span>'}</td><td>${e.ativa?'<span class="pill p-ok">Ativa</span>':'<span class="pill p-mut">Inativa</span>'}</td><td>${e.asaas.configurado?`<span class="pill p-ok">${e.asaas.env==='production'?'Produção':'Sandbox'} ${esc(e.asaas.dica)}</span>`:'<span class="pill p-mut">Conta padrão</span>'}</td><td class="num"><button class="btn sm" data-ed="${e.id}">Editar</button> <button class="btn sm" data-key="${e.id}">Chave Asaas</button>${e.asaas.configurado?` <button class="btn sm danger" data-rmkey="${e.id}">Remover chave</button>`:''}</td></tr>`}),empty('Nenhuma empresa cadastrada','Importe as “Minhas empresas” do Bitrix ou cadastre manualmente.',s.minhas.length?`<button class="btn pri imp">Importar do Bitrix</button>`:'')),
    `<div class="row"><button class="btn" id="syncCampo" title="Cria/atualiza o campo de lista no Bitrix">Atualizar campo no Bitrix</button><button class="btn pri" id="novaEmp">+ Empresa</button></div>`,'A empresa de cada deal vem do campo de lista “CR · Empresa”; se ele estiver vazio, vale a “Minha empresa” da deal. Cada empresa pode ter a sua chave do Asaas.')}
  ${card('Ajustes',`<div class="cb"><label class="inline"><input type="checkbox" id="folhaAuto" ${B.config.folhaAuto!==false?'checked':''}> Lançar a folha de pagamento automaticamente todo mês</label></div>`)}`};

function fillEmp(){const s=$('#emp');s.innerHTML=`<option value="todas">Todas as empresas</option>`+B.empresas.filter(e=>e.ativa).map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join('');if(!B.empresas.some(e=>e.id===EMP))EMP='todas';s.value=EMP}
async function render(){const m=$('#main');if(BUSY)return;BUSY=true;const scroll=scrollY;
  try{if(DEAL){m.innerHTML=SK;m.innerHTML=contratoBox(await api('GET','/contratos/'+DEAL));return}
    $('#ttl').textContent=(NAV.find(n=>n[0]===TAB)||[])[1]||'';$('#empWrap').style.display=TAB==='empresas'?'none':'';
    if(m.dataset.t!==TAB)m.innerHTML=SK;
    const h=await VIEWS[TAB]();m.innerHTML=h;m.dataset.t=TAB;scrollTo(0,scroll);
  }catch(e){m.innerHTML=`<div class="alert alta">${ic('alert')}<span>${esc(e.message)}</span></div>${/Bitrix24 não configurado/.test(e.message)?'<p class="mut">Abra <a href="/">Cobranças</a> → Configurações e informe o webhook do Bitrix24.</p>':''}`}finally{BUSY=false}}
(async()=>{try{Object.assign(B,await api('GET','/bootstrap'))}catch(e){toast(e.message,1)}
  if(DEAL){document.querySelector('aside').hidden=true;document.querySelector('.app').style.display='block';$('#empWrap').hidden=true;$('#menu').hidden=true;$('#reload').hidden=true;$('#ttl').textContent='Contrato';render();return}
  fillEmp();$('#emp').onchange=e=>{EMP=e.target.value;ls.set('fin.emp',EMP);VIEWS.contratos.open=null;render()};$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#reload').onclick=()=>render();drawNav();render()})();
</script>
</body>
