<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Financeiro</title>
<link rel="icon" href="/_gw/icon">
<style>
:root{
  --bg:#f5f6fa;--surface:#fff;--surface2:#f8f9fc;--ink:#10162b;--ink2:#4a5270;--mut:#6a7390;--line:#e6e9f2;--line2:#d9deeb;
  --brand:#3b4fd8;--brand2:#5b6cf0;--brandbg:#eceefd;--side:#10162b;--sideink:#c9d0ea;--sidemut:#8a94b8;--sidehi:#1c2547;
  --s1:#2a78d6;--s2:#eb6834;
  --ok:#0b7f46;--okbg:#e2f6ec;--warn:#9a5b00;--warnbg:#fff3dc;--bad:#c02626;--badbg:#fde9e9;--info:#1d4ed8;--infobg:#e8f0fe;--neutral:#4a5270;--neutralbg:#eef0f6;
  --shadow:0 1px 2px rgba(16,22,43,.05),0 10px 28px -16px rgba(16,22,43,.18);--r:14px;
}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0b0e1a;--surface:#141a2c;--surface2:#192036;--ink:#eef1fb;--ink2:#b7bfd9;--mut:#8f99ba;--line:#242c45;--line2:#303a5a;
  --brand:#8a95ff;--brand2:#a6aeff;--brandbg:#222850;--side:#0a0d18;--sidehi:#182040;
  --s1:#3987e5;--s2:#d95926;
  --ok:#4cd694;--okbg:#0f3023;--warn:#f5b94a;--warnbg:#352a10;--bad:#ff8a8a;--badbg:#3b1717;--info:#7aa8ff;--infobg:#16264d;--neutral:#b7bfd9;--neutralbg:#222a40;
  --shadow:0 1px 2px rgba(0,0,0,.35),0 12px 30px -16px rgba(0,0,0,.7)}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
svg{display:block}.ic{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
aside{background:var(--side);color:var(--sideink);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 10px 16px;color:#fff;font-weight:750;font-size:16px;letter-spacing:-.01em}
.logo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand2),#8a5cf0);display:grid;place-items:center;color:#fff}
aside nav{display:flex;flex-direction:column;gap:2px}
aside nav button{display:flex;align-items:center;gap:11px;border:0;background:transparent;color:var(--sideink);padding:9px 12px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;text-align:left}
aside nav button:hover{background:var(--sidehi);color:#fff}aside nav button[aria-current=page]{background:var(--sidehi);color:#fff;box-shadow:inset 3px 0 0 var(--brand2)}
.sep{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--sidemut);padding:14px 12px 4px}
.sidefoot{margin-top:auto;padding:12px;border-top:1px solid #ffffff1a;font-size:12px;color:var(--sidemut);display:flex;flex-direction:column;gap:6px}
.dotl{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;background:#6b7390}.dotl.ok{background:#4cd694}.dotl.bad{background:#ff8a8a}
.col{min-width:0}
.top{position:sticky;top:0;z-index:15;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:12px 24px;flex-wrap:wrap}
.top h1{margin:0;font-size:19px;letter-spacing:-.02em;flex:1;min-width:140px}
.btn.menu{display:none}
main{padding:22px 24px 48px;max-width:1280px}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:7px 13px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}.btn.pri:hover{color:#fff;filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}.btn.danger:hover{border-color:var(--bad);color:var(--bad)}.btn:disabled{opacity:.5;cursor:not-allowed}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;max-width:100%}
:is(button,a,input,select,textarea):focus-visible{outline:2px solid var(--brand);outline-offset:2px}
label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:650;color:var(--ink2)}label.inline{flex-direction:row;align-items:center;gap:8px;font-weight:500;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden}
.ch{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);flex-wrap:wrap}.ch h2{margin:0;font-size:15px;letter-spacing:-.01em}.cb{padding:18px}
.sub{color:var(--mut);font-size:12.5px;margin:2px 0 0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:16px}
.g2{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g2 .card{margin-bottom:0}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;gap:12px}
.kpi .ico{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;flex:none;background:var(--brandbg);color:var(--brand)}
.kpi .l{font-size:12px;color:var(--mut);font-weight:650}.kpi .v{font-size:22px;font-weight:760;letter-spacing:-.02em;line-height:1.25}.kpi .s{font-size:12px;color:var(--mut)}
.kpi.bad .ico{background:var(--badbg);color:var(--bad)}.kpi.ok .ico{background:var(--okbg);color:var(--ok)}.kpi.warn .ico{background:var(--warnbg);color:var(--warn)}
.pos{color:var(--ok)}.neg{color:var(--bad)}.mut{color:var(--mut)}
.tbl{width:100%;border-collapse:collapse}.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);text-align:left;padding:10px 14px;background:var(--surface2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.tbl tr:last-child td{border-bottom:0}.tbl tbody tr:hover{background:var(--surface2)}
.tbl th.num,.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.wrap{overflow-x:auto}.tbl td.emp{max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tbl .t2{display:block;color:var(--mut);font-size:12px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:650;white-space:nowrap}
.p-ok{background:var(--okbg);color:var(--ok)}.p-warn{background:var(--warnbg);color:var(--warn)}.p-bad{background:var(--badbg);color:var(--bad)}.p-info{background:var(--infobg);color:var(--info)}.p-mut{background:var(--neutralbg);color:var(--neutral)}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:start}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.alert{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;margin-bottom:10px;font-weight:550}.alert.alta{background:var(--badbg);color:var(--bad)}.alert.media{background:var(--warnbg);color:var(--warn)}.alert.info{background:var(--infobg);color:var(--info)}
.empty{padding:34px 20px;text-align:center;color:var(--mut)}.empty b{display:block;color:var(--ink);margin-bottom:4px;font-size:15px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid var(--line2);background:var(--surface);padding:6px 12px;border-radius:99px;cursor:pointer;font:inherit;font-weight:600;color:var(--ink2)}
.chip[aria-pressed=true]{background:var(--brandbg);border-color:var(--brand);color:var(--brand)}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.search{min-width:220px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}.steps li{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.steps .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--neutralbg);color:var(--neutral);flex:none}.steps .done .n{background:var(--okbg);color:var(--ok)}.steps li div{flex:1}.steps small{display:block;color:var(--mut)}
.list{list-style:none;margin:0;padding:0}.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 18px;border-bottom:1px solid var(--line)}.list li:last-child{border-bottom:0}.list .t2{color:var(--mut);font-size:12px;display:block}
.bar{height:8px;border-radius:99px;background:var(--neutralbg);overflow:hidden}.bar i{display:block;height:100%;border-radius:99px;background:var(--s1)}
.hrow{display:grid;grid-template-columns:130px 1fr 110px;gap:10px;align-items:center;padding:6px 0}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin:0}.dl dt{font-size:12px;color:var(--mut);font-weight:600}.dl dd{margin:0;font-weight:620;word-break:break-word}
dialog.wide{width:min(900px,96vw)}dialog{max-height:94vh;overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);color:var(--ink);padding:20px;width:min(580px,94vw)}dialog::backdrop{background:rgba(8,10,20,.55)}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:92vw;font-weight:600}#toast.on{opacity:1}
.sk{height:96px;border-radius:var(--r);background:linear-gradient(90deg,var(--surface2),var(--line),var(--surface2));background-size:200% 100%;animation:sk 1.2s infinite;margin-bottom:14px}@keyframes sk{to{background-position:-200% 0}}
.chart{width:100%;height:auto}.chart text{fill:var(--mut);font-size:11px}.tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:9px;font-size:12px;z-index:70;display:none;line-height:1.5}
.legend{display:flex;gap:16px;font-size:12px;color:var(--ink2);margin-top:8px;flex-wrap:wrap}.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
textarea{width:100%;min-height:64px;resize:vertical}.full{grid-column:1/-1}.pv input{width:100%;min-width:90px}.pv td{padding:6px 8px}.hint{font-size:12px;color:var(--mut);font-weight:500}.sub2{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}.acc{border:1px solid var(--line);border-radius:var(--r);padding:16px;background:var(--surface);box-shadow:var(--shadow)}.acc.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brandbg)}.acc h3{margin:0;font-size:15px}.acc .sal{font-size:22px;font-weight:760;margin:8px 0 2px}.accs{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-bottom:16px}.tot{font-weight:750}
details summary{cursor:pointer;color:var(--brand);font-weight:600;padding:8px 0}
@media(max-width:900px){.btn.menu{display:inline-flex}.app{grid-template-columns:1fr}aside{position:fixed;left:0;top:0;z-index:40;width:250px;transform:translateX(-100%);transition:.2s}aside.open{transform:none}main{padding:16px}.top{padding:10px 16px}.hrow{grid-template-columns:90px 1fr 90px}}
@media print{aside,.top,.tools,.btn{display:none!important}.app{display:block}.card{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
<aside id="side"><div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg></span>Financeiro</div><nav id="nav"></nav>
  <div class="sidefoot" id="foot"></div></aside>
<div class="col">
  <div class="top"><button class="btn menu" id="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1 id="ttl">Painel</h1>
    <label class="inline" id="empWrap">Empresa <select id="emp" aria-label="Empresa"></select></label>
    <button class="btn" id="reload" title="Atualizar dados" aria-label="Atualizar dados"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg></button>
    <a class="btn" href="/">Cobranças</a></div>
  <main id="main"></main>
</div></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><div class="tip" id="tip"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brk=v=>{v=Number(v||0);const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(1).replace('.',',')+' mi':a>=1e3?(v/1e3).toFixed(a>=1e4?0:1).replace('.',',')+' mil':String(Math.round(v))};
const fdoc=d=>{d=String(d||'').replace(/\D/g,'');return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):d.length===14?d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):d};
const dt=d=>d?d.split('-').reverse().join('/'):'—';
const mesNome=m=>['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m.slice(5)-1]+'/'+m.slice(2,4);
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const P=new URLSearchParams(location.search), DEAL=P.get('deal');
let B={empresas:[],config:{},categorias:[],hoje:'',host:''}, EMP=ls.get('fin.emp')||'todas', TAB=ls.get('fin.tab')||'painel', BUSY=false, ST=null;
async function api(m,u,b){const r=await fetch('/api/fin'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Erro '+r.status));return j}
const q=(x='')=>`?empresa=${encodeURIComponent(EMP)}${x}`;
function toast(m,err){const t=$('#toast');t.textContent=m;t.style.background=err?'var(--bad)':'';t.style.color=err?'#fff':'';t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),4200)}
const act=async(fn,ok)=>{try{await fn();if(ok)toast(ok);await render()}catch(e){toast(e.message,1)}};
const I={
  chart:'<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',inbox:'<path d="M3 13l3-8h12l3 8v6H3z"/><path d="M3 13h5l1 3h6l1-3h5"/>',out:'<path d="M4 7h16v12H4z"/><path d="M4 11h16M8 15h3"/>',wallet:'<path d="M3 7h16a2 2 0 012 2v9H5a2 2 0 01-2-2z"/><path d="M3 7l12-3v3M16 13h2"/>',
  file:'<path d="M7 3h8l4 4v14H7z"/><path d="M14 3v5h5M10 13h6M10 17h6"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.6-3.6 3.2-5.5 6.5-5.5s5.9 1.9 6.5 5.5M17 11a3 3 0 100-6M21.5 19c-.3-2.4-1.6-4-3.5-4.7"/>',
  doc:'<path d="M6 3h9l3 3v15H6z"/><path d="M9 11h6M9 15h6"/>',bld:'<path d="M4 21V5l8-2v18M12 9l8 2v10M8 9h1M8 13h1M8 17h1M16 15h1M16 18h1"/>',alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',link:'<path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/>',bank:'<path d="M3 10l9-6 9 6M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',trend:'<path d="M3 17l6-6 4 4 8-9"/>',cal:'<path d="M4 6h16v14H4zM4 10h16M8 3v4M16 3v4"/>'};
const ic=n=>`<svg class="ic" viewBox="0 0 24 24">${I[n]||''}</svg>`;
const SK='<div class="sk"></div><div class="sk"></div><div class="sk" style="height:260px"></div>';
const PILL={paga:['ok','Paga'],pago:['ok','Pago'],aberta:['info','Em aberto'],aberto:['info','Em aberto'],a_vencer:['warn','Vence em breve'],vencida:['bad','Vencida'],atrasado:['bad','Atrasado'],cancelada:['mut','Cancelada'],cancelado:['mut','Cancelado'],vigente:['ok','Vigente'],vencendo:['warn','Vencendo'],vencido:['bad','Vencido'],sem_data:['mut','Sem vencimento']};
const pl=s=>{const[c,t]=PILL[s]||['mut',s];return `<span class="pill p-${c}">${t}</span>`};
const empNome=id=>(B.empresas.find(e=>e.id===id)||{}).nome||'';
const empOpts=(sel,blank)=>(blank?'<option value="">—</option>':'')+B.empresas.filter(e=>e.ativa).map(e=>`<option value="${e.id}" ${e.id===sel?'selected':''}>${esc(e.nome)}</option>`).join('');
const FORMAS=[['PIX','Pix'],['BOLETO','Boleto'],['CARTAO','Cartão'],['TRANSFERENCIA','Transferência'],['DINHEIRO','Dinheiro']];
const fnome=c=>(FORMAS.find(f=>f[0]===c)||[0,c||'—'])[1];
const dealUrl=id=>B.host?`https://${B.host}/crm/deal/details/${id}/`:'#';
const empty=(t,s,cta='')=>`<div class="empty"><b>${t}</b>${s||''}${cta?`<div style="margin-top:12px">${cta}</div>`:''}</div>`;
const table=(cols,rows,emptyHtml)=>rows.length?`<div class="wrap"><table class="tbl"><thead><tr>${cols.map(c=>`<th class="${c[0]==='>'?'num':''}">${esc(c.replace(/^>/,''))}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:emptyHtml||empty('Nada por aqui ainda.');
const kpi=(i,l,v,s,tone='')=>`<div class="kpi ${tone}"><div class="ico">${ic(i)}</div><div><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s||'&nbsp;'}</div></div></div>`;
const card=(title,body,right='',sub='')=>`<section class="card"><div class="ch"><div><h2>${title}</h2>${sub?`<p class="sub">${sub}</p>`:''}</div>${right}</div>${body}</section>`;
function ask(title,html,onOk,okLabel='Salvar',wide=false){const f=$('#dlgForm');$('#dlg').classList.toggle('wide',wide);f.innerHTML=`<h2 style="margin:0 0 14px;font-size:17px">${esc(title)}</h2><div class="form">${html}</div><div class="row" style="margin-top:18px;justify-content:flex-end"><button class="btn" value="cancel" formnovalidate>Cancelar</button><button class="btn pri" id="dlgOk" value="ok">${okLabel}</button></div>`;
  const d=$('#dlg');d.showModal();f.onsubmit=async ev=>{ev.preventDefault();const v=Object.fromEntries([...f.querySelectorAll('[name]')].map(i=>[i.name,i.type==='checkbox'?i.checked:i.value]));const b=$('#dlgOk');b.disabled=true;try{await onOk(v);d.close();await render()}catch(e){toast(e.message,1)}finally{b.disabled=false}}}
document.addEventListener('click',e=>{if(e.target.value==='cancel')$('#dlg').close()});
const fld=(n,l,t='text',v='',x='')=>`<label>${l}<input name="${n}" type="${t}" value="${esc(v)}" ${x}></label>`;
const sel=(n,l,o,v)=>`<label>${l}<select name="${n}">${o.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${esc(x[1])}</option>`).join('')}</select></label>`;
const onAll=(s,ev,fn)=>document.querySelectorAll(s).forEach(el=>el['on'+ev]=()=>fn(el));
const norm=t=>String(t||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();

/* ---------- gráficos (SVG, tooltip, tabela equivalente) ---------- */
function tipOn(el,html){const t=$('#tip');const mv=e=>{t.style.left=Math.min(innerWidth-190,e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px'};el.onmouseenter=e=>{t.innerHTML=html;t.style.display='block';mv(e)};el.onmousemove=mv;el.onmouseleave=()=>t.style.display='none'}
function cashChart(L){const W=760,H=270,pl=54,pr=14,pt=14,pb=30,n=L.length,cw=(W-pl-pr)/n;
  const vals=L.flatMap(l=>[l.entradaReal+l.entradaPrev,l.saidaReal+l.saidaPrev,l.saldo]);const mx=Math.max(1,...vals),mn=Math.min(0,...vals),rg=mx-mn||1;
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/rg),ticks=[0,.25,.5,.75,1].map(t=>mn+rg*t);
  const bw=Math.min(22,cw/3);let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas, saídas e saldo por mês">`;
  for(const t of ticks)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${brk(t)}</text>`;
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line2)"/>`;
  L.forEach((l,i)=>{const cx=pl+cw*i+cw/2,e=l.entradaReal+l.entradaPrev,o=l.saidaReal+l.saidaPrev;
    s+=`<rect x="${cx-bw-1}" y="${Math.min(y(e),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(0)-y(e)))}" rx="4" fill="var(--s1)" ${l.futuro?'fill-opacity=".72"':''}/><rect x="${cx+1}" y="${Math.min(y(o),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(0)-y(o)))}" rx="4" fill="var(--s2)" ${l.futuro?'fill-opacity=".72"':''}/>`;
    s+=`<text x="${cx}" y="${H-10}" text-anchor="middle" ${l.atual?'style="font-weight:700;fill:var(--ink)"':''}>${mesNome(l.mes)}</text>`;});
  const pts=L.map((l,i)=>[pl+cw*i+cw/2,y(l.saldo)]);s+=`<polyline fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"/>`);
  L.forEach((l,i)=>s+=`<rect class="hit" data-i="${i}" x="${pl+cw*i}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent"/>`);
  return s+'</svg><div class="legend"><span><i style="background:var(--s1)"></i>Entradas</span><span><i style="background:var(--s2)"></i>Saídas</span><span><i style="background:var(--ink2);border-radius:50%"></i>Saldo acumulado</span><span class="mut">Meses futuros em tom mais claro</span></div>'}

  const ex=V.sel?await api('GET',`/contas/${V.sel}/extrato`):null,trs=await api('GET','/transferencias'+q());

  ${card('Extrato'+(ex?` — ${esc(ex.conta)}`:''),ex?table(['Data','Descrição','Contraparte','>Valor','>Saldo'],[`<tr><td colspan="4" class="mut">Saldo inicial</td><td class="num">${brl(ex.saldoInicial)}</td></tr>`,...ex.linhas.map(l=>`<tr><td>${dt(l.data)}</td><td>${esc(l.descricao)}</td><td>${esc(l.contra||'—')}</td><td class="num ${l.valor<0?'neg':'pos'}">${brl(l.valor)}</td><td class="num"><b>${brl(l.saldo)}</b></td></tr>`)],empty('Sem movimentos')):empty('Nenhuma conta bancária','Cadastre as contas da empresa (banco, agência, conta e saldo inicial) para acompanhar o saldo, fazer transferências e ver o extrato. Ao pagar ou receber um lançamento, escolha a conta para o movimento entrar aqui.',`<button class="btn pri" onclick="$('#novaConta').click()">+ Conta bancária</button>`),`<div class="row"><button class="btn" id="transf" ${ativas.length<2?'disabled title="Cadastre ao menos duas contas"':''}>Transferir entre contas</button><button class="btn pri" id="novaConta">+ Conta</button></div>`,'Só entram no extrato as baixas e transferências com conta informada.')}
  ${trs.length?card('Transferências',table(['Data','De','Para','Obs.','>Valor',''],trs.map(t=>`<tr><td>${dt(t.data)}</td><td>${esc(contaNome(t.de))}</td><td>${esc(contaNome(t.para))}</td><td>${esc(t.obs||'—')}</td><td class="num"><b>${brl(t.valor)}</b></td><td class="num"><button class="btn sm danger" data-deltr="${t.id}" aria-label="Excluir">✕</button></td></tr>`))):''}`};

async function lerOfx(file){const buf=await file.arrayBuffer();
  try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{return new TextDecoder('windows-1252').decode(buf)}}   // arquivos de banco costumam ser Windows-1252 mesmo; o que for UTF-8 válido é lido como UTF-8
VIEWS.conciliacao=async()=>{await refreshB();const V=VIEWS.conciliacao;V.st??='pendente';

  if(!contas.length)return card('Conciliação bancária',empty('Cadastre uma conta bancária primeiro','A conciliação compara o extrato do banco (arquivo OFX) com os lançamentos do app. Cadastre a conta em Configurações → Contas bancárias.',`<button class="btn pri" onclick="go('config')">Ir para Configurações</button>`));

    $('#ofxFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const r=await api('POST','/conciliacao/importar',{contaId:V.conta,ofx:await lerOfx(f)});toast(`${r.novas} lançamento(s) importado(s)${r.repetidas?`, ${r.repetidas} já estavam`:''}${r.anteriores?`, ${r.anteriores} anterior(es) ao saldo inicial ignorado(s)`:''}`);if(r.aviso)setTimeout(()=>toast(r.aviso,1),2200);render()}catch(x){toast(x.message,1)}};
    $('#cAuto').onclick=()=>act(async()=>{const r=await api('POST','/conciliacao/auto',{contaId:V.conta});toast(r.conciliadas?`${r.conciliadas} linha(s) conciliada(s) automaticamente`:'Nenhuma linha com correspondência segura')});

  return `<div class="grid">${kpi('bank','Saldo no app',brl(s.saldo),esc(conta.nome))}${s.saldoExtrato!==undefined?kpi('doc','Saldo no extrato (OFX)',brl(s.saldoExtrato),s.saldoExtratoEm?`em ${dt(s.saldoExtratoEm)}`:'',dif===0?'ok':'warn'):kpi('doc','Saldo no extrato','—','importe um OFX')}${dif!==null?kpi('alert','Diferença',brl(dif),dif===0?'saldos conferem':'concilie as pendências para zerar',dif===0?'ok':'warn'):''}${kpi('inbox','Pendentes',ct.pendente||0,`${ct.conciliado||0} conciliadas · ${ct.ignorado||0} ignoradas`,(ct.pendente||0)?'warn':'ok')}</div>
  ${card('Conciliação bancária',`<div class="cb" style="padding-bottom:0"><div class="chips">${[['pendente','Pendentes'],['conciliado','Conciliadas'],['ignorado','Ignoradas'],['todos','Todas']].map(([k,t])=>`<button class="chip" aria-pressed="${V.st===k}" data-st="${k}">${t}${k!=='todos'&&ct[k]!==undefined?` <b>${ct[k]}</b>`:''}</button>`).join('')}</div></div>

  `<div class="row"><select id="cConta" aria-label="Conta">${contas.map(c=>opt(c.id,`${c.nome} — ${empNome(c.empresaId)}`,V.conta)).join('')}</select><button class="btn" id="cAuto">Conciliar automaticamente</button><label class="btn pri" style="cursor:pointer">Importar extrato OFX<input id="ofxFile" type="file" accept=".ofx,.OFX,.txt" hidden></label></div>`,'Compare o extrato do banco com os lançamentos. Ao conciliar, o lançamento é baixado na conta com a data e o valor do banco (diferença vira juros ou desconto).')}`};
