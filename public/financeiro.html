.kt.bad .ico{background:var(--badbg);color:var(--bad)}.kt.ok .ico{background:var(--okbg);color:var(--ok)}.kt.warn .ico{background:var(--warnbg);color:var(--warn)}

.seg3{display:grid;grid-template-columns:repeat(auto-fit,minmax(95px,1fr));gap:8px}.seg3 button{border:1px solid var(--line);border-left:4px solid var(--c);background:var(--surface2);border-radius:10px;padding:8px 10px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}.seg3 b{display:block;font-size:20px}.seg3 span{font-size:11.5px;color:var(--mut)}

<body>
<div class="app">
<aside id="side"><div class="brand"><span class="logo"><svg class="ic" viewBox="0 0 24 24"><path d="M3 17l5-5 4 4 8-9"/><path d="M15 7h5v5"/></svg></span>Financeiro</div><nav id="nav"></nav>
  <div class="sidefoot" id="foot"></div></aside>
<div class="col">
  <div class="top"><button class="btn menu" id="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><h1 id="ttl">Painel</h1>
    <label class="inline" id="empWrap">Empresa <select id="emp" aria-label="Empresa"></select></label>
    <button class="btn" id="reload" title="Atualizar dados" aria-label="Atualizar dados"><svg class="ic" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.3 5.7M20 4v7h-7"/></svg></button>
    </div>
  <main id="main"></main>
</div></div>
<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>
<div id="toast" role="status" aria-live="polite"></div><div class="tip" id="tip"></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brk=v=>{v=Number(v||0);const a=Math.abs(v);return a>=1e6?(v/1e6).toFixed(1).replace('.',',')+' mi':a>=1e3?(v/1e3).toFixed(a>=1e4?0:1).replace('.',',')+' mil':String(Math.round(v))};
const fdoc=d=>{d=String(d||'').replace(/\D/g,'');return d.length===11?d.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):d.length===14?d.replace(/(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})/,'$1.$2.$3/$4-$5'):d};
const dt=d=>d?d.split('-').reverse().join('/'):'—';
const mesNome=m=>['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'][+m.slice(5)-1]+'/'+m.slice(2,4);
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const P=new URLSearchParams(location.search), DEAL=P.get('deal'), EMBED=!!(DEAL||P.get('company')||P.get('contact'));
let B={empresas:[],config:{},categorias:[],hoje:'',host:''}, EMP=ls.get('fin.emp')||'todas', TAB=ls.get('fin.tab')||'painel', BUSY=false, ST=null;
async function api(m,u,b){const r=await fetch('/api/fin'+u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Erro '+r.status));return j}
const q=(x='')=>`?empresa=${encodeURIComponent(EMP)}${x}`;
function toast(m,err){const t=$('#toast');t.textContent=m;t.style.background=err?'var(--bad)':'';t.style.color=err?'#fff':'';t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),4200)}
const act=async(fn,ok)=>{try{await fn();if(ok)toast(ok);await render()}catch(e){toast(e.message,1)}};

/* ---------- gráficos (SVG, tooltip, tabela equivalente) ---------- */
function tipOn(el,html){const t=$('#tip');const mv=e=>{t.style.left=Math.min(innerWidth-190,e.clientX+14)+'px';t.style.top=(e.clientY+14)+'px'};el.onmouseenter=e=>{t.innerHTML=html;t.style.display='block';mv(e)};el.onmousemove=mv;el.onmouseleave=()=>t.style.display='none'}
function cashChart(L){const W=760,H=270,pl=54,pr=14,pt=14,pb=30,n=L.length,cw=(W-pl-pr)/n;
  const vals=L.flatMap(l=>[l.entradaReal+l.entradaPrev,l.saidaReal+l.saidaPrev,l.saldo]);const mx=Math.max(1,...vals),mn=Math.min(0,...vals),rg=mx-mn||1;
  const y=v=>pt+(H-pt-pb)*(1-(v-mn)/rg),ticks=[0,.25,.5,.75,1].map(t=>mn+rg*t);
  const bw=Math.min(22,cw/3);let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Entradas, saídas e saldo por mês">`;
  for(const t of ticks)s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-8}" y="${y(t)+4}" text-anchor="end">${brk(t)}</text>`;
  s+=`<line x1="${pl}" x2="${W-pr}" y1="${y(0)}" y2="${y(0)}" stroke="var(--line2)"/>`;
  L.forEach((l,i)=>{const cx=pl+cw*i+cw/2,e=l.entradaReal+l.entradaPrev,o=l.saidaReal+l.saidaPrev;
    s+=`<rect x="${cx-bw-1}" y="${Math.min(y(e),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(0)-y(e)))}" rx="4" fill="var(--s1)" ${l.futuro?'fill-opacity=".72"':''}/><rect x="${cx+1}" y="${Math.min(y(o),y(0))}" width="${bw}" height="${Math.max(1,Math.abs(y(0)-y(o)))}" rx="4" fill="var(--s2)" ${l.futuro?'fill-opacity=".72"':''}/>`;
    s+=`<text x="${cx}" y="${H-10}" text-anchor="middle" ${l.atual?'style="font-weight:700;fill:var(--ink)"':''}>${mesNome(l.mes)}</text>`;});
  const pts=L.map((l,i)=>[pl+cw*i+cw/2,y(l.saldo)]);s+=`<polyline fill="none" stroke="var(--ink2)" stroke-width="2" stroke-linejoin="round" points="${pts.map(p=>p.join(',')).join(' ')}"/>`;
  pts.forEach(p=>s+=`<circle cx="${p[0]}" cy="${p[1]}" r="4" fill="var(--surface)" stroke="var(--ink2)" stroke-width="2"/>`);
  L.forEach((l,i)=>s+=`<rect class="hit" data-i="${i}" x="${pl+cw*i}" y="${pt}" width="${cw}" height="${H-pt-pb}" fill="transparent"/>`);
  return s+'</svg><div class="legend"><span><i style="background:var(--s1)"></i>Entradas</span><span><i style="background:var(--s2)"></i>Saídas</span><span><i style="background:var(--ink2);border-radius:50%"></i>Saldo acumulado</span><span class="mut">Meses futuros em tom mais claro</span></div>'}
function cashTips(L){document.querySelectorAll('.chart .hit').forEach(el=>{const l=L[+el.dataset.i];tipOn(el,`<b>${mesNome(l.mes)}</b><br>Entradas ${brl(l.entradaReal+l.entradaPrev)}<br>Saídas ${brl(l.saidaReal+l.saidaPrev)}<br>Resultado ${brl(l.resultado)}<br>Saldo ${brl(l.saldo)}`)})}
const cashTable=L=>table(['Mês','>Entradas realizadas','>Entradas previstas','>Saídas realizadas','>Saídas previstas','>Resultado','>Saldo'],L.map(l=>`<tr ${l.atual?'style="background:var(--brandbg)"':''}><td><b>${mesNome(l.mes)}</b>${l.atual?' <span class="pill p-info">atual</span>':''}</td><td class="num">${brl(l.entradaReal)}</td><td class="num">${brl(l.entradaPrev)}</td><td class="num">${brl(l.saidaReal)}</td><td class="num">${brl(l.saidaPrev)}</td><td class="num ${l.resultado<0?'neg':'pos'}">${brl(l.resultado)}</td><td class="num ${l.saldo<0?'neg':''}"><b>${brl(l.saldo)}</b></td></tr>`));
const hbars=(rows,color='var(--s1)')=>{const m=Math.max(1,...rows.map(r=>r.valor));return rows.map(r=>`<div class="hrow"><span title="${esc(r.nome)}" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.nome)}</span><div class="bar"><i style="width:${Math.max(2,r.valor/m*100)}%;background:${color}"></i></div><span class="num">${brl(r.valor)}</span></div>`).join('')};

/* ---------- paginação (todas as tabelas de lista) ---------- */
const PG={};let PGON=false,PGIDX=0,PGBASE='';
const resetPg=()=>{for(const k in PG)PG[k].n=1};
function paginar(rows){const key=`${PGBASE}#${PGIDX++}`,size=+(ls.get('fin.pgsize')||25),p=PG[key]||(PG[key]={n:1});const pages=Math.max(1,Math.ceil(rows.length/size));if(p.n>pages)p.n=pages;const from=(p.n-1)*size;
  const html=rows.length<=10?'':`<div class="pager" data-pgk="${key}"><span class="mut">${from+1}–${Math.min(rows.length,from+size)} de ${rows.length}</span><div class="row"><label class="inline" style="font-size:12px">Por página <select data-pgsize aria-label="Itens por página">${[10,25,50,100].map(n=>`<option ${n===size?'selected':''}>${n}</option>`).join('')}</select></label><button class="btn sm" data-pgn="-1" ${p.n<=1?'disabled':''}>‹ Anterior</button><span>Página ${p.n} de ${pages}</span><button class="btn sm" data-pgn="1" ${p.n>=pages?'disabled':''}>Próxima ›</button></div></div>`;
  return {rows:rows.slice(from,from+size),html}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pgn]');if(!b)return;const k=b.closest('.pager').dataset.pgk;PG[k].n+=+b.dataset.pgn;render(true)});

function pickerHtml(nome,label,valor,dica){return `<label class="full">${label}<div class="picker"><input name="${nome}" value="${esc(valor||'')}" autocomplete="off" placeholder="${dica}" maxlength="120"><input type="hidden" name="${nome}Tipo"><input type="hidden" name="${nome}Id"><div class="pk-res" hidden role="listbox"></div></div><span class="hint pk-hint"></span></label>`}
function bindPicker(nome,fonte,rotuloNovo){const f=$('#dlgForm'),inp=f.querySelector(`[name="${nome}"]`),tp=f.querySelector(`[name="${nome}Tipo"]`),id=f.querySelector(`[name="${nome}Id"]`),res=inp.parentElement.querySelector('.pk-res'),hint=inp.closest('label').querySelector('.pk-hint');let t;
  const limpa=()=>{tp.value='';id.value=''};
  const escolhe=x=>{inp.value=x.nome;tp.value=x.tipo||'';id.value=x.id||'';res.hidden=true;hint.textContent=x.rotulo||''};
  const mostra=(l,txt)=>{res.innerHTML=l.map((x,i)=>`<button type="button" data-i="${i}"><b>${esc(x.nome)}</b> <span class="mut">${esc(x.rotulo||'')}</span></button>`).join('')+(rotuloNovo&&txt?`<div class="pk-new">${rotuloNovo(txt)}</div>`:'');res.hidden=!l.length&&!(rotuloNovo&&txt);res.querySelectorAll('button').forEach(b=>b.onclick=()=>escolhe(l[+b.dataset.i]))};
  inp.oninput=()=>{limpa();hint.textContent='';clearTimeout(t);const txt=inp.value.trim();if(txt.length<(rotuloNovo?1:2)){res.hidden=true;return}
    t=setTimeout(async()=>{try{mostra(await fonte(txt),txt)}catch(e){res.innerHTML=`<div class="pk-new neg">${esc(e.message)}</div>`;res.hidden=false}},rotuloNovo?80:300)};
  inp.onblur=()=>setTimeout(()=>{res.hidden=true},200);return {escolhe}}
const buscaBitrix=async t=>(await api('GET','/clientes?q='+encodeURIComponent(t))).map(x=>({tipo:x.tipo,id:x.id,nome:x.nome,rotulo:x.tipo==='company'?'Empresa no Bitrix':'Contato no Bitrix'}));
const buscaForn=async t=>CAD_().fornecedores.filter(f=>f.ativa&&norm(f.nome+' '+(f.doc||'')).includes(norm(t))).slice(0,8).map(f=>({tipo:'forn',id:f.id,nome:f.nome,rotulo:f.doc?fdoc(f.doc):'fornecedor cadastrado'}));

/* ---------- editar o contrato (grava na deal do funil do Bitrix) ---------- */
function editContrato(d){const c=d.contrato,cl=d.cliente,demo=!!d.demo;
  ask('Editar contrato',`<p class="full mut" style="margin:0">${demo?'Contrato de demonstração: a alteração fica só no app.':'As alterações são gravadas na <b>deal do funil de Contratos no Bitrix</b> e aparecem lá na hora.'}</p>
   ${fld('titulo','Título*','text',c.titulo,'required maxlength="255"')}${fld('valor','Valor do contrato (R$)','number',c.valor||'','step="0.01" min="0"')}${fld('inicio','Início','date',c.inicio||'')}${fld('venc','Vencimento','date',c.venc||'')}
   ${demo?'':pickerHtml('cli','Cliente (empresa ou contato do Bitrix)',cl.nome,'Digite 2+ letras para buscar')}${demo?'':pickerHtml('resp','Responsável pelo contrato',c.responsavelNome,'Digite o nome do usuário')}
   ${demo?'':`<label>Empresa do financeiro<select name="empresaId"><option value="">— nenhuma —</option>${empOpts(c.empresaId)}</select></label>`}
   <label class="full">Observações<textarea name="obs" maxlength="2000">${esc(c.obs||'')}</textarea></label>`,
  async v=>{const body={titulo:v.titulo,valor:v.valor,inicio:v.inicio,venc:v.venc};if(v.obs!==(c.obs||''))body.obs=v.obs;
    if(!demo){if(v.cli!==cl.nome||v.cliId){if(!v.cliId&&v.cli.trim())throw new Error('Escolha o cliente na lista de resultados do Bitrix (ou apague o campo para tirar o cliente).');body.companyId=v.cliTipo==='company'?v.cliId:'';body.contactId=v.cliTipo==='contact'?v.cliId:''}
      if(v.respId)body.responsavel=v.respId;if((v.empresaId||'')!==(c.empresaId||''))body.empresaId=v.empresaId}
    await api('PUT','/contratos/'+c.id,body);toast(demo?'Contrato atualizado':'Contrato atualizado no Bitrix')},'Salvar',true);
  if(!demo){bindPicker('cli',buscaBitrix);bindPicker('resp',buscaUsuario)}}
document.addEventListener('click',e=>{if(e.target.id==='edCt'&&LASTC)editContrato(LASTC)});

function biCols(serie,sel){const W=720,H=270,pl=50,pr=10,pt=12,pb=28,n=serie.length,cw=(W-pl-pr)/n;const vals=serie.flatMap(s=>[s.receita,s.despesa,s.resultado]);const mx=Math.max(1,...vals),mn=Math.min(0,...vals),rg=mx-mn||1,y=v=>pt+(H-pt-pb)*(1-(v-mn)/rg);const bw=Math.min(24,cw/3.2);

function bindLanc(){let plano=[];const f=$('#dlgForm');

    const body={valor:+g('valor').value,modo:g('modo').value,condicaoId:sf?'cp_vista':(mensal?'':cond),parcelas:sf?1:(+g('parcelas').value||1),base:g('base').value,venc:g('base').value,util:g('util').checked};
    if(!(body.valor>0)||!body.base){plano=[];draw();return}
    try{plano=await api('POST','/parcelas/preview',body);draw()}catch(e){plano=[];draw(e.message)}};

  draw()}

  return `<tr><td>${dt(r.venc)}</td><td><b>${esc(r.descricao)}</b>${r.parcela?` <span class="mut">(${esc(r.parcela)})</span>`:''}${r.parcelaTitulo?` · ${esc(r.parcelaTitulo)}`:''}${r.origem==='folha'?' <span class="pill p-info">Folha</span>':''}${r.obs||r.parcelaObs?` <span title="${esc([r.obs,r.parcelaObs].filter(Boolean).join(' — '))}">📝</span>`:''}<span class="t2">${esc((pagar?r.fornecedor:r.cliente)||'—')}${r.categoria?' · '+esc(r.categoria):''}${r.centro?' · '+esc(r.centro):''}</span></td><td class="emp" title="${esc(r.empresa)}">${esc(r.empresa||'—')}</td><td>${bx?`<a href="${dealUrl(r.dealId)}" target="_blank" rel="noopener">Deal #${r.dealId}</a>`:`${fnome(r.forma)}${r.contaId?`<span class="t2">${esc(contaNome(r.contaId))}</span>`:''}`}</td><td>${pl(st)}${!pagar&&r.credito&&r.credito!==r.venc&&!fechado?`<span class="t2">crédito ${dt(r.credito)}</span>`:''}</td><td class="num"><b>${brl(r.valor)}</b>${!pagar&&r.taxa?`<span class="t2">líq. ${brl(r.valorLiquido)}</span>`:''}</td><td class="num">${bx?`<button class="btn sm" data-cob="${r.dealId}">Cobrança</button>`:`<button class="btn sm" data-ax="${r.id}" title="Anexos">📎${(r.anexos||[]).length||''}</button> `}${bx?'':fechado?(st==='paga'||st==='pago'?`<span class="t2">${dt(r.pagoEm)}${r.valorPago&&r.valorPago!==r.valor?` · ${brl(r.valorPago)}`:''}</span>`:''):`<button class="btn sm" data-bx="${r.id}">${pagar?'Pagar':'Receber'}</button> <button class="btn sm" data-ed="${r.id}">Editar</button> ${pagar&&['BOLETO','PIX'].includes(r.forma)?`<button class="btn sm" data-asaas="${r.id}" title="Pagar pelo Asaas">Asaas</button> `:''}<button class="btn sm danger" data-cancel="${r.id}" aria-label="Cancelar">✕</button>`}</td></tr>`};
const lancCols=['Vencimento','Título','Empresa','Forma / origem','Situação','>Valor',''];
function bindLanc2(tipo,all){const pagar=tipo==='pagar';
  onAll('[data-ax]','click',b=>anexosDialog(tipo,b.dataset.ax));onAll('[data-bx]','click',b=>baixaDialog(tipo,all.find(x=>x.id===b.dataset.bx)));onAll('[data-ed]','click',b=>editLancDialog(tipo,all.find(x=>x.id===b.dataset.ed)));
  onAll('[data-cancel]','click',b=>confirm('Cancelar este lançamento?')&&act(()=>api('POST',`/${tipo}/${b.dataset.cancel}/cancelar`),'Lançamento cancelado'));
  if(pagar)onAll('[data-asaas]','click',b=>ask('Pagar pelo Asaas',`<p class="mut full" style="margin:0">Movimenta dinheiro real da conta Asaas da empresa. Boleto usa a linha digitável; Pix usa a chave informada.</p>${fld('chavePix','Chave Pix (só para Pix)')}${sel('tipoChave','Tipo da chave',[['EVP','Aleatória'],['CPF','CPF'],['CNPJ','CNPJ'],['EMAIL','E-mail'],['PHONE','Telefone']])}<label class="inline full"><input type="checkbox" name="confirmar"> Confirmo o pagamento</label>`,v=>api('POST',`/pagar/${b.dataset.asaas}/asaas`,{chavePix:v.chavePix,tipoChave:v.tipoChave,confirmar:!!v.confirmar}).then(()=>toast('Pagamento enviado ao Asaas')),'Pagar'));
  $('#novo').onclick=()=>lancDialog(tipo);const nb=$('#nfeBtn');if(nb)nb.onclick=nfeFlow;onAll('[data-cob]','click',b=>cobDialog(all.find(x=>x.dealId===+b.dataset.cob)));if(tipo==='receber')bindSinc()}

VIEWS.receber=async()=>{await refreshB();const all=await api('GET','/receber'+q());const V=VIEWS.receber;V.f??='';V.txt??='';
  const defs=[['','Todas',()=>true],['atrasado','Atrasadas',x=>x.status==='atrasado'],['a_vencer','A vencer (7 dias)',x=>x.status==='a_vencer'],['aberto','Em aberto',x=>x.status==='aberto'],['pago','Recebidas',x=>x.status==='pago']];
  const base=all.filter(x=>x.status!=='cancelado'),l=filtrar(base.filter(x=>!V.f||x.status===V.f),V.txt,['cliente','descricao','empresa','categoria','obs']);
  const sum=f=>brl(base.filter(f).reduce((a,x)=>a+x.valor,0));setTimeout(()=>{bindList(V);bindLanc2('receber',all)});
  return `<div class="grid">${kpi('inbox','Em aberto',sum(x=>['aberto','a_vencer','atrasado'].includes(x.status)),'')}${kpi('alert','Atrasado',sum(x=>x.status==='atrasado'),'',base.some(x=>x.status==='atrasado')?'bad':'')}${kpi('trend','Recebido',sum(x=>x.status==='pago'),'','ok')}</div>
  ${card('Contas a receber',`<div class="cb" style="padding-bottom:0"><div class="tools" style="justify-content:space-between">${chips(base,defs,V.f)}<input id="busca" class="search" type="search" placeholder="Buscar cliente, título ou categoria" value="${esc(V.txt)}" aria-label="Buscar"></div></div>
  ${table(lancCols,l.map(r=>lancRow('receber',r)),base.length?empty('Nenhum resultado','Ajuste o filtro ou a busca.'):empty('Ainda não há contas a receber','As cobranças do funil do Bitrix (e as emitidas no Asaas) aparecem aqui sozinhas. Você também pode lançar um recebimento, com parcelas e anotações.'))}`,`<div class="row">${sincBar()}<button class="btn pri" id="novo">+ Novo recebimento</button></div>`,'Cobranças do Bitrix (sincronizadas com o Asaas) e recebimentos lançados aqui. A empresa vem da deal.')}`};

VIEWS.pagar=async()=>{await refreshB();const V=VIEWS.pagar;V.f??='';V.txt??='';const all=await api('GET','/pagar'+q());
  const defs=[['','Todas',x=>x.situacao!=='cancelada'],['vencida','Vencidas',x=>x.situacao==='vencida'],['a_vencer','Vencem em 7 dias',x=>x.situacao==='a_vencer'],['aberta','Em aberto',x=>x.situacao==='aberta'],['paga','Pagas',x=>x.situacao==='paga']];
  const base=all.filter(x=>x.situacao!=='cancelada'),l=filtrar(base.filter(x=>!V.f||x.situacao===V.f),V.txt,['descricao','fornecedor','empresa','categoria','obs']);

  ${card('Contas a pagar',`<div class="cb" style="padding-bottom:0"><div class="tools" style="justify-content:space-between">${chips(base,defs,V.f)}<input id="busca" class="search" type="search" placeholder="Buscar título, fornecedor ou categoria" value="${esc(V.txt)}" aria-label="Buscar"></div></div>
  ${table(lancCols,l.map(r=>lancRow('pagar',r)),base.length?empty('Nenhum resultado','Ajuste o filtro ou a busca.'):empty('Nenhuma conta a pagar','Lance a primeira conta (com parcelas e anotações) ou cadastre funcionários para gerar a folha.'))}`,`<div class="row"><button class="btn" id="nfeBtn">Importar XML (NF-e)</button><button class="btn pri" id="novo">+ Nova conta</button></div>`,'Despesas com parcelas, vencimentos automáticos, forma de pagamento e conta bancária. A folha entra aqui automaticamente.')}`};

VIEWS.bancos=async()=>{await refreshB();const V=VIEWS.bancos;const sal=await api('GET','/contas/saldos'+q());const ativas=sal.filter(c=>c.ativa);
  V.sel=ativas.some(c=>c.id===V.sel)?V.sel:(ativas[0]||{}).id;
  const ex=V.sel?await api('GET',`/contas/${V.sel}/extrato`):null,trs=await api('GET','/transferencias'+q());
  setTimeout(()=>{onAll('[data-sel]','click',b=>{V.sel=b.dataset.sel;render()});const n=$('#novaConta');if(n)n.onclick=()=>contaDialog();const t=$('#transf');if(t)t.onclick=()=>transfDialog(ativas);
    onAll('[data-edconta]','click',b=>contaDialog(sal.find(c=>c.id===b.dataset.edconta)));onAll('[data-deltr]','click',b=>confirm('Excluir esta transferência?')&&act(()=>api('DELETE','/transferencias/'+b.dataset.deltr),'Transferência excluída'))});
  const total=ativas.reduce((a,c)=>a+c.saldo,0);
  return `<div class="grid">${kpi('bank','Saldo total nas contas',brl(total),`${ativas.length} conta(s)`,total<0?'bad':'ok')}</div>
  ${ativas.length?`<div class="accs">${ativas.map(c=>`<div class="acc ${c.id===V.sel?'sel':''}"><h3>${esc(c.nome)}</h3><span class="mut">${esc(c.empresa)}${c.bancoNome?' · '+esc(c.bancoNome):''}${c.agencia||c.numero?` · ag. ${esc(c.agencia||'—')} cc ${esc(c.numero||'—')}`:''}</span><div class="sal ${c.saldo<0?'neg':''}">${brl(c.saldo)}</div><div class="row"><button class="btn sm" data-sel="${c.id}">Ver extrato</button><button class="btn sm" data-edconta="${c.id}">Editar</button>${c.padrao?'<span class="pill p-info">Padrão</span>':''}</div></div>`).join('')}</div>`:''}
  ${card('Extrato'+(ex?` — ${esc(ex.conta)}`:''),ex?table(['Data','Descrição','Contraparte','>Valor','>Saldo'],[`<tr><td colspan="4" class="mut">Saldo inicial</td><td class="num">${brl(ex.saldoInicial)}</td></tr>`,...ex.linhas.map(l=>`<tr><td>${dt(l.data)}</td><td>${esc(l.descricao)}</td><td>${esc(l.contra||'—')}</td><td class="num ${l.valor<0?'neg':'pos'}">${brl(l.valor)}</td><td class="num"><b>${brl(l.saldo)}</b></td></tr>`)],empty('Sem movimentos')):empty('Nenhuma conta bancária','Cadastre as contas da empresa (banco, agência, conta e saldo inicial) para acompanhar o saldo, fazer transferências e ver o extrato. Ao pagar ou receber um lançamento, escolha a conta para o movimento entrar aqui.',`<button class="btn pri" onclick="$('#novaConta').click()">+ Conta bancária</button>`),`<div class="row"><button class="btn" id="transf" ${ativas.length<2?'disabled title="Cadastre ao menos duas contas"':''}>Transferir entre contas</button><button class="btn pri" id="novaConta">+ Conta</button></div>`,'Só entram no extrato as baixas e transferências com conta informada.')}
  ${trs.length?card('Transferências',table(['Data','De','Para','Obs.','>Valor',''],trs.map(t=>`<tr><td>${dt(t.data)}</td><td>${esc(contaNome(t.de))}</td><td>${esc(contaNome(t.para))}</td><td>${esc(t.obs||'—')}</td><td class="num"><b>${brl(t.valor)}</b></td><td class="num"><button class="btn sm danger" data-deltr="${t.id}" aria-label="Excluir">✕</button></td></tr>`))):''}`};
function transfDialog(contas){const o=(sel)=>contas.map(c=>opt(c.id,`${c.nome} (${c.empresa})`,sel)).join('');
  ask('Transferir entre contas',`<label>De<select name="de">${o(contas[0].id)}</select></label><label>Para<select name="para">${o(contas[1].id)}</select></label>${fld('valor','Valor (R$)','number','','step="0.01" min="0.01" required')}${fld('data','Data','date',B.hoje,`max="${B.hoje}" required`)}<label class="full">Observação<input name="obs" maxlength="200"></label>`,v=>api('POST','/transferencias',{de:v.de,para:v.para,valor:+v.valor,data:v.data,obs:v.obs}).then(()=>toast('Transferência registrada')),'Transferir')}

  ask(item?`Editar — ${d.titulo}`:`Novo — ${d.titulo}`,d.form(e),async v=>{if(t==='condicoes')v.dias=String(v.dias);if(item)await api('PUT',`/cad/${t}/${item.id}`,v);else await api('POST','/cad/'+t,v);await refreshB();toast('Salvo')},'Salvar',t==='fornecedores')}

/* =====================================================================
   Estrutura do app (visão do analista de processos)
   OPERAÇÃO   : receitas, despesas, tesouraria, estoque e pessoas — o dia a dia
   ANÁLISE    : relatórios (+ Painel como visão geral)
   CADASTROS  : dados mestres que mudam pouco (empresas, contas, fornecedores, funcionários, produtos, categorias, centros)
   CONFIGURAÇÕES: regras do sistema (integrações, formas e condições de pagamento, cobrança, contratos, rotinas) e auditoria
   ===================================================================== */
async function api0(m,u,b){const r=await fetch(u,{method:m,headers:{'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||('Erro '+r.status));return j}
async function hubView(V,subs,bodies){V.sub=subs.some(s=>s[0]===V.sub)?V.sub:subs[0][0];const html=await bodies[V.sub]();
  setTimeout(()=>onAll('[data-sub]','click',b=>{V.sub=b.dataset.sub;render()}));
  return `<div class="sub2 chips">${subs.map(([k,t])=>`<button class="chip" aria-pressed="${V.sub===k}" data-sub="${k}">${t}</button>`).join('')}</div>`+html}
const goSub=(tab,sub)=>{VIEWS[tab].sub=sub;go(tab)};

/* ---------- cadastros genéricos (namespaced: vários na mesma tela) ---------- */
function cfgCad(t){const d=CADS[t],l=CAD_()[t];
  setTimeout(()=>{const n=$('#cadNovo_'+t);if(n)n.onclick=()=>{if(t==='contas'&&!B.empresas.length)return toast('Cadastre uma empresa primeiro.',1);cadDialog(t)};
    onAll(`[data-cad^="${t}|"]`,'click',b=>cadDialog(t,l.find(x=>x.id===b.dataset.cad.split('|')[1])));
    onAll(`[data-cadrm^="${t}|"]`,'click',b=>confirm('Remover este cadastro? Se já tiver sido usado, ele só será inativado.')&&act(async()=>{const r=await api('DELETE',`/cad/${t}/${b.dataset.cadrm.split('|')[1]}`);await refreshB();toast(r.inativado?'Cadastro em uso: foi inativado':'Cadastro removido')}))});

  if(!contas.length)return card('Conciliação bancária',empty('Cadastre uma conta bancária primeiro','A conciliação compara o extrato do banco (arquivo OFX) com os lançamentos do app. Cadastre a conta em Configurações → Contas bancárias.',`<button class="btn pri" onclick="goSub('cadastros','contas')">Ir para Cadastros</button>`));
  const conta=contas.find(c=>c.id===V.conta);const [d,sal]=await Promise.all([api('GET',`/conciliacao?conta=${V.conta}&status=${V.st}`),api('GET','/contas/saldos'+q())]);const s=sal.find(x=>x.id===V.conta)||{};
  const ct=d.contadores||{};
  setTimeout(()=>{$('#cConta').onchange=e=>{V.conta=e.target.value;render()};onAll('[data-st]','click',b=>{V.st=b.dataset.st;render()});
    $('#ofxFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;try{const r=await api('POST','/conciliacao/importar',{contaId:V.conta,ofx:await lerOfx(f)});toast(`${r.novas} lançamento(s) importado(s)${r.repetidas?`, ${r.repetidas} já estavam`:''}${r.anteriores?`, ${r.anteriores} anterior(es) ao saldo inicial ignorado(s)`:''}`);if(r.aviso)setTimeout(()=>toast(r.aviso,1),2200);render()}catch(x){toast(x.message,1)}};
    $('#cAuto').onclick=()=>act(async()=>{const r=await api('POST','/conciliacao/auto',{contaId:V.conta});toast(r.conciliadas?`${r.conciliadas} linha(s) conciliada(s) automaticamente`:'Nenhuma linha com correspondência segura')});
    onAll('[data-sug]','click',b=>act(()=>api('POST',`/conciliacao/${b.dataset.lin}/conciliar`,{lancId:b.dataset.sug}),'Conciliado'));
    onAll('[data-ign]','click',b=>act(()=>api('POST',`/conciliacao/${b.dataset.ign}/ignorar`),'Linha ignorada'));onAll('[data-und]','click',b=>confirm('Desfazer esta conciliação? O lançamento volta a ficar em aberto.')&&act(()=>api('POST',`/conciliacao/${b.dataset.und}/desfazer`),'Conciliação desfeita'));
    onAll('[data-esc]','click',b=>escolherLanc(d.linhas.find(x=>x.id===b.dataset.esc),conta));onAll('[data-cri]','click',b=>criarDeLinha(d.linhas.find(x=>x.id===b.dataset.cri)))});
  const dif=s.saldoExtrato!==undefined?Math.round((s.saldo-s.saldoExtrato)*100)/100:null;
  return `<div class="grid">${kpi('bank','Saldo no app',brl(s.saldo),esc(conta.nome))}${s.saldoExtrato!==undefined?kpi('doc','Saldo no extrato (OFX)',brl(s.saldoExtrato),s.saldoExtratoEm?`em ${dt(s.saldoExtratoEm)}`:'',dif===0?'ok':'warn'):kpi('doc','Saldo no extrato','—','importe um OFX')}${dif!==null?kpi('alert','Diferença',brl(dif),dif===0?'saldos conferem':'concilie as pendências para zerar',dif===0?'ok':'warn'):''}${kpi('inbox','Pendentes',ct.pendente||0,`${ct.conciliado||0} conciliadas · ${ct.ignorado||0} ignoradas`,(ct.pendente||0)?'warn':'ok')}</div>
  ${card('Conciliação bancária',`<div class="cb" style="padding-bottom:0"><div class="chips">${[['pendente','Pendentes'],['conciliado','Conciliadas'],['ignorado','Ignoradas'],['todos','Todas']].map(([k,t])=>`<button class="chip" aria-pressed="${V.st===k}" data-st="${k}">${t}${k!=='todos'&&ct[k]!==undefined?` <b>${ct[k]}</b>`:''}</button>`).join('')}</div></div>
  ${table(['Data','Descrição no extrato','>Valor','Correspondência',''],d.linhas.map(l=>`<tr><td>${dt(l.data)}</td><td><b>${esc(l.descricao)}</b>${l.motivo?`<span class="t2">${esc(l.motivo)}</span>`:''}</td><td class="num ${l.valor<0?'neg':'pos'}"><b>${brl(l.valor)}</b></td><td>${l.status==='conciliado'?`<span class="pill p-ok">Conciliado</span>${l.ref?.criada?'<span class="t2">lançamento criado a partir do extrato</span>':''}`:l.status==='ignorado'?'<span class="pill p-mut">Ignorado</span>':(l.sugestoes.length?l.sugestoes.map(g=>`<div style="margin-bottom:4px"><button class="btn sm" data-lin="${l.id}" data-sug="${g.id}" title="${g.exato?'Valor exato':'Valor próximo'} · ${g.diasDiferenca} dia(s) de diferença">${g.exato?'✓':'≈'} ${esc(g.descricao.slice(0,34))}${g.parcela?` (${esc(g.parcela)})`:''} · ${brl(g.valor)}</button></div>`).join(''):'<span class="mut">Sem sugestão</span>')}</td><td class="num"><div class="row" style="justify-content:flex-end">${l.status==='pendente'?`<button class="btn sm" data-esc="${l.id}">Escolher</button><button class="btn sm" data-cri="${l.id}">Criar</button><button class="btn sm" data-ign="${l.id}">Ignorar</button>`:`<button class="btn sm" data-und="${l.id}">Desfazer</button>`}</div></td></tr>`),empty(V.st==='pendente'?'Nada pendente':'Nada por aqui',V.st==='pendente'?'Importe o extrato OFX do banco (Internet Banking → Extrato → Exportar OFX) para conciliar.':''))}
  ${d.total>d.linhas.length?`<div class="cb mut">Mostrando as ${d.linhas.length} mais recentes de ${d.total}.</div>`:''}`,
  `<div class="row"><select id="cConta" aria-label="Conta">${contas.map(c=>opt(c.id,`${c.nome} — ${empNome(c.empresaId)}`,V.conta)).join('')}</select><button class="btn" id="cAuto">Conciliar automaticamente</button><label class="btn pri" style="cursor:pointer">Importar extrato OFX<input id="ofxFile" type="file" accept=".ofx,.OFX,.txt" hidden></label></div>`,'Compare o extrato do banco com os lançamentos. Ao conciliar, o lançamento é baixado na conta com a data e o valor do banco (diferença vira juros ou desconto).')}`};
async function escolherLanc(l,conta){const tipo=l.valor>0?'receber':'pagar';const todos=await api('GET','/'+tipo+'?empresa='+conta.empresaId);
  const ab=todos.filter(x=>tipo==='receber'?(x.status==='aberto'||x.status==='a_vencer'||x.status==='atrasado')&&x.origem==='manual':['aberta','a_vencer','vencida'].includes(x.situacao));
  if(!ab.length)return toast(tipo==='receber'?'Não há contas a receber em aberto lançadas aqui para esta empresa.':'Não há contas a pagar em aberto para esta empresa.',1);
  ask(`Conciliar ${brl(l.valor)}`,`<p class="full mut" style="margin:0">${esc(l.descricao)} · ${dt(l.data)}</p><label class="full">Lançamento em aberto<select name="lancId">${ab.map(x=>opt(x.id,`${dt(x.venc)} · ${x.descricao}${x.parcela?' ('+x.parcela+')':''} · ${brl(x.valor)}`,'')).join('')}</select></label><label class="full">Se o valor do banco for menor que o do lançamento<select name="modo"><option value="parcial">Baixa parcial (o restante segue em aberto)</option><option value="desconto">Tratar a diferença como desconto</option></select></label>`,v=>api('POST',`/conciliacao/${l.id}/conciliar`,v).then(()=>toast('Conciliado')),'Conciliar')}
function criarDeLinha(l){const cats=CAD_().categorias.filter(c=>c.ativa&&c.tipo===(l.valor>0?'receita':'despesa'));
  ask('Criar lançamento a partir do extrato',`<p class="full mut" style="margin:0">${esc(l.descricao)} · ${dt(l.data)} · ${brl(l.valor)}</p>${fld('descricao','Título*','text',l.descricao,'required maxlength="200"')}<label>Categoria<select name="categoria"><option value="">—</option>${cats.map(c=>opt(c.nome,c.nome,'')).join('')}</select></label><label>Centro de custo<select name="centro">${centroOpts()}</select></label>${fld('contra',l.valor>0?'Cliente':'Fornecedor','text','')}`,v=>api('POST',`/conciliacao/${l.id}/criar`,v).then(()=>toast('Lançamento criado e conciliado')),'Criar e conciliar')}

/* ---------- recorrências (Configurações) ---------- */
async function cfgRecorrencias(){const l=await api('GET','/recorrencias'+q());
  setTimeout(()=>{onAll('[data-recp]','click',b=>{const r=l.find(x=>x.id===b.dataset.recp);act(()=>api('PUT','/recorrencias/'+r.id,{ativa:!r.ativa}),r.ativa?'Recorrência pausada':'Recorrência retomada')});
    onAll('[data-rece]','click',b=>{const r=l.find(x=>x.id===b.dataset.rece);ask('Reajustar recorrência',`<p class="full mut" style="margin:0"><b>${esc(r.modelo.descricao)}</b> · hoje ${brl(r.modelo.valor)}</p>${fld('valor','Novo valor mensal (R$)','number',r.modelo.valor,'step="0.01" min="0.01" required')}${fld('fim','Data final (vazio = sem fim)','date',r.fim||'')}<label class="inline full"><input type="checkbox" name="aplicar" checked> Aplicar o novo valor às parcelas futuras já geradas e em aberto</label>`,v=>api('PUT','/recorrencias/'+r.id,{valor:+v.valor,fim:v.fim,aplicarFuturos:!!v.aplicar}).then(x=>toast(x.ajustadas?`${x.ajustadas} parcela(s) futura(s) atualizada(s)`:'Salvo')))});
    onAll('[data-recx]','click',b=>confirm('Encerrar e apagar as parcelas futuras em aberto? As já pagas e as vencidas continuam.')&&act(async()=>{const r=await api('DELETE','/recorrencias/'+b.dataset.recx);toast(`Recorrência encerrada (${r.removidas} parcela(s) futura(s) removida(s))`)}))});
  return card('Recorrências (contas fixas sem data final)',table(['Título','Empresa','Tipo','Início','Fim','>Valor mensal','Geradas','Situação',''],l.map(r=>`<tr style="${r.ativa?'':'opacity:.6'}"><td><b>${esc(r.modelo.descricao)}</b><span class="t2">${esc(r.modelo.fornecedor||r.modelo.cliente||'—')}</span></td><td class="emp" title="${esc(r.empresa)}">${esc(r.empresa)}</td><td>${r.tipo==='pagar'?'A pagar':'A receber'}</td><td>${dt(r.inicio)}</td><td>${r.fim?dt(r.fim):'sem fim'}</td><td class="num"><b>${brl(r.modelo.valor)}</b></td><td>${r.geradas}</td><td>${r.ativa?'<span class="pill p-ok">Ativa</span>':'<span class="pill p-mut">Pausada</span>'}</td><td class="num"><button class="btn sm" data-rece="${r.id}">Reajustar</button> <button class="btn sm" data-recp="${r.id}">${r.ativa?'Pausar':'Retomar'}</button> <button class="btn sm danger" data-recx="${r.id}">Encerrar</button></td></tr>`),empty('Nenhuma recorrência','Ao lançar uma conta, marque “Repetir todo mês, sem data final”. O app gera os próximos 3 meses sozinho.')),'','O app gera sozinho os próximos 3 meses de cada recorrência ativa.')}

/* ---------- NF-e de entrada: importar XML, lançar títulos e dar entrada no estoque ---------- */
async function lerTexto(file){const buf=await file.arrayBuffer();try{return new TextDecoder('utf-8',{fatal:true}).decode(buf)}catch{return new TextDecoder('windows-1252').decode(buf)}}
function nfeFlow(){const inp=document.createElement('input');inp.type='file';inp.accept='.xml,text/xml,application/xml';
  inp.onchange=async()=>{const f=inp.files[0];if(!f)return;if(f.size>3*1024*1024)return toast('O XML passa de 3 MB.',1);
    try{const xml=await lerTexto(f);const empresaId=EMP!=='todas'?EMP:'';const pv=await api('POST','/nfe/previa',{xml,empresaId});await refreshB();nfeDialog(xml,pv)}catch(e){toast(e.message,1)}};inp.click()}
const FORMA_ID=tipo=>((CAD_().formas||[]).find(f=>f.ativa&&f.tipo===tipo)||{}).id||'';
function nfeDialog(xml,pv){const n=pv.nota,emp0=pv.empresaSugerida||(EMP!=='todas'?EMP:(B.empresas.find(e=>e.ativa)||{}).id||'');let prods=[],sug=pv.produtos;
  const cnpjDe=id=>String((B.empresas.find(e=>e.id===id)||{}).cnpj||'').replace(/\D/g,'');
  const avisos=[...(pv.duplicada?[`Esta nota já foi importada (nº ${pv.duplicada.numero}, entrada em ${dt(pv.duplicada.entradaEm)}). A importação será bloqueada.`]:[]),...n.avisos,...(!pv.destinatarioConhecido&&n.destinatario.doc?[`O destinatário (${fdoc(n.destinatario.doc)}) não corresponde a nenhuma empresa cadastrada. Escolha a empresa abaixo.`]:[])];
  ask(`Importar NF-e ${n.numero}${n.serie?'/'+n.serie:''}`,`
   ${avisos.map(a=>`<div class="alert ${/já foi importada/.test(a)?'alta':'media'} full" style="margin:0">${ic('alert')}<span>${esc(a)}</span></div>`).join('')}
   <dl class="dl full" style="margin:0">${[['Fornecedor',n.fornecedor.nome+(pv.fornecedorId?'':' (será cadastrado)')],['CNPJ / CPF',fdoc(n.fornecedor.doc)],['Emissão',dt(n.emissao)],['Natureza',n.natOp||'—'],['Total da nota',brl(n.totais.total)],['Frete / outras',brl(n.totais.frete+n.totais.outras)],['Chave de acesso',n.chave||'—']].map(([l,v])=>`<div><dt>${l}</dt><dd style="font-size:13px">${esc(v)}</dd></div>`).join('')}</dl>
   <label>Empresa que recebeu*<select name="empresaId">${empOpts(emp0)}</select></label>
   ${fld('entradaEm','Data de entrada*','date',B.hoje,`max="${B.hoje}" required`)}
   <label class="inline full" id="outraEmpWrap" hidden><input type="checkbox" name="ignorarDestinatario"> Importar mesmo assim (o destinatário da nota não é o CNPJ desta empresa)</label>
   <div class="full"><div class="tot" style="margin-bottom:6px">Itens da nota</div><label class="inline" style="margin-bottom:6px"><input type="checkbox" name="darEntradaEstoque" checked> Dar entrada no estoque</label><div id="nfeItens" class="wrap"></div></div>
   <div class="full"><div class="tot" style="margin-bottom:6px">Títulos a pagar</div></div>
   <label>Como lançar<select name="modoTit"><option value="duplicatas" ${n.duplicatas.length?'selected':''}>Usar as duplicatas da nota${n.duplicatas.length?` (${n.duplicatas.length})`:' (a nota não traz)'}</option><option value="condicao" ${n.duplicatas.length?'':'selected'}>Gerar por condição de pagamento</option><option value="nenhum">Não lançar títulos</option></select></label>
   <label id="condWrap">Condição de pagamento<select name="condicaoId">${condOpts('cp_30')}</select></label>
   <div class="full wrap" id="dupWrap"></div>
   <label>Categoria<select name="categoria">${catOpts('despesa','Fornecedores')}</select></label><label>Centro de custo<select name="centro">${centroOpts()}</select></label>
   <label>Forma de pagamento<select name="formaId">${formaOpts(FORMA_ID(n.formaSugerida))}</select></label><label>Conta bancária<select name="contaId">${contaOpts(emp0)}</select></label>
   <label class="full">Anotações<textarea name="obs" maxlength="400" placeholder="Ex.: conferido no recebimento por fulano">${esc(n.infoAdicional||'')}</textarea></label>`,
  async v=>{
    const itens=[...document.querySelectorAll('#nfeItens tr[data-n]')].map(r=>({n:+r.dataset.n,estoque:r.querySelector('.ie').checked,produtoId:r.querySelector('.ip').value,nome:r.querySelector('.in').value,un:n.itens.find(i=>i.n===+r.dataset.n).un}));
    const titulos=v.modoTit==='duplicatas'?{modo:'duplicatas',manual:[...document.querySelectorAll('#dupWrap tr[data-d]')].map(r=>({venc:r.querySelector('.dv').value,valor:+r.querySelector('.dm').value,descricao:`Duplicata ${r.dataset.num}`}))}:v.modoTit==='condicao'?{modo:'condicao',condicaoId:v.condicaoId,base:v.entradaEm}:{modo:'nenhum'};
    const r=await api('POST','/nfe/importar',{xml,empresaId:v.empresaId,entradaEm:v.entradaEm,ignorarDestinatario:!!v.ignorarDestinatario,darEntradaEstoque:!!v.darEntradaEstoque,itens,titulos,categoria:v.categoria,centro:v.centro,formaId:v.formaId,contaId:v.contaId,obs:v.obs});
    toast(`NF-e ${n.numero} importada: ${r.titulos} título(s)${r.movimentos?`, ${r.movimentos} item(ns) no estoque`:''}${r.produtosNovos?` (${r.produtosNovos} produto(s) novo(s))`:''}`)},'Importar nota',true);
  const drawItens=()=>{const dar=g('darEntradaEstoque').checked;$('#nfeItens').innerHTML=`<table class="tbl pv"><thead><tr><th>#</th><th>Item da nota</th><th class="num">Qtd</th><th class="num">Custo unit.</th><th>Estoque</th><th>Produto</th></tr></thead><tbody>${n.itens.map(i=>{const s=sug.find(x=>x.n===i.n)||{};return `<tr data-n="${i.n}"><td>${i.n}</td><td><b>${esc(i.descricao)}</b><span class="t2">cód. ${esc(i.cProd)}${i.ncm?' · NCM '+esc(i.ncm):''}</span></td><td class="num">${String(i.qtd).replace('.',',')} ${esc(i.un)}</td><td class="num">${brl(i.custoUnit)}<span class="t2">total ${brl(i.custo)}</span></td><td><input class="ie" type="checkbox" ${dar?'checked':'disabled'} ${dar?'':''} title="Desmarque para serviços ou itens de consumo"></td><td><select class="ip"><option value="novo" ${s.produtoId?'':'selected'}>Criar novo produto</option>${prods.map(p=>opt(p.id,`${p.nome} (${p.un})`,s.produtoId)).join('')}</select><input class="in" value="${esc(i.descricao)}" maxlength="200" style="margin-top:4px;${s.produtoId?'display:none':''}" aria-label="Nome do novo produto"></td></tr>`}).join('')}</tbody></table>`;
    document.querySelectorAll('#nfeItens .ip').forEach(sl=>sl.onchange=()=>{sl.parentElement.querySelector('.in').style.display=sl.value==='novo'?'':'none'});
    document.querySelectorAll('#nfeItens .ie').forEach(c=>c.onchange=()=>{const tr=c.closest('tr');tr.querySelector('.ip').disabled=!c.checked;tr.querySelector('.in').disabled=!c.checked})};
  const drawTit=()=>{const m=g('modoTit').value;$('#condWrap').style.display=m==='condicao'?'':'none';
    $('#dupWrap').innerHTML=m==='duplicatas'?(n.duplicatas.length?`<table class="tbl pv"><thead><tr><th>Duplicata</th><th>Vencimento</th><th class="num">Valor</th></tr></thead><tbody>${n.duplicatas.map(d=>`<tr data-d data-num="${esc(d.numero)}"><td>${esc(d.numero)}</td><td><input class="dv" type="date" value="${d.venc}"></td><td><input class="dm" type="number" step="0.01" min="0.01" value="${d.valor}"></td></tr>`).join('')}</tbody></table><div class="hint" style="margin-top:6px">Soma das duplicatas: ${brl(n.duplicatas.reduce((a,d)=>a+d.valor,0))} · total da nota ${brl(n.totais.total)}</div>`:'<div class="hint">A nota não traz duplicatas: escolha “Gerar por condição”.</div>'):''};
  const outra=()=>{const c=cnpjDe(g('empresaId').value);$('#outraEmpWrap').hidden=!(n.destinatario.doc&&c&&c!==n.destinatario.doc)};
  const trocaEmpresa=async()=>{const id=g('empresaId').value;g('contaId').innerHTML=contaOpts(id);outra();
    try{prods=await api('GET','/produtos?empresa='+encodeURIComponent(id));sug=(await api('POST','/nfe/previa',{xml,empresaId:id})).produtos}catch{prods=[];sug=[]}drawItens()};
  g('empresaId').onchange=trocaEmpresa;g('modoTit').onchange=drawTit;g('darEntradaEstoque').onchange=drawItens;drawTit();outra();trocaEmpresa()}

/* ---------- notas de entrada ---------- */
VIEWS.notas=async()=>{await refreshB();const V=VIEWS.notas;V.f??='lancada';const all=await api('GET','/notas'+q());const l=all.filter(n=>V.f==='todas'||n.status===V.f);
  setTimeout(()=>{$('#nfeBtn').onclick=nfeFlow;onAll('[data-st]','click',b=>{V.f=b.dataset.st;render()});onAll('[data-nota]','click',b=>notaDialog(all.find(x=>x.id===b.dataset.nota)))});
  const tot=all.filter(n=>n.status==='lancada').reduce((a,n)=>a+n.totais.total,0);
  return `<div class="grid">${kpi('file','Notas lançadas',all.filter(n=>n.status==='lancada').length,'')}${kpi('out','Valor das notas',brl(tot),'')}</div>
  ${card('Notas de entrada (NF-e)',`<div class="cb" style="padding-bottom:0"><div class="chips">${[['lancada','Lançadas'],['cancelada','Canceladas'],['todas','Todas']].map(([k,t])=>`<button class="chip" aria-pressed="${V.f===k}" data-st="${k}">${t}</button>`).join('')}</div></div>
  ${table(['Entrada','Nota','Fornecedor','Empresa','Itens','Títulos','Estoque','>Total'],l.map(n=>{const pg=n.titulosInfo.filter(t=>t.status==='paga').length;return `<tr style="cursor:pointer" data-nota="${n.id}"><td>${dt(n.entradaEm)}${n.status==='cancelada'?' <span class="pill p-mut">Cancelada</span>':''}</td><td><b>${esc(n.numero)}${n.serie?'/'+esc(n.serie):''}</b><span class="t2">emitida em ${dt(n.emissao)}</span></td><td>${esc(n.fornecedorNome)}<span class="t2">${esc(fdoc(n.fornecedorDoc))}</span></td><td class="emp" title="${esc(n.empresa)}">${esc(n.empresa)}</td><td>${n.itens.length}</td><td>${n.titulosInfo.length?`${pg}/${n.titulosInfo.length} pagos`:'—'}</td><td>${n.estoque?'<span class="pill p-ok">Entrou</span>':'<span class="pill p-mut">Não</span>'}</td><td class="num"><b>${brl(n.totais.total)}</b></td></tr>`}),empty('Nenhuma nota de entrada','Importe o XML da NF-e do fornecedor: o app lança os títulos a pagar pelas duplicatas e dá entrada dos itens no estoque.',`<button class="btn pri" onclick="$('#nfeBtn').click()">Importar XML (NF-e)</button>`))}`,`<button class="btn pri" id="nfeBtn">Importar XML (NF-e)</button>`,'Cada nota guarda o XML original, os itens, os títulos gerados e as entradas no estoque.')}`};
function notaDialog(n){const url=n.anexos&&n.anexos[0]?`/api/fin/anexos/${n.anexos[0].id}`:'';
  ask(`NF-e ${n.numero}${n.serie?'/'+n.serie:''} — ${n.fornecedorNome}`,`

  return `<div class="grid">${kpi('box','Valor em estoque',brl(valor),'a custo médio')}${kpi('file','Produtos',all.filter(p=>p.ativo!==false).length,'')}${kpi('alert','Abaixo do mínimo',all.filter(p=>p.abaixoMinimo).length,'',all.some(p=>p.abaixoMinimo)?'warn':'')}</div>

function gerarCobContrato(d){const c=d.contrato;
  ask('Gerar cobranças do contrato',`<p class="full mut" style="margin:0">${esc(c.titulo)} · cliente ${esc(d.cliente.nome||'—')}${R_doc(d)}</p>
   ${fld('titulo','Título das parcelas','text',c.titulo,'maxlength="200"')}${fld('valor','Valor total (R$)*','number',c.valor||'','step="0.01" min="0.01" required')}${fld('parcelas','Parcelas','number','1','min="1" max="60"')}${fld('primeiroVenc','1º vencimento*','date',B.hoje,'required')}${sel('forma','Forma de pagamento',FORMAS_AS,'UNDEFINED')}
   <label class="inline full"><input type="checkbox" name="emitirAsaas" ${d.asaasPronto?'checked':'disabled'}> Emitir as cobranças no Asaas agora ${d.asaasPronto?'':'(Asaas não configurado)'}</label><div class="full wrap" id="gcPrev"></div>`,
  async v=>{await api('POST',`/contratos/${c.id}/gerar-cobrancas`,{titulo:v.titulo,valor:+v.valor,parcelas:+v.parcelas,primeiroVenc:v.primeiroVenc,forma:v.forma,emitirAsaas:!!v.emitirAsaas});toast('Cobranças geradas: veja em A receber')},'Gerar cobranças',true);
  const prev=async()=>{const v=+g('valor').value,n=+g('parcelas').value||1;if(!(v>0)||!g('primeiroVenc').value){$('#gcPrev').innerHTML='';return}
    try{const l=await api('POST','/parcelas/preview',{valor:v,parcelas:n,venc:g('primeiroVenc').value,base:g('primeiroVenc').value});$('#gcPrev').innerHTML=table(['Parcela','Vencimento','>Valor'],l.map(p=>`<tr><td>${p.n}/${p.of}</td><td>${dt(p.venc)}</td><td class="num">${brl(p.valor)}</td></tr>`))}catch(e){$('#gcPrev').innerHTML=`<div class="hint">${esc(e.message)}</div>`}};
  ['valor','parcelas','primeiroVenc'].forEach(n=>{g(n).onchange=prev;g(n).oninput=()=>{clearTimeout(prev.t);prev.t=setTimeout(prev,300)}});prev()}
const R_doc=d=>d.cliente.doc?` · ${esc(fdoc(d.cliente.doc))}`:' · <b class="neg">sem CPF/CNPJ no cadastro (necessário para emitir no Asaas)</b>';
document.addEventListener('click',e=>{if(e.target.id==='gerCob'&&LASTC)gerarCobContrato(LASTC)});

  return `<div class="rep"><div class="repnav">${REPS.map(([g,l])=>`<div class="sep2">${g}</div>${l.map(x=>`<button class="repi" aria-current="${x[0]===t}" data-rep="${x[0]}"><b>${x[1]}</b><span>${x[2]}</span></button>`).join('')}`).join('')}</div>
  <div>${card(esc(r.titulo),r.erro?`<div class="alert alta" style="margin:16px">${ic('alert')}<span>${esc(r.erro)}</span></div>`:`${table(r.colunas.map((c,i)=>(typeof r.linhas[0]?.[i]==='number'?'>':'')+c),r.linhas.map(l=>`<tr ${/^(TOTAL|RESULTADO)/.test(l[1]||'')?'style="font-weight:750;background:var(--surface2)"':''}>${l.map((v,ci)=>typeof v==='number'?`<td class="num">${(r.num||[]).includes(ci)?String(v).replace('.',','):brl(v)}</td>`:/^\d{4}-\d\d-\d\d$/.test(v)?`<td>${dt(v)}</td>`:/^\d{4}-\d\d$/.test(v)?`<td>${mesNome(v)}</td>`:stat.includes(v)?`<td>${pl(v)}</td>`:`<td>${esc(v)}</td>`).join('')}</tr>`),empty('Sem dados neste relatório'))}<div class="cb" style="text-align:right;font-weight:750;border-top:1px solid var(--line)">${r.totalLabel}: ${brl(r.total)}</div>`,
   `<div class="tools">${opts.includes('c')?`<select id="r_conta" aria-label="Conta">${cs.map(c=>opt(c.id,c.nome,V.conta)).join('')}</select>`:''}${opts.includes('r')?`<select id="r_rg" aria-label="Regime"><option value="caixa" ${rg==='caixa'?'selected':''}>Regime de caixa (pago)</option><option value="competencia" ${rg==='competencia'?'selected':''}>Competência (vencimento)</option></select>`:''}${opts.includes('p')?`<label class="inline">De <input type="date" id="r_de" value="${de}"></label><label class="inline">Até <input type="date" id="r_ate" value="${ate}"></label>`:''}<a class="btn" id="csv" href="#">Baixar CSV</a><button class="btn" onclick="print()">Imprimir</button></div>`,def[2])}</div></div>`};

async function cfgEmpresas(){const s=await api('GET','/status');ST=s;drawFoot();
  const naoVinc=s.minhas.filter(m=>!m.vinculada);
  setTimeout(()=>{$('#novaEmp').onclick=()=>ask('Nova empresa',`${fld('nome','Nome (aparece como opção no Bitrix)','text','','required')}${fld('cnpj','CNPJ')}`,v=>api('POST','/empresas',v).then(async()=>{await api('POST','/empresas/sincronizar-campo').catch(()=>{});Object.assign(B,await api('GET','/bootstrap'));fillEmp();toast('Empresa criada')}));
    onAll('.imp','click',()=>act(async()=>{const r=await api('POST','/empresas/importar-bitrix');await api('POST','/empresas/sincronizar-campo').catch(()=>{});Object.assign(B,await api('GET','/bootstrap'));fillEmp();toast(r.criadas?`${r.criadas} empresa(s) importada(s) do Bitrix`:'Empresas já estavam vinculadas')}));
    $('#syncCampo').onclick=()=>act(async()=>{const r=await api('POST','/empresas/sincronizar-campo');toast(`Campo “CR · Empresa” atualizado: ${r.opcoes.length} opção(ões)`)});
    onAll('[data-ed]','click',b=>{const e=B.empresas.find(x=>x.id===b.dataset.ed);ask('Editar empresa',`${fld('nome','Nome','text',e.nome,'required')}${fld('cnpj','CNPJ','text',e.cnpj)}<label style="grid-column:1/-1">“Minha empresa” no Bitrix (vincula as deals dessa empresa)<select name="bitrixCompanyId"><option value="">— nenhuma —</option>${s.minhas.map(m=>`<option value="${m.id}" ${m.id===e.bitrixCompanyId?'selected':''}>${esc(m.nome)}</option>`).join('')}</select></label><label class="inline"><input type="checkbox" name="ativa" ${e.ativa?'checked':''}> Ativa</label>`,v=>api('PUT','/empresas/'+e.id,{nome:v.nome,cnpj:v.cnpj,ativa:v.ativa,bitrixCompanyId:v.bitrixCompanyId}).then(async()=>{Object.assign(B,await api('GET','/bootstrap'));fillEmp()}))});
    onAll('[data-key]','click',b=>{const e=B.empresas.find(x=>x.id===b.dataset.key);ask(`Asaas — ${e.nome}`,`${sel('env','Ambiente',[['sandbox','Sandbox (testes)'],['production','Produção']],e.asaas.env)}<label style="grid-column:1/-1">Chave de API ${e.asaas.configurado?`(atual ${e.asaas.dica})`:''}<input name="apiKey" type="password" autocomplete="off" placeholder="$aact_..."></label>`,async v=>{await api('PUT',`/empresas/${e.id}/asaas`,v);const t=await api('POST',`/empresas/${e.id}/asaas/test`);toast(`Chave válida${t.nome?' · '+t.nome:''} · saldo ${brl(t.saldo)}`);Object.assign(B,await api('GET','/bootstrap'))},'Salvar e testar')});
    onAll('[data-rmkey]','click',b=>confirm('Remover a chave do Asaas desta empresa?')&&act(async()=>{await api('DELETE',`/empresas/${b.dataset.rmkey}/asaas`);Object.assign(B,await api('GET','/bootstrap'))},'Chave removida'));
    });
  return `${naoVinc.length?`<div class="alert info">${ic('bld')}<span>${naoVinc.length} “Minha empresa” do Bitrix ainda não cadastrada(s): ${naoVinc.map(m=>esc(m.nome)).join(', ')}. <button class="btn sm imp">Importar agora</button></span></div>`:''}
  ${card('Empresas',table(['Empresa','CNPJ','No Bitrix','Situação','Asaas',''],B.empresas.map(e=>{const m=s.minhas.find(x=>x.id===e.bitrixCompanyId);return `<tr><td><b>${esc(e.nome)}</b></td><td>${esc(fdoc(e.cnpj)||'—')}</td><td>${m?esc(m.nome):'<span class="mut">por campo de lista</span>'}</td><td>${e.ativa?'<span class="pill p-ok">Ativa</span>':'<span class="pill p-mut">Inativa</span>'}</td><td>${e.asaas.configurado?`<span class="pill p-ok">${e.asaas.env==='production'?'Produção':'Sandbox'} ${esc(e.asaas.dica)}</span>`:'<span class="pill p-mut">Conta padrão</span>'}</td><td class="num"><button class="btn sm" data-ed="${e.id}">Editar</button> <button class="btn sm" data-key="${e.id}">Chave Asaas</button>${e.asaas.configurado?` <button class="btn sm danger" data-rmkey="${e.id}">Remover chave</button>`:''}</td></tr>`}),empty('Nenhuma empresa cadastrada','Importe as “Minhas empresas” do Bitrix ou cadastre manualmente.',s.minhas.length?`<button class="btn pri imp">Importar do Bitrix</button>`:'')),
    `<div class="row"><button class="btn" id="syncCampo" title="Cria/atualiza o campo de lista no Bitrix">Atualizar campo no Bitrix</button><button class="btn pri" id="novaEmp">+ Empresa</button></div>`,'A empresa de cada deal vem do campo de lista “CR · Empresa”; se ele estiver vazio, vale a “Minha empresa” da deal. Cada empresa pode ter a sua chave do Asaas.')}`};
function fillEmp(){const s=$('#emp');s.innerHTML=`<option value="todas">Todas as empresas</option>`+B.empresas.filter(e=>e.ativa).map(e=>`<option value="${e.id}">${esc(e.nome)}</option>`).join('');if(!B.empresas.some(e=>e.id===EMP))EMP='todas';s.value=EMP}
async function render(keepPage){const m=$('#main');if(BUSY)return;BUSY=true;const scroll=scrollY;if(keepPage!==true)resetPg();
  try{if(EMBED){m.innerHTML=SK;
      if(DEAL){try{m.innerHTML=contratoBox(await api('GET','/contratos/'+DEAL));return}catch(e){if(!/não encontrado/i.test(e.message))throw e}}
      m.innerHTML=clienteBox(await api('GET','/cliente'+location.search));return}
    $('#ttl').textContent=(NAV.find(n=>n[0]===TAB)||[])[1]||'';$('#empWrap').style.display=['config','cadastros'].includes(TAB)?'none':'';
    if(m.dataset.t!==TAB)m.innerHTML=SK;
    PGBASE=TAB+'/'+(VIEWS[TAB].sub||'');PGIDX=0;PGON=true;let h;try{h=await VIEWS[TAB]()}finally{PGON=false}m.innerHTML=h;m.dataset.t=TAB;scrollTo(0,scroll);
  }catch(e){m.innerHTML=`<div class="alert alta">${ic('alert')}<span>${esc(e.message)}</span></div>${/Bitrix24 não configurado/.test(e.message)?'<p class="mut">Abra <a href="#" onclick="goSub(\'config\',\'integracoes\');return false">Configurações → Integrações</a> e informe o webhook do Bitrix24.</p>':''}`}finally{BUSY=false}}
(async()=>{try{Object.assign(B,await api('GET','/bootstrap'))}catch(e){toast(e.message,1)}
  if(EMBED){document.querySelector('aside').hidden=true;document.querySelector('.app').style.display='block';$('#empWrap').hidden=true;$('#menu').hidden=true;$('#reload').hidden=true;$('#ttl').textContent=DEAL?'Contrato e cobranças':'Cliente';render();return}
  fillEmp();$('#emp').onchange=e=>{EMP=e.target.value;ls.set('fin.emp',EMP);VIEWS.contratos.open=null;render()};$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#reload').onclick=()=>render();drawNav();render()})();
</script>
</body>
