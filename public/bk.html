<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nutrimix · BK</title>
<link rel="icon" href="/_gw/icon">
<style>
:root{--bg:#f2f3f5;--surface:#fff;--ink:#16202e;--ink2:#46515f;--mut:#6b7684;--line:#d8dce2;--brand:#1c4a82;--brandbg:#e8eff8;--ok:#1b6b3a;--okbg:#e2f4e8;--warn:#8a5a00;--warnbg:#fff3d6;--bad:#a1281f;--badbg:#fde8e6}
@media(prefers-color-scheme:dark){:root{--bg:#10151c;--surface:#171e27;--ink:#eaeef3;--ink2:#b5bfcb;--mut:#8996a5;--line:#2a3441;--brand:#7fb0ee;--brandbg:#1b2a3d;--ok:#6fd49a;--okbg:#143324;--warn:#f0c46a;--warnbg:#3a2f12;--bad:#ff9a90;--badbg:#401c19}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}[hidden]{display:none!important}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:0 clamp(12px,3vw,32px);height:56px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:5}
.marca{display:flex;align-items:center;gap:9px;font-weight:700;font-size:16px;color:var(--ink);text-decoration:none}.marca b{display:grid;place-items:center;width:28px;height:28px;border-radius:6px;background:var(--brand);color:#fff}
.sp{flex:1}.user{font-size:13px;color:var(--ink2)}
nav{background:var(--surface);border-bottom:1px solid var(--line);padding:0 clamp(12px,3vw,32px);display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;border-bottom:3px solid transparent;padding:12px 14px;font:inherit;color:var(--ink2);cursor:pointer;white-space:nowrap}
nav button[aria-selected=true]{color:var(--brand);border-color:var(--brand);font-weight:650}
main{max-width:1240px;margin:0 auto;padding:20px clamp(12px,3vw,32px) 60px}
h1{margin:0 0 2px;font-size:22px}.sub{margin:0 0 18px;color:var(--mut)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.k{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.k:hover{border-color:var(--brand)}.k small{display:block;color:var(--mut);font-size:12.5px}.k strong{font-size:26px;letter-spacing:-.02em}.k.bad strong{color:var(--bad)}.k.warn strong{color:var(--warn)}.k.ok strong{color:var(--ok)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}.box h2{margin:0 0 10px;font-size:15.5px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px}
.bar{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}.bar i{display:block;height:10px;border-radius:5px;background:var(--brand);min-width:2px}.bar span:first-child{width:150px;color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th{text-align:left;font-weight:600;color:var(--mut);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}tr.cl{cursor:pointer}tr.cl:hover td{background:var(--brandbg)}
.tw{overflow-x:auto}
.sel{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap;background:var(--brandbg);color:var(--brand)}
.sel.ok{background:var(--okbg);color:var(--ok)}.sel.w{background:var(--warnbg);color:var(--warn)}.sel.b{background:var(--badbg);color:var(--bad)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:7px 10px;max-width:100%}
.btn{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:7px 14px;cursor:pointer}.btn:hover{border-color:var(--brand)}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}[data-t=dark] .btn.p,.btn.p{color:#fff}.btn.d{color:var(--bad)}
@media(prefers-color-scheme:dark){.btn.p{color:#0b1420}}
.pag{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;color:var(--mut)}
.col{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px;align-items:flex-start}.cx{flex:0 0 255px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px}
.cx h3{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between}.ct{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;margin-bottom:8px;font-size:13px;cursor:pointer}.ct:hover{border-color:var(--brand)}.ct small{color:var(--mut);display:block}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:20px;width:min(720px,94vw);max-height:92vh}dialog::backdrop{background:#0008}
.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}.f label{display:grid;gap:3px;font-size:12.5px;color:var(--mut)}.f label.w{grid-column:1/-1}
.msg{padding:9px 12px;border-radius:8px;margin:0 0 12px;background:var(--brandbg);color:var(--brand)}.msg.e{background:var(--badbg);color:var(--bad)}
.fl{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0;margin:6px 0 4px}
.st{position:relative;background:var(--surface);border:1px solid var(--line);padding:12px 14px 14px;margin-right:-1px}
.st:first-child{border-radius:10px 0 0 10px}.st:last-child{border-radius:0 10px 10px 0;margin-right:0}
.st b.n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--brand);color:#fff;font-size:12.5px;margin-right:6px}
.st h3{margin:0 0 6px;font-size:14px;display:flex;align-items:center}.st p{margin:4px 0;font-size:13px;color:var(--ink2)}.st .q{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-top:8px}
.st.end{border-color:var(--ok)}.st.alt{border-style:dashed}
.rq{border-collapse:collapse}.rq td{vertical-align:top}
.gv-bk{position:fixed;inset:0;background:#0007;z-index:20}
#gav{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--surface);color:var(--ink);border-left:1px solid var(--line);z-index:21;overflow:auto;padding:18px 20px 28px;box-shadow:-8px 0 30px #0004}
#gav .top{display:flex;gap:8px;align-items:center;margin-bottom:10px}#gav .top .sp{flex:1}
.lk{display:flex;justify-content:space-between;gap:8px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;font-size:13.5px}.lk:hover{border-color:var(--brand);background:var(--brandbg)}
.sug{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:8px;z-index:6;max-height:320px;overflow:auto;box-shadow:0 8px 24px #0003;margin-top:2px}
.sug .lk{border:0;border-radius:0;margin:0;border-bottom:1px solid var(--line)}
.cl2{cursor:pointer}.bar.cl2:hover b,.bar.cl2:hover span:first-child{color:var(--brand)}
.ct[draggable=true]{cursor:grab}.ct.arr{opacity:.4}.cx.alvo{outline:2px dashed var(--brand);background:var(--brandbg)}
.col{min-height:60vh}.cx{min-height:120px}
.lst{margin:0;padding-left:18px;color:var(--ink2)}.mut{color:var(--mut)}.dr{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}

/* Kanban do funil BK (18) */
.kb-col{display:flex;gap:12px;overflow-x:auto;padding-bottom:10px;align-items:flex-start;scroll-snap-type:x proximity}
.kb-cx{flex:0 0 300px;scroll-snap-align:start;border-top:4px solid var(--kn);background:var(--knbg);border-radius:10px;padding:10px 10px 4px;min-height:140px;--kn:#1c4a82;--knbg:#e8eff8}.kb-cx.ok{--kn:#1e8e3e;--knbg:#e6f4ea}.kb-cx.n{--kn:#7a8594;--knbg:#f0f1f3}.kb-cx.alvo{outline:2px dashed var(--brand)}
@media(prefers-color-scheme:dark){.kb-cx{--kn:#7fb0ee;--knbg:#1b2a3d}.kb-cx.ok{--kn:#6fd49a;--knbg:#14301f}.kb-cx.n{--kn:#9aa6b5;--knbg:#1d242e}}
.kb-cx h3{margin:0 0 10px;font-size:13.5px;display:flex;justify-content:space-between;align-items:center;color:var(--kn)}.kb-cx h3 .cnt{background:var(--surface);padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700}
.kb-cd{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--kn);border-radius:8px;padding:10px 11px;margin-bottom:9px;font-size:13px;cursor:pointer;box-shadow:0 1px 2px #0000000d}.kb-cd:hover{border-color:var(--brand)}.kb-cd[draggable=true]{cursor:grab}.kb-cd.arr{opacity:.4}.kb-cd.alerta{border-left-color:var(--bad)}
.kb-cd b{font-size:13.5px;display:block}.kb-cd small{display:block;color:var(--mut);margin-top:2px}.kb-tg{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}.kb-tg span{background:var(--brandbg);color:var(--brand);border-radius:99px;padding:1px 9px;font-size:11.5px;font-weight:600}.kb-tg span.al{background:var(--badbg);color:var(--bad)}.kb-tg span.w{background:var(--warnbg);color:var(--warn)}
.kb-ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}.kb-ac .btn{padding:3px 10px;font-size:12.5px;white-space:nowrap}
.kb-bar{display:flex;align-items:center;gap:8px;margin-bottom:10px}.kb-bar .btn{padding:4px 14px;font-size:18px;line-height:1.2}
.kb-chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px}.kb-chip{border:1px solid var(--line);background:var(--surface);color:var(--ink2);border-radius:99px;padding:3px 11px;font:inherit;font-size:12.5px;cursor:pointer}.kb-chip[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.kb-mv{position:fixed;z-index:60;background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px #0003;padding:6px;display:grid;min-width:200px}.kb-mv small{padding:4px 10px;color:var(--mut)}.kb-mv button{text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font:inherit;color:var(--ink);cursor:pointer}.kb-mv button:hover{background:var(--brandbg)}
</style>
</head>
<body>
<header><a class="marca" href="/"><b>N</b>Nutrimix</a><span class="mut">/ <a href="/processos.html" style="color:inherit">Processos</a> / BK</span><span class="sp"></span><span class="user" id="user"></span></header>
<nav role="tablist" id="abas"></nav>
<main hidden id="app"><div id="msg"></div><div id="tela"></div></main>
<dialog id="dlg"></dialog>
<div class="gv-bk" id="gbk" hidden></div><aside id="gav" hidden aria-label="Detalhes da unidade" role="dialog"></aside>
<script src="/auth.js"></script>
<script>
const $ = s => document.querySelector(s);
const h = v => String(v == null ? '' : v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const api = (m, u, b) => nmJson(m, '/api/bk' + u, b);
const brl = v => Number(v || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dt = s => s ? s.split('-').reverse().join('/') : '—';
const ABAS = [['kanban', 'Kanban'], ['painel', 'Painel'], ['unidades', 'Unidades'], ['esteira', 'Esteira de protocolos'], ['medicao', 'Medição mensal'], ['config', 'Configurações'], ['processo', 'Como funciona']];
let ME = {}, BOOT = {}, aba = 'kanban', F = { q: '', uf: '', etapa: '', situacao: '', page: 1 }, podeEditar = false, podeAdmin = false;
const NIV = { vencido: 'b', critico: 'b', atencao: 'w', ok: 'ok' };
function aviso(t, erro) { const m = $('#msg'); m.innerHTML = t ? `<p class="msg ${erro ? 'e' : ''}">${h(t)}</p>` : ''; if (t) scrollTo(0, 0); }
const guarda = f => async (...a) => { try { aviso(''); return await f(...a); } catch (e) { aviso(e.message || String(e), true); } };

function abrirAba(a) {
  aba = a; $('#abas').innerHTML = ABAS.map(([k, n]) => `<button role="tab" aria-selected="${k === a}" data-a="${k}">${n}</button>`).join('');
  $('#abas').querySelectorAll('button').forEach(b => b.onclick = () => { aviso(''); abrirAba(b.dataset.a); });
  gavFecha(); history.replaceState(null, '', '#' + a); ({ kanban, painel, processo, unidades, esteira, medicao, config })[a]();
}
async function boot() { BOOT = await api('GET', '/bootstrap'); }
const selUnidade = u => u.pendencias && u.pendencias.length ? `<span class="sel b">${u.pendencias.length} pendência(s)</span>` : u.ativa ? '<span class="sel ok">Conforme</span>' : '<span class="sel">Inativa</span>';


// ---------- Kanban: espelho do funil 18 (BK) no Bitrix24 ----------
let KB = { q: '', tipos: new Set(), pend: '' };
const fmtCnpj = v => String(v || '').replace(/\D/g, '').replace(/^(\d{2})(\d{3})(\d{3})(\d{4})(\d{2})$/, '$1.$2.$3/$4-$5');
const tituloCard = c => (c.unidade ? `BKN ${c.unidade.bkn} — ${c.unidade.nome}` : c.titulo);
const kanban = guarda(async () => {
  if (!BOOT.hoje) await boot();
  const r = await api('GET', '/kanban'), sc = $('#tela').querySelector('.kb-col'), keep = sc ? sc.scrollLeft : 0;
  const t = KB.q.toLowerCase().trim(), casa = c => (!t || `${c.titulo} ${c.bkn} ${c.unidade ? c.unidade.nome + ' ' + c.unidade.cidade + ' ' + c.unidade.rt : ''} ${c.empresa ? c.empresa.nome : ''}`.toLowerCase().includes(t))
    && (!KB.tipos.size || c.tipos.some(x => KB.tipos.has(x))) && (!KB.pend || (KB.pend === 'empresa' ? c.semEmpresa : KB.pend === 'tipo' ? c.semTipo : KB.pend === 'unidade' ? c.semUnidade : KB.pend === 'check' ? c.checklistPendente : c.prazoVencido));
  const vis = r.cards.filter(casa), podeDocs = r.campos.docs;
  const ehEnvio = c => !!(r.etapas.find(e => e.id === c.etapa) || {}).envio;
  const ehVerif = c => !!(r.etapas.find(e => e.id === c.etapa) || {}).verificacao;
  const card = c => `<div class="kb-cd ${c.semEmpresa || c.semTipo || c.checklistPendente || c.prazoVencido ? 'alerta' : ''}" data-id="${h(c.id)}" ${podeEditar ? 'draggable="true"' : ''}><b>${h(tituloCard(c))}</b>
    <small>${c.unidade ? [c.unidade.cidade, c.unidade.uf].filter(Boolean).join('/') || 'cidade não informada' : 'Unidade não cadastrada no app'}${c.unidade && c.unidade.rt ? ' · RT ' + h(c.unidade.rt) : ''}</small>${c.empresa ? `<small>${h(c.empresa.nome)}</small>` : ''}
    <div class="kb-tg">${c.tiposNomes.slice(0, 3).map(n => `<span title="${c.prazos[n] ? 'Prazo: ' + dt(c.prazos[n]) : ''}">${h(n)}${c.prazos[n] ? ' · ' + dt(c.prazos[n]).slice(0, 5) : ''}</span>`).join('')}${c.tiposNomes.length > 3 ? `<span title="${h(c.tiposNomes.slice(3).join(', '))}">+${c.tiposNomes.length - 3}</span>` : ''}${c.semTipo ? '<span class="al">Sem tipo</span>' : ''}${c.semEmpresa ? '<span class="al">Sem empresa</span>' : ''}${c.semUnidade ? '<span class="w">Sem unidade no app</span>' : ''}${c.checklistPendente && !ehVerif(c) ? '<span class="al">Checklist pendente</span>' : ehVerif(c) && c.checklist.total ? `<span class="${c.checklist.pendentes ? 'w' : 'ok'}">✔ checklist ${c.checklist.feitos}/${c.checklist.total}</span>` : ''}${c.prazoVencido ? '<span class="al">Prazo vencido</span>' : ''}${c.docs && (c.docs.recebidos.length || c.docs.nutrimix.length) ? `<span class="w" title="Documentos recebidos / elaborados pela Nutrimix">📎 ${c.docs.recebidos.length}${c.docs.nutrimix.length ? ' · ' + c.docs.nutrimix.length + ' Nutrimix' : ''}</span>` : ''}</div>
    ${podeEditar ? `<div class="kb-ac">${c.semEmpresa ? `<button class="btn p" data-vi="${h(c.id)}">Vincular empresa</button>` : ''}${c.semTipo ? `<button class="btn" data-ti="${h(c.id)}">Definir tipo</button>` : ''}${podeDocs ? `<button class="btn" data-do="${h(c.id)}">Documentos</button>` : ''}${ehEnvio(c) ? `<button class="btn p" data-ge="${h(c.id)}">Gerar documentos</button>` : ''}<button class="btn" data-mv="${h(c.id)}">Mover ▾</button></div>` : ''}</div>`;
  $('#tela').innerHTML = `${!r.campos.prontos ? `<p class="msg">Faltam campos no Bitrix24 (${h(r.campos.faltam.slice(0, 4).join(', '))}${r.campos.faltam.length > 4 ? '…' : ''}). ${podeAdmin ? 'Clique em “Preparar campos” para criá-los e organizar o formulário do funil 18.' : 'Peça ao administrador para preparar os campos.'}</p>` : ''}
  <div class="tools" style="margin-bottom:8px"><input id="kq" type="search" placeholder="Buscar por BKN, unidade, cidade, RT ou empresa" value="${h(KB.q)}" style="flex:1;min-width:220px"><button class="btn" id="kre" title="Recarregar do Bitrix24">↻ Atualizar</button>${!r.campos.prontos && podeAdmin ? '<button class="btn p" id="kpd">Preparar campos</button>' : ''}<a class="btn" href="https://${h(BOOT.bitrixHost || '')}/crm/deal/kanban/category/18/" target="_blank" rel="noopener">Abrir no Bitrix24</a></div>
  <div class="kb-chips"><span class="mut" style="align-self:center;font-size:12.5px">Tipo de serviço:</span>${r.tipos.map(x => `<button class="kb-chip" aria-pressed="${KB.tipos.has(x.id)}" data-tp="${h(x.id)}">${h(x.nome)}</button>`).join('')}</div>
  <div class="kb-chips"><span class="mut" style="align-self:center;font-size:12.5px">Pendências:</span>${[['empresa', 'Sem empresa', r.resumo.semEmpresa], ['tipo', 'Sem tipo', r.resumo.semTipo], ['unidade', 'Sem unidade no app', r.resumo.semUnidade], ['check', 'Checklist pendente', r.resumo.checklistPendente], ['prazo', 'Prazo vencido', r.resumo.prazoVencido]].map(([k, n, q]) => `<button class="kb-chip" aria-pressed="${KB.pend === k}" data-pe="${k}">${n} <b>${q}</b></button>`).join('')}<span class="mut" style="align-self:center;font-size:12.5px;margin-left:auto">${vis.length} de ${r.resumo.total} solicitação(ões)</span></div>
  <div class="kb-bar"><button class="btn" id="kl" aria-label="Rolar para a esquerda">‹</button><span class="mut" style="flex:1;text-align:center;font-size:12.5px">Espelho do funil BK do Bitrix24 · arraste o card ou use “Mover” para mudar a etapa nos dois lugares</span><button class="btn" id="kr" aria-label="Rolar para a direita">›</button></div>
  <div class="kb-col">${r.etapas.map(e => { const l = vis.filter(c => c.etapa === e.id); return `<div class="kb-cx ${e.tom}" data-col="${h(e.id)}"><h3>${h(e.nome)} <span class="cnt">${l.length}</span></h3>${l.map(card).join('') || '<p class="mut" style="font-size:13px">Vazio</p>'}</div>`; }).join('')}</div>`;
  const col = $('#tela').querySelector('.kb-col'); col.scrollLeft = keep; const passo = () => ($('.kb-cx') || { offsetWidth: 300 }).offsetWidth + 12;
  $('#kl').onclick = () => col.scrollBy({ left: -passo(), behavior: 'smooth' }); $('#kr').onclick = () => col.scrollBy({ left: passo(), behavior: 'smooth' });
  let tq; $('#kq').oninput = e => { clearTimeout(tq); tq = setTimeout(async () => { KB.q = e.target.value; await kanban(); const i = $('#kq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 300); };
  $('#kre').onclick = () => kanban();
  if ($('#kpd')) $('#kpd').onclick = guarda(async () => { const x = await api('POST', '/kanban/preparar', { simular: true }); if (!confirm(`Preparar o funil BK no Bitrix24:\n• criar ${x.criar.length} campo(s) de negócio (${x.criar.slice(0, 5).join(', ')}${x.criar.length > 5 ? '…' : ''})\n${x.remover.length ? '• remover ' + x.remover.length + ' campo(s) antigo(s) de documentos\n' : ''}• ${x.formulario}\n\nO campo Tipo de Serviço novo é múltiplo e recebe os valores do campo antigo. Confirmar?`)) return; const y = await api('POST', '/kanban/preparar', { simular: false }); aviso(`${y.criados.length} campo(s) criado(s); ${y.migrados} negócio(s) migrado(s) para Tipo de Serviço. ${y.formulario}.`); kanban(); });
  $('#tela').querySelectorAll('[data-tp]').forEach(b => b.onclick = () => { KB.tipos.has(b.dataset.tp) ? KB.tipos.delete(b.dataset.tp) : KB.tipos.add(b.dataset.tp); kanban(); });
  $('#tela').querySelectorAll('[data-pe]').forEach(b => b.onclick = () => { KB.pend = KB.pend === b.dataset.pe ? '' : b.dataset.pe; kanban(); });
  const por = new Map(r.cards.map(c => [c.id, c]));
  $('#tela').querySelectorAll('.kb-cd').forEach(el => el.onclick = e => { if (!e.target.closest('button')) kbDetalhe(por.get(el.dataset.id), r); });
  $('#tela').querySelectorAll('[data-do]').forEach(b => b.onclick = e => { e.stopPropagation(); kbDocs(por.get(b.dataset.do), r); });
  $('#tela').querySelectorAll('[data-ge]').forEach(b => b.onclick = e => { e.stopPropagation(); kbGerar(por.get(b.dataset.ge), r); });

function csv(ls) {
  const c = ['BKN', 'Unidade', 'CNPJ', 'Cidade', 'UF', 'Licença', 'Validade licença', 'Precisa RT', 'RT', 'CRN', 'Validade RT', 'Etapa', 'Previsão virada', 'Pendências'];

  const rows = ls.map(u => [u.bkn, u.nome, u.cnpj, u.cidade, u.uf, u.licenca, u.licencaValidade, u.necessitaRt, u.rt.nome, u.rt.crn, u.rt.validade, u.etapa, u.previsaoVirada, u.pendencias.join(' | ')].map(q).join(';'));
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + [c.map(q).join(';'), ...rows].join('\r\n')], { type: 'text/csv' })); a.download = 'unidades-bk.csv'; a.click();
}

  <div class="box tw"><table><tr>${podeEditar ? `<th><input type="checkbox" id="mall" ${todosVis.length && todosVis.every(i => SEL.has(i.unidadeId)) ? 'checked' : ''} aria-label="Marcar todas"></th>` : ''}<th>BKN</th><th>Unidade</th><th>UF</th><th style="text-align:right">Valor</th><th>Situação</th></tr>${pagina.map(i => `<tr class="cl" data-id="${h(i.unidadeId)}">${podeEditar ? `<td><input type="checkbox" class="msel" data-u="${h(i.unidadeId)}" ${i.gerar ? '' : 'disabled'} ${SEL.has(i.unidadeId) ? 'checked' : ''}></td>` : ''}<td>${h(i.bkn)}</td><td>${h(i.nome)}</td><td>${h(i.uf)}</td><td style="text-align:right">${brl(i.valor)}</td><td>${i.gerar ? '<span class="sel ok">Pode gerar</span>' : `<span class="sel w">${h(i.motivo)}</span>`}</td></tr>`).join('') || `<tr><td colspan="6" class="mut">Nenhuma unidade.</td></tr>`}</table>

  <div class="box"><h2>Medições geradas</h2>${hist.length ? `<table><tr><th>Competência</th><th>Unidades</th><th style="text-align:right">Total</th><th></th></tr>${hist.map(m => `<tr><td>${h(m.competencia)}</td><td>${m.unidades}</td><td style="text-align:right">${brl(m.total)}</td><td>${podeEditar ? `<button class="btn d" data-des="${h(m.competencia)}">Desfazer</button>` : ''}</td></tr>`).join('')}</table><p class="mut">Os títulos aparecem em Contas → A receber, onde você emite boleto/Pix pelo Asaas e faz a baixa.</p>` : '<p class="mut">Nenhuma medição ainda.</p>'}</div>`;

  $('#comp').onchange = e => { COMP = e.target.value || COMP; SEL = null; MP = 1; medicao(); };
  let tm; $('#mq').oninput = e => { clearTimeout(tm); tm = setTimeout(async () => { MQ = e.target.value; MP = 1; await medicao(); const i = $('#mq'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); }, 350); };
  $('#mpa').onclick = () => { MP--; medicao(); }; $('#mpn').onclick = () => { MP++; medicao(); };
  $('#tela').querySelectorAll('tr.cl').forEach(r => r.onclick = e => { if (e.target.closest('input')) return; ficha(r.dataset.id); });
  if (podeEditar) {
    const atualiza = () => { const tot = Math.round(p.itens.filter(i => SEL.has(i.unidadeId)).reduce((s, i) => s + i.valor, 0) * 100) / 100; $('#mres').textContent = `${SEL.size} marcada(s) · ${brl(tot)}`; $('#ger').disabled = !(SEL.size && cfgOk); };
    $('#tela').querySelectorAll('.msel').forEach(c => c.onchange = () => { c.checked ? SEL.add(c.dataset.u) : SEL.delete(c.dataset.u); atualiza(); });
    $('#mall').onchange = e => { todosVis.forEach(i => e.target.checked ? SEL.add(i.unidadeId) : SEL.delete(i.unidadeId)); $('#tela').querySelectorAll('.msel:not(:disabled)').forEach(c => c.checked = e.target.checked); atualiza(); };
    $('#ger').onclick = guarda(async () => { const tot = Math.round(p.itens.filter(i => SEL.has(i.unidadeId)).reduce((s, i) => s + i.valor, 0) * 100) / 100; if (!confirm(`Gerar ${SEL.size} título(s) em A Receber, total ${brl(tot)}, vencimento dia ${p.config.diaVenc} do mês seguinte?`)) return; const r = await api('POST', '/medicao/gerar', { competencia: COMP, unidades: [...SEL] }); SEL = null; aviso(`${r.geradas} título(s) gerados (${brl(r.total)}), vencimento ${dt(r.venc)}.`); medicao(); });
    $('#tela').querySelectorAll('[data-des]').forEach(b => b.onclick = guarda(async () => { if (!confirm(`Desfazer a medição ${b.dataset.des}? Os títulos em aberto serão removidos do A Receber.`)) return; const r = await api('POST', '/medicao/desfazer', { competencia: b.dataset.des }); SEL = null; aviso(`${r.removidos} título(s) removidos.`); medicao(); }));
  }
});

// ---------- Configurações ----------
// Modelos de checklist de verificação por tipo de serviço (um item por linha). Os itens entram como opções no campo do negócio no Bitrix24.
const checklistsConfig = guarda(async (r0) => {
  let r = r0; if (!r) { try { r = await api('GET', '/kanban'); } catch (e) { return; } }
  const box = document.createElement('div'); box.className = 'box'; box.id = 'ckcfg';
  box.innerHTML = `<h2>Checklists de verificação</h2><p class="mut" style="margin:0 0 10px">Na etapa <b>Verificação de documentação</b>, cada tipo de serviço do card gera o seu checklist. O card só avança com todos os itens marcados. Escreva um item por linha; os itens aparecem também no negócio do Bitrix24.</p>
  <form id="fck"><div id="fcke"></div>${r.tipos.map(t => `<label style="display:grid;gap:3px;font-size:12.5px;color:var(--mut);margin-bottom:10px"><b style="color:var(--ink);font-size:13.5px">${h(t.nome)}</b><textarea name="${h(t.nome)}" rows="3" placeholder="Um item por linha" ${podeAdmin ? '' : 'disabled'}>${h((r.checklists[t.nome] || []).join('\n'))}</textarea></label>`).join('')}${podeAdmin ? '<div class="dr"><button class="btn p">Salvar checklists</button></div>' : '<p class="mut">Só o administrador altera os modelos.</p>'}</form>`;
  $('#tela').appendChild(box);
  if (podeAdmin) $('#fck').onsubmit = async e => { e.preventDefault(); const checklists = Object.fromEntries(new FormData(e.target)); try { const x = await api('PUT', '/kanban/checklists', { checklists }); aviso(`Checklists salvos (${Object.keys(x.checklists).length} tipo(s) com itens) e atualizados no Bitrix24.`); } catch (er) { $('#fcke').innerHTML = `<p class="msg e">${h(er.message)}</p>`; } };
});
// Modelos de documentos: os do sistema (carta de defesa, parecer, plano de ação, certificado) e os que o administrador envia com {{campos}}.
const modelosConfig = guarda(async (r) => {
  const { modelos } = await api('GET', '/kanban/modelos'), box = document.createElement('div'); box.className = 'box';
  box.innerHTML = `<h2>Modelos de documentos</h2><p class="mut" style="margin:0 0 10px">Na etapa <b>Envio de Documentos</b>, o botão “Gerar documentos” do card usa estes modelos e preenche com os dados da unidade, da empresa e do negócio.</p>
  ${modelos.map(m => `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)"><span><b>${h(m.nome)}</b> <span class="sel">${h(m.formato.toUpperCase())}</span> ${m.embutido ? '<span class="sel ok">do sistema</span>' : '<span class="sel w">enviado</span>'}<br><small class="mut">${h(m.descricao)}</small><br><small>Tipos de serviço: ${m.tipos.length ? h(m.tipos.join(', ')) : 'todos'} · campos: ${m.campos.map(c => h(c.k)).join(', ') || '—'}</small></span>${!m.embutido && podeAdmin ? `<button class="btn d" data-md="${h(m.id)}">Remover</button>` : ''}</div>`).join('')}
  ${podeAdmin ? `<form id="fmo" style="margin-top:12px"><h2 style="font-size:14.5px">Enviar um modelo novo</h2><p class="mut" style="margin:0 0 8px;font-size:12.5px">Arquivo .docx ou .xlsx com marcadores {{assim}} onde o dado deve entrar. Preenchimento automático pelo nome: <code>{{unidade}} {{bkn}} {{cnpj}} {{endereco}} {{cidade}} {{uf}} {{cep}} {{empresa}} {{empresa_razao}} {{contato}} {{rt_nome}} {{rt_crn}} {{data}} {{data_extenso}} {{cidade_uf}} {{tipos}} {{usuario}}</code>. Qualquer outro nome vira um campo que você preenche na hora de gerar.</p><div id="fme"></div>
  <div class="f"><label>Nome do modelo<input name="nome" required></label><label>Arquivo<input type="file" name="arq" accept=".docx,.xlsx" required></label><label class="w" style="grid-column:1/-1">Vale para os tipos de serviço (opcional)<span style="display:flex;flex-wrap:wrap;gap:8px">${r.tipos.map(t => `<label style="display:flex;gap:4px;align-items:center;font-size:13px"><input type="checkbox" name="t" value="${h(t.nome)}"> ${h(t.nome)}</label>`).join('')}</span></label></div><div class="dr"><button class="btn p">Enviar modelo</button></div></form>` : ''}`;
  $('#tela').appendChild(box);
  box.querySelectorAll('[data-md]').forEach(b => b.onclick = guarda(async () => { if (!confirm('Remover este modelo?')) return; await api('DELETE', `/kanban/modelos/${b.dataset.md}`); aviso('Modelo removido.'); config(); }));
  if ($('#fmo')) $('#fmo').onsubmit = async e => { e.preventDefault(); const f = e.target, file = f.arq.files[0]; $('#fme').innerHTML = '';
    try { if (file.size > 8 * 1048576) throw new Error('O arquivo deve ter até 8 MB.'); const { dados } = await lerArquivo(file); await api('POST', '/kanban/modelos', { nome: f.nome.value, tipos: [...f.querySelectorAll('[name=t]:checked')].map(x => x.value), arquivo: dados, nomeArquivo: file.name }); aviso('Modelo enviado.'); config(); } catch (er) { $('#fme').innerHTML = `<p class="msg e">${h(er.message)}</p>`; } };
});
const config = guarda(async () => {
  await boot(); const c = BOOT.config;
  $('#tela').innerHTML = `<h1>Configurações do BK</h1><p class="sub">Alertas de vencimento e parâmetros da medição.</p><form class="box" id="fc"><div class="f">
  <label>Empresa que fatura<select name="empresaId"><option value="">Escolha…</option>${BOOT.empresas.map(e => `<option value="${h(e.id)}" ${e.id === c.empresaId ? 'selected' : ''}>${h(e.nome)}</option>`).join('')}</select></label>
  <label>Cliente nos títulos<input name="cliente" value="${h(c.cliente)}"></label><label>Valor mensal padrão (R$)<input name="valorPadrao" type="number" min="0" step="0.01" value="${c.valorPadrao}"></label>
  <label>Dia de vencimento (1 a 28)<input name="diaVenc" type="number" min="1" max="28" value="${c.diaVenc}"></label><label>Categoria<input name="categoria" value="${h(c.categoria)}"></label>
  <label>Avisar quando faltarem (dias)<input name="marcos" value="${c.marcos.join(', ')}"></label><label>Responsável padrão dos alertas (ID do usuário no Bitrix)<input name="responsavelPadrao" inputmode="numeric" value="${h(c.responsavelPadrao)}"></label></div>
  <p class="mut">Os alertas cobrem validade da licença, validade do RT, previsão de virada e prazo de protocolo. Vão por notificação no Bitrix para o responsável da unidade (ou o padrão) e correm uma vez por hora; cada marco é avisado uma única vez.</p>
  <div class="dr">${podeEditar ? '<button type="button" class="btn" id="sim">Simular avisos agora</button><button class="btn p">Salvar</button>' : ''}</div></form><div id="simr"></div>
  ${podeEditar ? `<div class="box"><h2>Dados de demonstração</h2><p class="mut">Unidades fictícias para apresentar o processo ao cliente. Podem ser removidas a qualquer momento; não afetam dados reais.</p>${BOOT.demo ? '<button class="btn d" id="dd">Remover demonstração</button>' : '<button class="btn" id="dc">Carregar demonstração</button>'}</div>` : ''}`;
  api('GET', '/kanban').then(r => { checklistsConfig(r); modelosConfig(r); }).catch(() => {});
  if (!podeEditar) return;
  $('#fc').onsubmit = guarda(async e => { e.preventDefault(); const f = Object.fromEntries(new FormData(e.target)); f.marcos = f.marcos.split(/[,\s;]+/).filter(Boolean); await api('PUT', '/config', f); aviso('Configurações salvas.'); });
  $('#sim').onclick = guarda(async () => { const r = await api('POST', '/avisar', { simular: true }); $('#simr').innerHTML = `<div class="box"><h2>Avisos que sairiam agora (${r.enviados.length})</h2>${r.enviados.length ? `<ul class="lst">${r.enviados.slice(0, 40).map(x => `<li>${h(x.msg)} ${x.responsavel ? '' : '<span class="sel b">sem responsável</span>'}</li>`).join('')}</ul>` : '<p class="mut">Nenhum aviso pendente.</p>'}</div>`; });
  const d = $('#dc') || $('#dd'); d.onclick = guarda(async () => { if ($('#dd') && !confirm('Remover as unidades de demonstração (e títulos de medição ligados a elas)?')) return; await api($('#dd') ? 'DELETE' : 'POST', $('#dd') ? '/demo' : '/demo/carregar'); aviso('Pronto.'); config(); });
});

(async () => {
  if (!NM.token) return NM.paraLogin();
  try { const r = await nmFetch('/api/auth/me'), j = await r.json().catch(() => ({})); if (!r.ok) throw 0; if (j.usuario.trocarSenha) { location.href = '/'; return; }
    ME = j.usuario; podeEditar = ME.perfil === 'admin' || ME.perfil === 'financeiro'; podeAdmin = ME.perfil === 'admin'; $('#user').textContent = ME.nome + ' · ' + ME.perfilNome; $('#app').hidden = false;
    const a = location.hash.slice(1); abrirAba(ABAS.some(x => x[0] === a) ? a : 'kanban');
  } catch { NM.paraLogin(); }
})();
