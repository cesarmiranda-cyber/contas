<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fila de Visitas</title>
<link rel="icon" href="/_gw/icon">
<style>
:root{--bg:#f5f7f8;--surface:#fff;--ink:#14201f;--ink2:#476;--mut:#6b7c7a;--line:#e1e8e7;--brand:#0f766e;--brandbg:#dff3f0;--red:#c62828;--redbg:#fde8e8;--amber:#a15c00;--amberbg:#fff1d6;--green:#1b7f45;--greenbg:#e1f5e9;--shadow:0 1px 2px rgba(0,0,0,.05),0 8px 20px -12px rgba(0,0,0,.18)}
@media(prefers-color-scheme:dark){:root{--bg:#0d1514;--surface:#142120;--ink:#e8f1ef;--ink2:#a9bdb9;--mut:#7f9692;--line:#243735;--brand:#3dc4b6;--brandbg:#0f3330;--red:#ff8a80;--redbg:#3a1a1a;--amber:#f4b860;--amberbg:#3a2c10;--green:#6fd699;--greenbg:#0f3322;--shadow:0 8px 20px -12px rgba(0,0,0,.7)}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:17px;margin:0;flex:1;min-width:140px}.sub{font-size:12px;color:var(--mut);font-weight:400;display:block}
nav{max-width:980px;margin:0 auto;padding:0 12px;display:flex;gap:2px;overflow-x:auto}
nav button{border:0;background:none;color:var(--ink2);padding:10px 12px;font:inherit;font-weight:600;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--brand);border-color:var(--brand)}
main{max-width:980px;margin:0 auto;padding:16px}
select,input,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{min-height:90px;resize:vertical}label{display:block;font-size:12.5px;font-weight:600;color:var(--ink2);margin:12px 0 4px}
.filters{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:10px;font:inherit;font-weight:600;cursor:pointer;min-height:44px}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn:disabled{opacity:.6}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:20px 0 8px;display:flex;gap:8px;align-items:center}
h2 em{font-style:normal;background:var(--line);border-radius:99px;padding:0 8px;font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow)}
.card.atrasada{border-left-color:var(--red)}.card.dia{border-left-color:var(--amber)}.card.aguardando{border-left-color:var(--brand)}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}.emp{font-weight:700;font-size:16px}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tag{font-size:12px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--brandbg);color:var(--brand)}.tag.g{background:var(--line);color:var(--ink2)}
.when{font-size:13px;font-weight:700;white-space:nowrap}.when.atrasada{color:var(--red)}.when.dia{color:var(--amber)}
.acts{display:flex;gap:8px}.acts .btn{flex:1}
.vazio{text-align:center;color:var(--mut);padding:36px 12px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center;z-index:30}.modal.on{display:flex}
.sheet{background:var(--surface);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px 22px;max-height:92vh;overflow:auto}
@media(min-width:600px){.modal{align-items:center}.sheet{border-radius:18px}}
.err{background:var(--redbg);color:var(--red);padding:9px 11px;border-radius:10px;margin-top:12px;font-weight:600;display:none}.err.on{display:block}
.ok{background:var(--greenbg);color:var(--green);padding:9px 11px;border-radius:10px;margin:0 0 12px;font-weight:600}
table{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--surface);border-radius:12px;overflow:hidden}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.hint{font-size:12.5px;color:var(--mut)}
@media(max-width:520px){.filters{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<header>
  <div class="bar"><h1>Fila de Visitas<span class="sub" id="sub">DLC Diesel</span></h1><select id="quem" style="width:auto;max-width:48vw" title="Quem é você"></select></div>
  <nav id="tabs"></nav>
</header>
<main id="main"></main>

<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = iso => iso ? iso.split('-').reverse().join('/') : '—';
let uid = null, eu = {}, aba = 'minhas', dados = null, users = [];
try { uid = +localStorage.getItem('fv.uid') || null; } catch {}
const F = { seg: '', tipo: '', classe: '' };

async function api(path, opt = {}) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(path + (uid ? `${sep}uid=${uid}` : ''), { ...opt, headers: { 'Content-Type': 'application/json' }, body: opt.body ? JSON.stringify({ uid, ...opt.body }) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Erro ${r.status}`);
  return j;
}

async function init() {
  try { users = await api('/api/usuarios'); } catch (e) { $('#main').innerHTML = `<div class="vazio">${esc(e.message)}</div>`; return; }
  eu = await api('/api/eu');
  if (eu.verificado) uid = eu.uid;
  const q = $('#quem');
  q.innerHTML = `<option value="">Quem é você?</option>` + users.map(u => `<option value="${u.id}">${esc(u.nome)}</option>`).join('');
  q.value = uid || '';
  if (eu.verificado) q.style.display = 'none';
  q.onchange = async () => { uid = +q.value || null; try { localStorage.setItem('fv.uid', uid || ''); } catch {} eu = await api('/api/eu'); montaAbas(); carrega(); };
  montaAbas(); carrega();
}
function montaAbas() {
  const abas = [['minhas', 'Minhas visitas'], ['equipe', 'Equipe'], ['hist', 'Reprogramações'], ['log', 'Auditoria'], ['cfg', 'Configurações']];
  $('#tabs').innerHTML = abas.map(([k, t]) => `<button class="${aba === k ? 'on' : ''}" data-k="${k}">${t}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { aba = b.dataset.k; montaAbas(); carrega(); });
}
async function carrega() {
  const m = $('#main');
  if (!uid && aba !== 'cfg') { m.innerHTML = '<div class="vazio">Escolha seu nome no topo para ver as suas visitas.</div>'; return; }
  m.innerHTML = '<div class="vazio">Carregando…</div>';
  try {
    if (aba === 'minhas' || aba === 'equipe') { dados = await api(`/api/visitas?escopo=${aba === 'minhas' ? 'minhas' : 'equipe'}`); lista(); }
    else if (aba === 'hist') hist(await api('/api/historico'));
    else if (aba === 'log') auditoria(await api('/api/log'));
    else cfg(await api('/api/config'));
  } catch (e) { m.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

function lista() {
  const v = dados.visitas.filter(x => (!F.seg || x.segmento === F.seg) && (!F.tipo || (x.tipoEmpresa || '').toLowerCase() === F.tipo) && (!F.classe || x.classe === F.classe));
  const segs = [...new Set(dados.visitas.map(x => x.segmento))].filter(Boolean);
  const grupos = [['atrasada', 'Atrasadas'], ['dia', 'Hoje'], ['aguardando', 'Próximas']];
  const opt = (arr, cur) => arr.map(([a, b]) => `<option value="${a}" ${cur === a ? 'selected' : ''}>${b}</option>`).join('');
  $('#main').innerHTML = `
    <div class="filters">
      <select id="fs"><option value="">Todos os segmentos</option>${opt(segs.map(s => [s, s]), F.seg)}</select>
      <select id="ft"><option value="">Industrial e marítimo</option>${opt([['industrial', 'Industrial'], ['marítimo', 'Marítimo']], F.tipo)}</select>
      <select id="fc"><option value="">Todas as classes</option>${opt([['A', 'Classe A'], ['B', 'Classe B'], ['C', 'Classe C']], F.classe)}</select>
    </div>` + (v.length ? grupos.map(([k, t]) => {
      const g = v.filter(x => x.situacao === k);
      if (!g.length) return '';
      return `<h2>${t} <em>${g.length}</em></h2>` + g.map(c => card(c)).join('');
    }).join('') : '<div class="vazio">Nenhuma visita na fila. 🎉</div>');
  $('#fs').onchange = e => { F.seg = e.target.value; lista(); };
  $('#ft').onchange = e => { F.tipo = e.target.value; lista(); };
  $('#fc').onchange = e => { F.classe = e.target.value; lista(); };
  document.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => registrar(+b.dataset.reg));
  document.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => reprogramar(+b.dataset.rep));
}
function card(c) {
  const quando = c.dias === null ? 'Sem data' : c.situacao === 'dia' ? 'Hoje' : c.dias < 0 ? `${-c.dias} dia(s) de atraso` : `em ${c.dias} dia(s)`;
  return `<div class="card ${c.situacao}">
    <div class="top"><div><div class="emp">${esc(c.empresa)}</div><div class="hint">${esc(c.responsavelNome)}</div></div><div class="when ${c.situacao}">${fmt(c.data)}<div class="hint">${quando}</div></div></div>
    <div class="meta"><span class="tag">${esc(c.segmento)}</span><span class="tag g">${esc(c.cargo)}</span>${c.classe ? `<span class="tag g">Classe ${esc(c.classe)}</span>` : ''}${c.tipoEmpresa ? `<span class="tag g">${esc(c.tipoEmpresa)}</span>` : ''}</div>
    <div class="acts"><button class="btn pri" data-reg="${c.id}">Registrar visita</button><button class="btn" data-rep="${c.id}">Reprogramar</button></div></div>`;
}
const modal = html => { $('#sheet').innerHTML = html; $('#m').classList.add('on'); };
const fecha = () => $('#m').classList.remove('on');
$('#m').onclick = e => { if (e.target.id === 'm') fecha(); };
const achar = id => dados.visitas.find(x => x.id === id);
const agoraLocal = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

function registrar(id) {
  const c = achar(id);
  modal(`<h3 style="margin:0">Registrar visita</h3><div class="hint">${esc(c.empresa)} · ${esc(c.segmento)} · ${esc(c.cargo)}</div>
    <label>Data e hora da visita</label><input type="datetime-local" id="dh" value="${agoraLocal()}">
    <label>Resultado / observações *</label><textarea id="res" placeholder="O que foi tratado com o cliente?"></textarea>
    <label>Acompanhamento (opcional)</label><input id="aco" placeholder="Próximo passo, retorno combinado…">
    <div class="err" id="er"></div>
    <div class="acts" style="margin-top:14px"><button class="btn" onclick="fecha()">Cancelar</button><button class="btn pri" id="ok">Salvar visita</button></div>`);
  $('#ok').onclick = async () => {
    $('#ok').disabled = true; $('#er').classList.remove('on');
    try {
      const r = await api(`/api/cards/${id}/registrar`, { method: 'POST', body: { resultado: $('#res').value, acompanhamento: $('#aco').value, dataHora: new Date($('#dh').value).toISOString() } });
      modal(`<div class="ok">Visita registrada${r.antecipada ? ' (antecipada)' : ''}. ${r.proximaData ? `Próxima visita: ${fmt(r.proximaData)}.` : ''}</div><button class="btn pri" style="width:100%" onclick="fecha();carrega()">Fechar</button>`);
    } catch (e) { $('#er').textContent = e.message; $('#er').classList.add('on'); $('#ok').disabled = false; }
  };
}
function reprogramar(id) {
  const c = achar(id), mes = c.data.slice(0, 7), [y, m] = mes.split('-');
  const ult = new Date(+y, +m, 0).getDate();
  modal(`<h3 style="margin:0">Reprogramar visita</h3><div class="hint">${esc(c.empresa)} · ${esc(c.segmento)} · ${esc(c.cargo)}<br>Data atual: <b>${fmt(c.data)}</b> — só é possível escolher um dia de ${m}/${y}.</div>
    <label>Nova data *</label><input type="date" id="nd" min="${mes}-01" max="${mes}-${String(ult).padStart(2, '0')}" value="${c.data}">
    <label>Motivo *</label><textarea id="mo" placeholder="Por que a visita muda de data?"></textarea>
    <div class="err" id="er"></div>
    <div class="acts" style="margin-top:14px"><button class="btn" onclick="fecha()">Cancelar</button><button class="btn pri" id="ok">Reprogramar</button></div>`);
  $('#ok').onclick = async () => {
    $('#ok').disabled = true; $('#er').classList.remove('on');
    try { await api(`/api/cards/${id}/reprogramar`, { method: 'POST', body: { nova: $('#nd').value, motivo: $('#mo').value } }); fecha(); carrega(); }
    catch (e) { $('#er').textContent = e.message; $('#er').classList.add('on'); $('#ok').disabled = false; }
  };
}

function hist(d) {
  const h = d.reprogramacoes;
  const porMotivo = {}, porAutor = {};
  h.filter(x => !x.tipo).forEach(x => { porMotivo[x.motivo] = (porMotivo[x.motivo] || 0) + 1; porAutor[x.autorNome] = (porAutor[x.autorNome] || 0) + 1; });
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('') || '<tr><td colspan=2 class="hint">Sem dados</td></tr>';
  $('#main').innerHTML = `<h2>Trocas por vendedor</h2><div class="tw"><table><tr><th>Quem</th><th>Trocas</th></tr>${top(porAutor)}</table></div>
    <h2>Trocas por motivo</h2><div class="tw"><table><tr><th>Motivo</th><th>Trocas</th></tr>${top(porMotivo)}</table></div>
    <h2>Histórico <em>${h.length}</em></h2><div class="tw"><table><tr><th>Quando</th><th>Empresa</th><th>De → Para</th><th>Motivo</th><th>Quem</th></tr>${h.map(x => x.tipo ? `<tr><td>${new Date(x.at).toLocaleString('pt-BR')}</td><td colspan=2>Correção de visita #${x.visita}</td><td>${esc(x.motivo)}</td><td>${esc(x.autorNome)}</td></tr>` : `<tr><td>${new Date(x.at).toLocaleString('pt-BR')}</td><td>${esc(x.empresa)}<div class="hint">${esc(x.segmento)} · ${esc(x.cargo)}</div></td><td>${fmt(x.anterior)} → ${fmt(x.nova)}</td><td>${esc(x.motivo)}</td><td>${esc(x.autorNome)}</td></tr>`).join('') || '<tr><td colspan=5 class="hint">Nenhuma reprogramação.</td></tr>'}</table></div>`;
}
function auditoria(d) {
  $('#main').innerHTML = `<h2>Edições bloqueadas <em>${d.bloqueios.length}</em></h2><div class="tw"><table><tr><th>Quando</th><th>O quê</th><th>Tentou</th><th>Restaurado</th></tr>${d.bloqueios.map(b => `<tr><td>${new Date(b.at).toLocaleString('pt-BR')}</td><td>${b.tipo === 'visita-data' ? 'Data da visita #' + b.visita : 'Data programada do card #' + b.card}</td><td>${esc(b.tentou)}</td><td>${esc(b.original)}</td></tr>`).join('') || '<tr><td colspan=4 class="hint">Nenhuma.</td></tr>'}</table></div>
    <h2>Log de ações automáticas</h2><div class="tw"><table><tr><th>Quando</th><th>Tipo</th><th>O que aconteceu</th></tr>${d.log.map(l => `<tr><td>${new Date(l.at).toLocaleString('pt-BR')}</td><td>${esc(l.tipo)}</td><td>${esc(l.msg)}</td></tr>`).join('')}</table></div>`;
}
async function cfg(d) {
  const c = d.config;
  let campos = null; try { campos = await api('/api/campos'); } catch (e) { campos = { erro: e.message }; }
  const cargos = ['Vendedor', 'Supervisor', 'Coordenador', 'Gerente', 'Diretor'];
  $('#main').innerHTML = `
    ${d.webhook ? '' : '<div class="err on">BITRIX_WEBHOOK não definido: o app ainda não está ligado ao Bitrix24.</div>'}
    <h2>Intervalos entre visitas (dias)</h2><div class="tw"><table><tr><th>Cargo</th><th>A</th><th>B</th><th>C</th></tr>${cargos.map(g => `<tr><td>${g}</td>${['A', 'B', 'C'].map(k => `<td><input data-i="${g}.${k}" type="number" min="1" value="${c.intervalos[g][k]}"></td>`).join('')}</tr>`).join('')}</table></div>
    <h2>Geral</h2>
    <label>Hora do job diário (Brasília)</label><input id="hj" type="number" min="0" max="23" value="${c.horaJob}">
    <label><input type="checkbox" id="ta" style="width:auto" ${c.tarefaAtiva ? 'checked' : ''}> Criar tarefa "Realizar Visita" (prazo em horas úteis)</label>
    <label>Horas úteis do prazo</label><input id="th" type="number" min="1" value="${c.tarefaHorasUteis}">
    <label><input type="checkbox" id="ap" style="width:auto" ${c.atualizarProxima ? 'checked' : ''}> Gravar "Próxima Visita" do segmento na empresa</label>
    <label>Motores: qual par de datas é o oficial?</label><select id="md"><option value="secao" ${c.motoresDatas === 'secao' ? 'selected' : ''}>Campos da seção (Próxima/Última Visita)</option><option value="extra" ${c.motoresDatas === 'extra' ? 'selected' : ''}>Campos extras (Data Próxima Visita / Última Visita)</option></select>
    <label>Administradores (IDs de usuário, separados por vírgula) — podem corrigir registros</label><input id="ad" value="${(c.admins || []).join(',')}">
    <div class="err" id="er"></div><div class="acts" style="margin-top:12px"><button class="btn pri" id="sv">Salvar configuração</button></div>
    <h2>Campos descobertos no Bitrix24</h2>${campos.erro ? `<div class="err on">${esc(campos.erro)}</div>` : `
      ${campos.faltando.length ? `<div class="err on">Faltando: ${campos.faltando.map(esc).join(' · ')}</div>` : '<div class="ok">Todos os campos e etapas foram encontrados.</div>'}
      ${campos.ambiguos.length ? `<p class="hint">Ambíguos (revise): ${campos.ambiguos.map(a => esc(a.onde + ' → ' + a.opcoes.join(' | '))).join('<br>')}</p>` : ''}
      <details><summary>Ver mapeamento</summary><pre style="overflow:auto;font-size:12px">${esc(JSON.stringify(campos.map, null, 1))}</pre></details>`}
    <h2>Ações</h2><div class="acts"><button class="btn" id="b1">Sincronizar todas as empresas</button><button class="btn" id="b2">Rodar job diário agora</button></div><p class="hint" id="out"></p>`;
  $('#sv').onclick = async () => {
    const intervalos = {}; document.querySelectorAll('[data-i]').forEach(i => { const [g, k] = i.dataset.i.split('.'); (intervalos[g] ||= {})[k] = +i.value; });
    try {
      await api('/api/config', { method: 'PUT', body: { intervalos, horaJob: +$('#hj').value, tarefaAtiva: $('#ta').checked, tarefaHorasUteis: +$('#th').value, atualizarProxima: $('#ap').checked, motoresDatas: $('#md').value, admins: $('#ad').value.split(',').map(s => +s.trim()).filter(Boolean) } });
      $('#out').textContent = 'Configuração salva.';
    } catch (e) { $('#er').textContent = e.message; $('#er').classList.add('on'); }
  };
  $('#b1').onclick = async () => { $('#out').textContent = 'Sincronizando…'; try { const r = await api('/api/sincronizar', { method: 'POST', body: {} }); $('#out').textContent = `${r.length} empresa(s) processada(s); ${r.reduce((a, x) => a + (x.criados?.length || 0), 0)} card(s) criado(s).`; } catch (e) { $('#out').textContent = e.message; } };
  $('#b2').onclick = async () => { $('#out').textContent = 'Rodando…'; try { $('#out').textContent = JSON.stringify(await api('/api/job', { method: 'POST', body: { forcar: true } })); } catch (e) { $('#out').textContent = e.message; } };
}
init();
</script>
</body>
</html>
