<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fila de Visitas</title>
<link rel="icon" href="/_gw/icon">
<style>
:root{--bg:#eef2f4;--sf:#fff;--sf2:#f6f8fa;--ink:#1f2a37;--ink2:#525c69;--mut:#8b95a1;--line:#e2e7eb;--brand:#2066b0;--brand2:#17508f;--cy:#3bc8f5;--brandbg:#e6f1fb;
--red:#d9372b;--redbg:#fdebea;--amber:#b86b00;--amberbg:#fff2d6;--green:#2a8a3e;--greenbg:#e5f5e8;--r:12px;--sh:0 1px 2px rgba(20,35,50,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#10171d;--sf:#18212a;--sf2:#1d2832;--ink:#e8eef4;--ink2:#a9b6c3;--mut:#7a8896;--line:#2a3743;--brand:#5aa9ec;--brand2:#7dbcf2;--cy:#3bc8f5;--brandbg:#14293c;--red:#ff8f86;--redbg:#3a1c19;--amber:#f2b95a;--amberbg:#3a2d12;--green:#63d17a;--greenbg:#12301a}}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.head{background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.head .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--cy),var(--brand));color:#fff;display:grid;place-items:center;font-size:17px}
.who{margin-left:auto}.who select{width:auto;max-width:56vw;padding:7px 10px}
nav{display:flex;gap:6px;width:100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
nav button{border:0;background:var(--sf2);color:var(--ink2);padding:7px 14px;font-weight:600;border-radius:99px;cursor:pointer;white-space:nowrap}
nav button.on{background:var(--brand);color:#fff}
main{padding:16px 0 40px}
select,input,textarea{background:var(--sf);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%;outline:none;transition:border .15s,box-shadow .15s}
select:focus,input:focus,textarea:focus{border-color:var(--cy);box-shadow:0 0 0 3px color-mix(in srgb,var(--cy) 28%,transparent)}
textarea{min-height:96px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--sf);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;min-height:38px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2);color:#fff}.btn:disabled{opacity:.55;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;box-shadow:var(--sh);text-align:left;display:flex;align-items:center;gap:12px}
.stat i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:18px;flex:none}
.stat b{display:block;font-size:24px;line-height:1.05}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.stat.red i{background:var(--redbg);color:var(--red)}.stat.amber i{background:var(--amberbg);color:var(--amber)}.stat.blue i{background:var(--brandbg);color:var(--brand)}.stat.on{outline:2px solid var(--cy)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
h2 em{font-style:normal;background:var(--line);color:var(--ink2);border-radius:99px;padding:0 8px;font-size:12px}
.list{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.item{display:grid;grid-template-columns:1fr 150px auto;gap:14px;align-items:center;padding:12px 16px 12px 20px;border-bottom:1px solid var(--line);position:relative}
.item:last-child{border-bottom:0}.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cy)}
.item.atrasada:before{background:var(--red)}.item.dia:before{background:#f5a623}
.emp{font-weight:700;font-size:15px;line-height:1.25}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--sf2);border:1px solid var(--line);color:var(--ink2)}.tag.seg{background:var(--brandbg);border-color:transparent;color:var(--brand)}
.due b{display:block;font-size:14px}.due span{display:inline-block;margin-top:2px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--brandbg);color:var(--brand)}
.item.atrasada .due span{background:var(--redbg);color:var(--red)}.item.dia .due span{background:var(--amberbg);color:var(--amber)}
.acts{display:flex;gap:8px}
.vazio{text-align:center;color:var(--mut);padding:48px 12px}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}
.sheet{background:var(--sf);width:100%;max-width:640px;border-radius:16px 16px 0 0;max-height:94vh;display:flex;flex-direction:column}
@media(min-width:700px){.modal{align-items:center;padding:20px}.sheet{border-radius:14px}}
.sh-h{padding:16px 18px 12px;border-bottom:1px solid var(--line)}.sh-h h3{margin:0;font-size:18px}.sh-b{padding:6px 18px 8px;overflow:auto;flex:1}.sh-f{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:8px}.sh-f .btn{flex:1;min-height:42px}
.fld{margin:14px 0}.fld>label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}.fld>label i{color:var(--red);font-style:normal}
.fld.lock input,.fld.lock select{background:var(--sf2);color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.err{background:var(--redbg);color:var(--red);padding:10px 12px;border-radius:8px;margin:10px 0;font-weight:600;display:none}.err.on{display:block}
.ok{background:var(--greenbg);color:var(--green);padding:12px;border-radius:8px;margin:12px 0;font-weight:600}
.info{background:var(--brandbg);color:var(--brand);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13px}
.hint{font-size:12.5px;color:var(--mut)}.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sf)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-size:12px;text-transform:uppercase;background:var(--sf2)}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px 16px;box-shadow:var(--sh)}
@media(max-width:700px){.filters{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.item{grid-template-columns:1fr auto;gap:8px}.item .due{text-align:right}.item .acts{grid-column:1/-1}.item .acts .btn{flex:1}.stat{padding:10px}.stat b{font-size:20px}.stat i{width:32px;height:32px}}
</style>
</head>
<body>
<div class="head"><div class="wrap">
  <div class="brand"><div class="logo">◷</div>Fila de Visitas</div>
  <div class="who"><select id="quem" title="Quem é você"></select></div>
  <nav id="tabs"></nav>
</div></div>
<main><div class="wrap" id="main"></div></main>
<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = iso => iso ? iso.split('-').reverse().join('/') : '—';
let uid = null, eu = {}, aba = 'minhas', dados = null, users = [], foco = '';
try { uid = +localStorage.getItem('fv.uid') || null; } catch {}
const F = { seg: '', tipo: '', classe: '' };

async function api(path, opt = {}) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(path + (uid ? `${sep}uid=${uid}` : ''), { ...opt, headers: { 'Content-Type': 'application/json' }, body: opt.body ? JSON.stringify({ uid, ...opt.body }) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Erro ${r.status}`);
  return j;
}
async function init() {
  try { users = await api('/api/usuarios'); } catch (e) { $('#main').innerHTML = `<div class="vazio">${esc(e.message)}</div>`; return; }
  eu = await api('/api/eu');
  if (eu.verificado) uid = eu.uid;
  const q = $('#quem');
  q.innerHTML = `<option value="">Quem é você?</option>` + users.map(u => `<option value="${u.id}">${esc(u.nome)}</option>`).join('');
  q.value = uid || '';
  if (eu.verificado) q.style.display = 'none';
  q.onchange = async () => { uid = +q.value || null; try { localStorage.setItem('fv.uid', uid || ''); } catch {} eu = await api('/api/eu'); carrega(); };
  montaAbas(); carrega();
}
function montaAbas() {
  const abas = [['minhas', 'Minhas visitas'], ['equipe', 'Equipe'], ['hist', 'Reprogramações'], ['log', 'Auditoria'], ['cfg', 'Configurações']];
  $('#tabs').innerHTML = abas.map(([k, t]) => `<button class="${aba === k ? 'on' : ''}" data-k="${k}">${t}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { aba = b.dataset.k; foco = ''; montaAbas(); carrega(); });
}
async function carrega() {
  const m = $('#main');
  if (!uid && aba !== 'cfg') { m.innerHTML = '<div class="vazio">Escolha o seu nome no topo para ver as suas visitas.</div>'; return; }
  m.innerHTML = '<div class="vazio">Carregando…</div>';
  try {
    if (aba === 'minhas' || aba === 'equipe') { dados = await api(`/api/visitas?escopo=${aba}`); lista(); }
    else if (aba === 'hist') hist(await api('/api/historico'));
    else if (aba === 'log') auditoria(await api('/api/log'));
    else cfg(await api('/api/config'));
  } catch (e) { m.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

function lista() {
  const todas = dados.visitas, busca = (F.q || '').toLowerCase();
  const cont = k => todas.filter(x => x.situacao === k).length;
  const v = todas.filter(x => (!busca || x.empresa.toLowerCase().includes(busca)) && (!F.seg || x.segmento === F.seg) && (!F.tipo || (x.tipoEmpresa || '').toLowerCase() === F.tipo) && (!F.classe || x.classe === F.classe) && (!foco || x.situacao === foco));
  const segs = [...new Set(todas.map(x => x.segmento))].filter(Boolean);
  const opt = (arr, cur) => arr.map(([a, b]) => `<option value="${esc(a)}" ${cur === a ? 'selected' : ''}>${esc(b)}</option>`).join('');
  const grupos = [['atrasada', 'Atrasadas'], ['dia', 'Hoje'], ['aguardando', 'Próximas']];
  $('#main').innerHTML = `
    <div class="stats">
      <button class="stat red ${foco === 'atrasada' ? 'on' : ''}" data-f="atrasada"><i>!</i><div><b>${cont('atrasada')}</b><span>Atrasadas</span></div></button>
      <button class="stat amber ${foco === 'dia' ? 'on' : ''}" data-f="dia"><i>★</i><div><b>${cont('dia')}</b><span>Hoje</span></div></button>
      <button class="stat blue ${foco === 'aguardando' ? 'on' : ''}" data-f="aguardando"><i>◷</i><div><b>${cont('aguardando')}</b><span>Próximas</span></div></button>
    </div>
    <div class="filters">
      <input id="fq" type="search" placeholder="Buscar empresa…" value="${esc(F.q || '')}">
      <select id="fs"><option value="">Todos os segmentos</option>${opt(segs.map(s => [s, s]), F.seg)}</select>
      <select id="ft"><option value="">Industrial e marítimo</option>${opt([['industrial', 'Industrial'], ['marítimo', 'Marítimo']], F.tipo)}</select>
      <select id="fc"><option value="">Todas as classes</option>${opt([['A', 'Classe A'], ['B', 'Classe B'], ['C', 'Classe C']], F.classe)}</select>
    </div>` + (v.length ? grupos.map(([k, t]) => {
      const g = v.filter(x => x.situacao === k);
      return g.length ? `<h2>${t} <em>${g.length}</em></h2><div class="list">${g.map(linha).join('')}</div>` : '';
    }).join('') : '<div class="vazio">Nenhuma visita por aqui.</div>');
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { foco = foco === b.dataset.f ? '' : b.dataset.f; lista(); });
  const q = $('#fq'); q.oninput = () => { F.q = q.value; const p = q.selectionStart; lista(); const n = $('#fq'); n.focus(); n.setSelectionRange(p, p); };
  $('#fs').onchange = e => { F.seg = e.target.value; lista(); };
  $('#ft').onchange = e => { F.tipo = e.target.value; lista(); };
  $('#fc').onchange = e => { F.classe = e.target.value; lista(); };
  document.querySelectorAll('[data-reg]').forEach(b => b.onclick = () => registrar(+b.dataset.reg));
  document.querySelectorAll('[data-rep]').forEach(b => b.onclick = () => reprogramar(+b.dataset.rep));
}
function linha(c) {
  const q = c.dias === null ? 'Sem data' : c.situacao === 'dia' ? 'Hoje' : c.dias < 0 ? `${-c.dias} dia(s) de atraso` : `em ${c.dias} dia(s)`;
  return `<div class="item ${c.situacao}">
    <div><div class="emp">${esc(c.empresa)}</div><div class="tags"><span class="tag seg">${esc(c.segmento)}</span><span class="tag">${esc(c.cargo)}</span>${c.classe ? `<span class="tag">Classe ${esc(c.classe)}</span>` : ''}${c.tipoEmpresa ? `<span class="tag">${esc(c.tipoEmpresa)}</span>` : ''}${aba === 'equipe' ? `<span class="tag">${esc(c.responsavelNome)}</span>` : ''}</div></div>
    <div class="due"><b>${fmt(c.data)}</b><span>${q}</span></div>
    <div class="acts"><button class="btn pri" data-reg="${c.id}">Registrar visita</button><button class="btn" data-rep="${c.id}">Reprogramar</button></div></div>`;
}
const modal = html => { $('#sheet').innerHTML = html; $('#m').classList.add('on'); };
const fecha = () => $('#m').classList.remove('on');
$('#m').onclick = e => { if (e.target.id === 'm') fecha(); };
const achar = id => dados.visitas.find(x => x.id === id);
const localDT = iso => { const d = iso ? new Date(iso) : new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 16); };

// ---- Registrar visita: o formulário é montado com os campos do SPA 1032 ----
function campoHTML(c) {
  const id = 'f_' + c.key, req = c.obrigatorio ? ' <i>*</i>' : '', dis = c.travado ? 'disabled' : '';
  let ctl;
  if (c.tipo === 'texto') ctl = c.destaque || /observ|resultado|descri|conclus|motivo|acompanh/i.test(c.titulo) ? `<textarea id="${id}" ${dis} placeholder="Escreva aqui…">${esc(c.valor)}</textarea>` : `<input id="${id}" ${dis} value="${esc(c.valor)}">`;
  else if (c.tipo === 'numero') ctl = `<input id="${id}" type="number" step="any" inputmode="decimal" ${dis} value="${esc(c.valor)}">`;
  else if (c.tipo === 'data') ctl = `<input id="${id}" type="date" ${dis} value="${esc(String(c.valor).slice(0, 10))}">`;
  else if (c.tipo === 'datahora') ctl = `<input id="${id}" type="datetime-local" ${dis} value="${localDT(c.valor || null)}">`;
  else if (c.tipo === 'sim_nao') ctl = `<select id="${id}" ${dis}><option value="">—</option><option value="Y" ${c.valor === 'Y' ? 'selected' : ''}>Sim</option><option value="N" ${c.valor === 'N' ? 'selected' : ''}>Não</option></select>`;
  else if (c.tipo === 'lista') ctl = `<select id="${id}" ${dis} ${c.multiplo ? 'multiple size="4"' : ''}>${c.multiplo ? '' : '<option value="">—</option>'}${c.itens.map(i => `<option value="${esc(i.id)}" ${String(c.valor) === i.id ? 'selected' : ''}>${esc(i.nome)}</option>`).join('')}</select>`;
  else if (c.tipo === 'usuario') ctl = `<select id="${id}" ${dis}><option value="">—</option>${users.map(u => `<option value="${u.id}" ${String(c.valor) === String(u.id) ? 'selected' : ''}>${esc(u.nome)}</option>`).join('')}</select>`;
  const dica = c.travado ? ' <span class="hint">(automático)</span>' : '';
  return `<div class="fld ${c.travado ? 'lock' : ''}"><label for="${id}">${esc(c.titulo)}${req}${dica}</label>${ctl}</div>`;
}
function lerCampo(c) {
  const el = document.getElementById('f_' + c.key);
  if (!el || c.travado) return undefined;
  if (c.tipo === 'datahora') return el.value ? new Date(el.value).toISOString() : '';
  if (c.multiplo && el.multiple) return [...el.selectedOptions].map(o => o.value);
  return el.value;
}
async function registrar(id) {
  modal('<div class="sh-b"><div class="vazio">Carregando formulário…</div></div>');
  let form;
  try { form = await api(`/api/cards/${id}/form`); } catch (e) { modal(`<div class="sh-b"><div class="err on">${esc(e.message)}</div></div><div class="sh-f"><button class="btn" onclick="fecha()">Fechar</button></div>`); return; }
  const c = form.card;
  modal(`<div class="sh-h"><h3>Registrar visita</h3><div class="chips"><span class="tag seg">${esc(c.empresa)}</span><span class="tag">${esc(c.segmento)}</span><span class="tag">${esc(c.cargo)}</span><span class="tag">Programada: ${fmt(c.data)}</span>${c.antecipada ? '<span class="tag">Antecipada</span>' : ''}</div></div>
    <div class="sh-b">${form.campos.length ? form.campos.map(campoHTML).join('') : '<div class="hint" style="margin:14px 0">O SPA de Registro de Visita não tem campos personalizados.</div>'}
      ${form.resultadoKey ? '' : `<div class="fld"><label>Resultado / observações <i>*</i></label><textarea id="f_resultado" placeholder="O que foi tratado com o cliente?"></textarea></div>`}
      <div class="err" id="er"></div></div>
    <div class="sh-f"><button class="btn" onclick="fecha()">Cancelar</button><button class="btn pri" id="ok">Salvar visita</button></div>`);
  $('#ok').onclick = async () => {
    $('#ok').disabled = true; $('#er').classList.remove('on');
    const campos = {};
    for (const f of form.campos) { const v = lerCampo(f); if (v !== undefined) campos[f.key] = v; }
    try {
      const r = await api(`/api/cards/${id}/registrar`, { method: 'POST', body: { campos, resultado: document.getElementById('f_resultado')?.value || '', dataHora: form.dataHoraKey ? campos[form.dataHoraKey] : undefined } });
      modal(`<div class="sh-b"><div class="ok">Visita registrada${r.antecipada ? ' (antecipada)' : ''}.${r.proximaData ? ` Próxima visita: ${fmt(r.proximaData)}.` : ''}</div></div><div class="sh-f"><button class="btn pri" onclick="fecha();carrega()">Fechar</button></div>`);
    } catch (e) { $('#er').textContent = e.message; $('#er').classList.add('on'); $('#ok').disabled = false; $('#er').scrollIntoView({ block: 'nearest' }); }
  };
}
function reprogramar(id) {
  const c = achar(id), mes = c.data.slice(0, 7), [y, m] = mes.split('-');
  const ult = String(new Date(+y, +m, 0).getDate()).padStart(2, '0');
  modal(`<div class="sh-h"><h3>Reprogramar visita</h3><div class="chips"><span class="tag seg">${esc(c.empresa)}</span><span class="tag">${esc(c.segmento)}</span><span class="tag">${esc(c.cargo)}</span></div></div>
    <div class="sh-b"><div class="hint" style="margin-top:12px">Data atual: <b>${fmt(c.data)}</b>. Só é possível escolher um dia de ${m}/${y}.</div>
    <div class="fld"><label>Nova data <i>*</i></label><input type="date" id="nd" min="${mes}-01" max="${mes}-${ult}" value="${c.data}"></div>
    <div class="fld"><label>Motivo <i>*</i></label><textarea id="mo" placeholder="Por que a visita muda de data?"></textarea></div><div class="err" id="er"></div></div>
    <div class="sh-f"><button class="btn" onclick="fecha()">Cancelar</button><button class="btn pri" id="ok">Reprogramar</button></div>`);
  $('#ok').onclick = async () => {
    $('#ok').disabled = true; $('#er').classList.remove('on');
    try { await api(`/api/cards/${id}/reprogramar`, { method: 'POST', body: { nova: $('#nd').value, motivo: $('#mo').value } }); fecha(); carrega(); }
    catch (e) { $('#er').textContent = e.message; $('#er').classList.add('on'); $('#ok').disabled = false; }
  };
}

function hist(d) {
  const h = d.reprogramacoes, porMotivo = {}, porAutor = {};
  h.filter(x => !x.tipo).forEach(x => { porMotivo[x.motivo] = (porMotivo[x.motivo] || 0) + 1; porAutor[x.autorNome] = (porAutor[x.autorNome] || 0) + 1; });
  const top = o => Object.entries(o).sort((a, b) => b[1] - a[1]).slice(0, 5).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${v}</td></tr>`).join('') || '<tr><td colspan=2 class="hint">Sem dados</td></tr>';
  $('#main').innerHTML = `<h2>Trocas por vendedor</h2><div class="tw"><table><tr><th>Quem</th><th>Trocas</th></tr>${top(porAutor)}</table></div>
    <h2>Trocas por motivo</h2><div class="tw"><table><tr><th>Motivo</th><th>Trocas</th></tr>${top(porMotivo)}</table></div>
    <h2>Histórico <em>${h.length}</em></h2><div class="tw"><table><tr><th>Quando</th><th>Empresa</th><th>De → Para</th><th>Motivo</th><th>Quem</th></tr>${h.map(x => x.tipo ? `<tr><td>${new Date(x.at).toLocaleString('pt-BR')}</td><td colspan=2>Correção de visita #${x.visita}</td><td>${esc(x.motivo)}</td><td>${esc(x.autorNome)}</td></tr>` : `<tr><td>${new Date(x.at).toLocaleString('pt-BR')}</td><td>${esc(x.empresa)}<div class="hint">${esc(x.segmento)} · ${esc(x.cargo)}</div></td><td>${fmt(x.anterior)} → ${fmt(x.nova)}</td><td>${esc(x.motivo)}</td><td>${esc(x.autorNome)}</td></tr>`).join('') || '<tr><td colspan=5 class="hint">Nenhuma reprogramação.</td></tr>'}</table></div>`;
}
function auditoria(d) {
  $('#main').innerHTML = `<h2>Edições bloqueadas <em>${d.bloqueios.length}</em></h2><div class="tw"><table><tr><th>Quando</th><th>O quê</th><th>Tentou</th><th>Restaurado</th></tr>${d.bloqueios.map(b => `<tr><td>${new Date(b.at).toLocaleString('pt-BR')}</td><td>${b.tipo === 'visita-data' ? 'Data da visita #' + b.visita : 'Data programada do card #' + b.card}</td><td>${esc(b.tentou)}</td><td>${esc(b.original)}</td></tr>`).join('') || '<tr><td colspan=4 class="hint">Nenhuma.</td></tr>'}</table></div>
    <h2>Log de ações automáticas</h2><div class="tw"><table><tr><th>Quando</th><th>Tipo</th><th>O que aconteceu</th></tr>${d.log.map(l => `<tr><td>${new Date(l.at).toLocaleString('pt-BR')}</td><td>${esc(l.tipo)}</td><td>${esc(l.msg)}</td></tr>`).join('')}</table></div>`;
}
async function cfg(d) {
  const c = d.config;
  let campos = null; try { campos = await api('/api/campos'); } catch (e) { campos = { erro: e.message }; }
  const cargos = ['Vendedor', 'Supervisor', 'Coordenador', 'Gerente', 'Diretor'];
  $('#main').innerHTML = `
    ${d.webhook ? '' : '<div class="err on">BITRIX_WEBHOOK não definido: o app ainda não está ligado ao Bitrix24.</div>'}
    <div class="panel"><h2>Automação</h2>
      <label><input type="checkbox" id="at" style="width:auto" ${c.ativo ? 'checked' : ''}> <b>App ativo</b> — cria/atualiza cards, roda o job diário e reverte edições diretas</label>
      <p class="hint">Mantenha desligado até conferir os campos descobertos abaixo.</p></div>
    <h2>Intervalos entre visitas (dias)</h2><div class="tw"><table><tr><th>Cargo</th><th>A</th><th>B</th><th>C</th></tr>${cargos.map(g => `<tr><td>${g}</td>${['A', 'B', 'C'].map(k => `<td><input data-i="${g}.${k}" type="number" min="1" value="${c.intervalos[g][k]}"></td>`).join('')}</tr>`).join('')}</table></div>
    <h2>Geral</h2><div class="panel">
    <div class="fld"><label>Hora do job diário (Brasília)</label><input id="hj" type="number" min="0" max="23" value="${c.horaJob}"></div>
    <label><input type="checkbox" id="ta" style="width:auto" ${c.tarefaAtiva ? 'checked' : ''}> Criar tarefa "Realizar Visita" (prazo em horas úteis)</label>
    <div class="fld"><label>Horas úteis do prazo</label><input id="th" type="number" min="1" value="${c.tarefaHorasUteis}"></div>
 <label><input type="checkbox" id="ha" style="width:auto" ${c.hierarquiaAuto ? 'checked' : ''}> Preencher Supervisor, Coordenador, Gerente e Diretor vazios pela estrutura da empresa (a partir do departamento do Vendedor)</label>
    <label><input type="checkbox" id="ap" style="width:auto" ${c.atualizarProxima ? 'checked' : ''}> Gravar "Próxima Visita" do segmento na empresa</label>
    <div class="fld"><label>Motores: qual par de datas é o oficial?</label><select id="md"><option value="secao" ${c.motoresDatas === 'secao' ? 'selected' : ''}>Campos da seção (Próxima/Última Visita)</option><option value="extra" ${c.motoresDatas === 'extra' ? 'selected' : ''}>Campos extras (Data Próxima Visita / Última Visita)</option></select></div>
    <div class="fld"><label>Administradores (IDs de usuário, separados por vírgula)</label><input id="ad" value="${(c.admins || []).join(',')}"></div>
    <div class="err" id="er"></div><button class="btn pri" id="sv">Salvar configuração</button></div>
    <h2>Campos descobertos no Bitrix24</h2>${campos.erro ? `<div class="err on">${esc(campos.erro)}</div>` : `
      ${(() => { const f = campos.faltando.filter(x => !/usando/.test(x)), i = campos.faltando.filter(x => /usando/.test(x)); return (f.length ? `<div class="err on">Faltando: ${f.map(esc).join(' · ')}</div>` : '<div class="ok">Etapas e campos principais encontrados.</div>') + (i.length ? `<div class="info">Usando padrão do Bitrix (funciona, mas dá para criar o campo próprio): ${i.map(esc).join(' · ')}</div>` : ''); })()}
      ${campos.ambiguos.length ? `<div class="info">${campos.ambiguos.length} campo(s) existem em duplicidade no Bitrix. O app lê todos e usa o que tiver valor — nada a fazer.</div>` : ''}
      <details><summary>Ver mapeamento</summary><pre style="overflow:auto;font-size:12px">${esc(JSON.stringify(campos.map, null, 1))}</pre></details>`}
    <h2>Preparar o Bitrix</h2><div class="panel"><p class="hint">Cria o que falta: etapa <b>Atrasada</b> no kanban 1036, campos <b>Cargo</b> e <b>Data programada</b> na Fila e <b>Resultado</b>/<b>Acompanhamento</b> no Registro de Visita. Só cria o que ainda não existe.</p>
      <button class="btn pri" id="bp">Criar etapa e campos que faltam</button><pre id="pout" class="hint" style="white-space:pre-wrap"></pre></div>
    <h2>Testar com uma empresa</h2><div class="panel"><p class="hint">Gera a fila de <b>uma</b> empresa só (funciona mesmo com o app desativado). Use o número que aparece na URL da empresa no Bitrix (…/crm/company/details/<b>123</b>/).</p>
      <div style="display:flex;gap:8px"><input id="eid" type="number" inputmode="numeric" placeholder="ID da empresa" style="max-width:200px"><button class="btn pri" id="bt">Gerar fila desta empresa</button></div><pre id="tout" class="hint" style="white-space:pre-wrap"></pre></div>
    <h2>Ações</h2><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="b1">Sincronizar todas as empresas</button><button class="btn" id="b2">Rodar job diário agora</button></div><p class="hint" id="out"></p>`;
  $('#sv').onclick = async () => {
    const intervalos = {}; document.querySelectorAll('[data-i]').forEach(i => { const [g, k] = i.dataset.i.split('.'); (intervalos[g] ||= {})[k] = +i.value; });
    try {
      await api('/api/config', { method: 'PUT', body: { ativo: $('#at').checked, intervalos, horaJob: +$('#hj').value, tarefaAtiva: $('#ta').checked, tarefaHorasUteis: +$('#th').value, atualizarProxima: $('#ap').checked, hierarquiaAuto: $('#ha').checked, motoresDatas: $('#md').value, admins: $('#ad').value.split(',').map(s => +s.trim()).filter(Boolean) } });
      $('#out').textContent = 'Configuração salva.';
    } catch (e) { $('#er').textContent = e.message; $('#er').classList.add('on'); }
  };
  $('#bp').onclick = async () => {
    $('#pout').textContent = 'Criando…';
    try { const r = await api('/api/preparar', { method: 'POST', body: {} }); $('#pout').textContent = [...r.feito.map(x => '✔ ' + x), ...r.erros.map(x => '✖ ' + x), r.faltando.length ? 'Ainda falta: ' + r.faltando.join(' · ') : 'Tudo pronto.'].join('\n'); }
    catch (e) { $('#pout').textContent = e.message; }
  };
  $('#bt').onclick = async () => {
    const id = +$('#eid').value; if (!id) { $('#tout').textContent = 'Informe o ID da empresa.'; return; }
    $('#tout').textContent = 'Processando…';
    try { const r = await api('/api/sincronizar', { method: 'POST', body: { empresa: id } }); $('#tout').textContent = r.erro ? r.erro : `Cards criados: ${r.criados.length} · atualizados: ${r.atualizados.length}\n` + (r.pendencias.length ? 'Pendências:\n - ' + r.pendencias.join('\n - ') : 'Sem pendências.'); }
    catch (e) { $('#tout').textContent = e.message; }
  };
  $('#b1').onclick = async () => { if (!confirm('Isso processa TODAS as empresas e pode criar milhares de cards. Continuar?')) return; $('#out').textContent = 'Sincronizando…'; try { const r = await api('/api/sincronizar', { method: 'POST', body: {} }); $('#out').textContent = `${r.length} empresa(s) processada(s); ${r.reduce((a, x) => a + (x.criados?.length || 0), 0)} card(s) criado(s).`; } catch (e) { $('#out').textContent = e.message; } };
  $('#b2').onclick = async () => { $('#out').textContent = 'Rodando…'; try { $('#out').textContent = JSON.stringify(await api('/api/job', { method: 'POST', body: { forcar: true } })); } catch (e) { $('#out').textContent = e.message; } };
}
init();
</script>
</body>
</html>
