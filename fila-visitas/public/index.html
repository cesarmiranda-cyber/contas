<style>
:root{--bg:#eef2f4;--sf:#fff;--sf2:#f6f8fa;--ink:#1f2a37;--ink2:#525c69;--mut:#8b95a1;--line:#e2e7eb;--brand:#2066b0;--brand2:#17508f;--cy:#3bc8f5;--brandbg:#e6f1fb;

*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 "Open Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
.head{background:var(--sf);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.head .wrap{display:flex;align-items:center;gap:14px;padding-top:10px;padding-bottom:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px}
.logo{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,var(--cy),var(--brand));color:#fff;display:grid;place-items:center;font-size:17px}
.who{margin-left:auto}.who select{width:auto;max-width:56vw;padding:7px 10px}
nav{display:flex;gap:6px;width:100%;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}

main{padding:16px 0 40px}

select:focus,input:focus,textarea:focus{border-color:var(--cy);box-shadow:0 0 0 3px color-mix(in srgb,var(--cy) 28%,transparent)}
textarea{min-height:72px;resize:vertical}
.btn{border:1px solid var(--line);background:var(--sf);padding:8px 14px;border-radius:8px;font-weight:600;cursor:pointer;min-height:38px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--brand);color:var(--brand)}.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}.btn.pri:hover{background:var(--brand2);color:#fff}.btn:disabled{opacity:.55;cursor:wait}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;box-shadow:var(--sh);text-align:left;display:flex;align-items:center;gap:12px}
.stat i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:18px;flex:none}
.stat b{display:block;font-size:24px;line-height:1.05}.stat span{font-size:12px;color:var(--mut);font-weight:600}
.stat.red i{background:var(--redbg);color:var(--red)}.stat.amber i{background:var(--amberbg);color:var(--amber)}.stat.blue i{background:var(--brandbg);color:var(--brand)}.stat.on{outline:2px solid var(--cy)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:8px;margin-bottom:12px}.filters.f5{grid-template-columns:2fr 1.2fr 1fr 1fr 1fr}
h2{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin:18px 0 8px;display:flex;align-items:center;gap:8px}
h2 em{font-style:normal;background:var(--line);color:var(--ink2);border-radius:99px;padding:0 8px;font-size:12px}
.list{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden}
.item{display:grid;grid-template-columns:1fr 130px 190px;gap:16px;align-items:start;padding:14px 16px 14px 20px;border-bottom:1px solid var(--line);position:relative}
.item:last-child{border-bottom:0}.item:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--cy)}
.item:before{width:6px}.item.atrasada{background:color-mix(in srgb,var(--red) 9%,var(--sf))}.item.dia{background:color-mix(in srgb,#f5a623 16%,var(--sf))}
.item.atrasada:before{background:var(--red)}.item.dia:before{background:#f5a623}
.lin{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;background:#e8eef6;color:#1e3a5f}.lin-motores{background:#dbeafe;color:#1e40af}.lin-pecas{background:#dcfce7;color:#166534}.lin-servicos{background:#fef3c7;color:#92400e}.lin-novosnegocios{background:#f3e8ff;color:#6b21a8}tr[hidden]{display:none}tr.gh{cursor:pointer}tr.gh td{padding:10px 8px}tr.gh .chev{display:inline-block;width:22px;font-size:16px;color:var(--brand)}tr.gh{background:#fff;border-top:2px solid var(--line)}tr.gh.t-atrasada{background:#fdeeee}tr.gh.t-dia{background:#fdf1dd}tr.gh .gm{margin-left:12px;display:inline-flex;gap:6px;flex-wrap:wrap;align-items:center}tr.gc td:first-child{padding-left:30px}tr.rep td{border-top-color:transparent}tr.rep .hint{padding-left:6px}
.emp{font-weight:700;font-size:15px;line-height:1.25}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}.tag{font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--sf2);border:1px solid var(--line);color:var(--ink2)}.tag.seg{background:var(--brandbg);border-color:transparent;color:var(--brand)}
.due b{display:block;font-size:14px}.due span{display:inline-block;margin-top:2px;font-size:11.5px;font-weight:700;padding:1px 8px;border-radius:99px;background:var(--brandbg);color:var(--brand)}
.item.atrasada .due span{background:var(--red);color:#fff}.item.dia .due span{background:#f5a623;color:#2b1d00}.item.atrasada .due b{color:var(--red)}
.acts{display:flex;gap:8px;flex-wrap:wrap}.side{display:flex;flex-direction:column;gap:8px;align-items:stretch}.side .acts .btn{flex:1}
.emp a{color:inherit;text-decoration:none}.emp a:hover{color:var(--brand);text-decoration:underline}
.meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:8px;font-size:12.5px;color:var(--ink2)}.meta b{color:var(--ink)}
.pessoas{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px}.pp{display:flex;align-items:center;gap:7px;font-size:12.5px;line-height:1.15}.pp i{width:26px;height:26px;border-radius:50%;background:var(--sf2);border:1px solid var(--line);display:grid;place-items:center;font-style:normal;font-size:10.5px;font-weight:700;color:var(--ink2)}.pp.me i{background:var(--brand);border-color:var(--brand);color:#fff}.pp small{display:block;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em}
.links{display:flex;gap:12px;justify-content:center;font-size:12px}.links a{color:var(--brand);text-decoration:none}.links a:hover{text-decoration:underline}
.tag.warn{background:var(--amberbg);border-color:transparent;color:var(--amber)}.due small{display:block;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.05em}
.vazio{text-align:center;color:var(--mut);padding:48px 12px}
.modal{position:fixed;inset:0;background:rgba(10,20,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:50}.modal.on{display:flex}
.sheet{background:var(--sf);width:100%;max-width:760px;border-radius:16px 16px 0 0;max-height:94vh;display:flex;flex-direction:column}
@media(min-width:700px){.modal{align-items:center;padding:20px}.sheet{border-radius:14px}}
.sh-h{padding:16px 18px 12px;border-bottom:1px solid var(--line)}.sh-h h3{margin:0;font-size:18px}.sh-b{padding:6px 18px 8px;overflow:auto;flex:1}.sh-f{padding:12px 18px 16px;border-top:1px solid var(--line);display:flex;gap:8px}.sh-f .btn{flex:1;min-height:42px}
.sec{margin:16px 0 4px;padding:2px 0}.sec h4{margin:0 0 4px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--brand);padding-bottom:6px;border-bottom:1px solid var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}.grid2 .wide{grid-column:1/-1}
.radios,.checks{display:flex;flex-wrap:wrap;gap:8px}.radios label,.checks label{display:flex;align-items:center;gap:7px;margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink);font-size:13.5px;background:var(--sf)}.radios label:has(input:checked),.checks label:has(input:checked){border-color:var(--brand);background:var(--brandbg);color:var(--brand)}.radios input,.checks input{width:auto;margin:0}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.fld{margin:12px 0}.fld>label{display:block;font-size:12.5px;font-weight:700;color:var(--ink2);margin-bottom:5px}.fld>label i{color:var(--red);font-style:normal}
.fld.lock input,.fld.lock select{background:var(--sf2);color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.err{background:var(--redbg);color:var(--red);padding:10px 12px;border-radius:8px;margin:10px 0;font-weight:600;display:none}.err.on{display:block}
.ok{background:var(--greenbg);color:var(--green);padding:12px;border-radius:8px;margin:12px 0;font-weight:600}
.info{background:var(--brandbg);color:var(--brand);padding:10px 12px;border-radius:8px;margin:10px 0;font-size:13px}
.hint{font-size:12.5px;color:var(--mut)}.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--sf)}
table{width:100%;border-collapse:collapse;font-size:13.5px}th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--mut);font-size:12px;text-transform:uppercase;background:var(--sf2)}
.stats.s4{grid-template-columns:repeat(4,1fr)}.hf{grid-template-columns:1.3fr 1.1fr 1fr 1.4fr auto}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bar{display:grid;grid-template-columns:minmax(80px,1.2fr) 2fr 28px;gap:10px;align-items:center;width:100%;border:0;background:none;padding:5px 6px;border-radius:8px;cursor:pointer;text-align:left;font-size:13px}.bar:hover,.bar.on{background:var(--brandbg)}.bar .bl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar .bt{height:8px;background:var(--sf2);border-radius:99px;overflow:hidden}.bar .bt i{display:block;height:100%;background:var(--brand);border-radius:99px}.bar b{text-align:right}
@media(max-width:900px){.stats.s4{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}.hf{grid-template-columns:1fr 1fr}}
.panel{background:var(--sf);border:1px solid var(--line);border-radius:var(--r);padding:4px 16px 16px;box-shadow:var(--sh)}
@media(max-width:900px){.item{grid-template-columns:1fr 120px;gap:10px}.item .side{grid-column:1/-1}}
@media(max-width:700px){.filters,.filters.f5{grid-template-columns:1fr 1fr}.filters input{grid-column:1/-1}.item{grid-template-columns:1fr auto;gap:8px}.item .due{text-align:right}.item .side{grid-column:1/-1}.stat{padding:10px}.stat b{font-size:20px}.stat i{width:32px;height:32px}}

/* ---- Dashboard no estilo Power BI ---- */

.mini{border-radius:99px;border:1px solid #e2e8f0;background:#fff;padding:6px 14px;font-weight:600}.mini:hover{border-color:#6366f1;color:#4f46e5;background:#fff}

.pg-b{display:flex;gap:4px;flex-wrap:wrap}.pg-b button{min-width:36px;height:36px;border:1px solid var(--line);background:var(--sf);border-radius:8px;cursor:pointer;font-weight:600;color:var(--ink2);padding:0 10px}.pg-b button:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}.pg-b button.on{background:var(--brand);border-color:var(--brand);color:#fff}.pg-b button:disabled{opacity:.4;cursor:default}

<body>
<div class="head"><div class="wrap">
  <div class="brand"><div class="logo">◷</div>Registro de Visitas</div>
  <div class="who"><select id="quem" title="Quem é você"></select></div>
  <nav id="tabs"></nav>
</div></div>
<main><div class="wrap" id="main"></div></main>
<div class="modal" id="m"><div class="sheet" id="sheet"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = iso => iso ? iso.split('-').reverse().join('/') : '—';
let uid = null, eu = {}, aba = 'minhas', dados = null, users = [], foco = 'abertas';
const VD = { per: '', de: '', ate: '' };   // filtro de data: '' | hoje | semana | mes | custom
try { uid = +localStorage.getItem('fv.uid') || null; } catch {}
const F = { seg: '', ramo: '', tipo: '', classe: '', resp: '', vend: '' };

async function api(path, opt = {}) {
  const sep = path.includes('?') ? '&' : '?';
  const r = await fetch(path + (uid ? `${sep}uid=${uid}` : ''), { ...opt, headers: { 'Content-Type': 'application/json' }, body: opt.body ? JSON.stringify({ uid, ...opt.body }) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || `Erro ${r.status}`);
  return j;
}
async function init() {
  try { users = await api('/api/usuarios'); } catch (e) { $('#main').innerHTML = `<div class="vazio">${esc(e.message)}</div>`; return; }
  eu = await api('/api/eu');
  if (eu.verificado) uid = eu.uid;
  const q = $('#quem');
  q.innerHTML = `<option value="">Quem é você?</option>` + users.map(u => `<option value="${u.id}">${esc(u.nome)}</option>`).join('');
  q.value = uid || '';
  if (eu.verificado) q.style.display = 'none';
  q.onchange = async () => { uid = +q.value || null; try { localStorage.setItem('fv.uid', uid || ''); } catch {} eu = await api('/api/eu'); montaAbas(); carrega(); };
  montaAbas(); carrega();
}
function montaAbas() {
  const abas = [['minhas', 'Registro de Visitas'], ['hist', 'Visita Alterada']];
  if (eu.podeDashboard !== false) abas.push(['dash', 'Dashboard']);
  if (eu.podeConfig !== false) abas.push(['cfg', 'Configurações']);
  if (!abas.some(x => x[0] === aba)) aba = 'minhas';
  $('#tabs').innerHTML = abas.map(([k, t]) => `<button class="${aba === k ? 'on' : ''}" data-k="${k}">${t}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => { aba = b.dataset.k; foco = 'abertas'; montaAbas(); carrega(); });
}
async function carrega() {
  document.body.classList.add('wide');
  const m = $('#main');
  if (!uid && aba !== 'cfg') { m.innerHTML = '<div class="vazio">Escolha o seu nome no topo para ver as suas visitas.</div>'; return; }
  m.innerHTML = '<div class="vazio">Carregando…</div>';
  try {
    if (aba === 'minhas') await carregaVisitas();
    else if (aba === 'hist') { const h = await api('/api/historico'); try { const r = await api('/api/visitas?escopo=auto&page=1&size=1&status=abertas&soIds=1'); dados = { hoje: null, visitas: r.ids.map(id => ({ id, parcial: true })) }; } catch { dados = { visitas: [] }; } hist(h); }
    else if (aba === 'dash') await dashboard();
    else cfg(await api('/api/config'));
  } catch (e) { m.innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
}

const VP = (() => { try { return { view: 'cards', ord: 'data', dir: 1, ...JSON.parse(localStorage.getItem('fv.vp') || '{}') }; } catch { return { view: 'cards', ord: 'data', dir: 1 }; } })();
const salvaVP = () => { try { localStorage.setItem('fv.vp', JSON.stringify({ view: VP.view, ord: VP.ord, dir: VP.dir })); } catch {} };
try { Object.assign(F, JSON.parse(localStorage.getItem('fv.f') || '{}')); } catch {}
const salvaF = () => { try { localStorage.setItem('fv.f', JSON.stringify({ seg: F.seg, tipo: F.tipo, classe: F.classe })); } catch {} };
const VQ = { page: 1, size: (() => { try { return +localStorage.getItem('fv.size') || 20; } catch { return 20; } })() };
const consultaVisitas = (extra = {}) => new URLSearchParams(Object.entries({ escopo: 'auto', page: VQ.page, size: VQ.size, q: F.q || '', status: foco, per: VD.per, de: VD.de, ate: VD.ate, seg: F.seg, ramo: F.ramo, tipo: F.tipo, classe: F.classe, resp: F.resp, vend: F.vend, ord: VP.ord, dir: VP.dir, ...extra }).filter(([, v]) => v !== '' && v != null)).toString();
let reqVisitas = 0;
async function carregaVisitas() {
  const n = ++reqVisitas;
  $('#main').classList.add('carregando');
  try { const r = await api('/api/visitas?' + consultaVisitas()); if (n !== reqVisitas) return; dados = r; VQ.page = r.pagina; lista(); }
  catch (e) { $('#main').innerHTML = `<div class="vazio">${esc(e.message)}</div>`; }
  finally { $('#main').classList.remove('carregando'); }
}
const refaz = (resetaPagina = true) => { if (resetaPagina) VQ.page = 1; return carregaVisitas(); };
let tDebounce = null;
function lista() {
  const v = dados.visitas, c = dados.counts, op = dados.opcoes, verEquipe = dados.visao !== 'minhas';
  const opt = (arr, cur) => arr.map(([a, b]) => `<option value="${esc(a)}" ${String(cur) === String(a) ? 'selected' : ''}>${esc(b)}</option>`).join('');
  const grupos = [['atrasada', 'Atrasadas'], ['dia', 'Hoje'], ['aguardando', 'Em aberto · próximas'], ['finalizado', 'Encerradas'], ['naorealizada', 'Não realizadas']];
  const corpo = !v.length ? '<div class="vazio">Nenhuma visita neste filtro.</div>' : VP.view === 'tabela' ? tabelaVisitas(v, verEquipe) : grupos.map(([k, t]) => {
    const g = v.filter(x => x.situacao === k);
    return g.length ? `<h2>${t} <em>${g.length}</em></h2><div class="list cards">${g.map(linha).join('')}</div>` : '';
  }).join('');
  const de = (dados.pagina - 1) * dados.tamanho + 1, ate = Math.min(dados.total, dados.pagina * dados.tamanho);
  const janela = (() => { const a = Math.max(1, dados.pagina - 2), b = Math.min(dados.paginas, a + 4); return Array.from({ length: b - a + 1 }, (_, i) => a + i); })();
  const filtrado = F.seg || F.ramo || F.tipo || F.classe || F.resp || F.vend || foco !== 'abertas' || VD.per || F.q;
  $('#main').innerHTML = `
    <div class="stats s5">
      <button class="stat ${foco === 'abertas' ? 'on' : ''}" data-f="abertas"><i>◷</i><div><b>${c.abertas}</b><span>Em aberto</span></div></button>
      <button class="stat red ${foco === 'atrasada' ? 'on' : ''}" data-f="atrasada"><i>!</i><div><b>${c.atrasada}</b><span>Atrasadas</span></div></button>
      <button class="stat amber ${foco === 'dia' ? 'on' : ''}" data-f="dia"><i>★</i><div><b>${c.dia}</b><span>Hoje</span></div></button>
      <button class="stat green ${foco === 'finalizado' ? 'on' : ''}" data-f="finalizado"><i>✓</i><div><b>${c.finalizado}</b><span>Encerradas</span></div></button>
      <button class="stat gray ${foco === 'naorealizada' ? 'on' : ''}" data-f="naorealizada"><i>✕</i><div><b>${c.naorealizada}</b><span>Não realizadas</span></div></button>
    </div>
    ${verEquipe ? `<div class="info">${dados.visao === 'tudo' ? 'Você está vendo as visitas de <b>todos</b>.' : 'Você está vendo as visitas da <b>sua equipe</b>.'}${dados.bitrix ? ' Aplicadas também as suas permissões do Bitrix24.' : ''}</div>` : ''}
    <div class="filters">
      <input id="fq" type="search" placeholder="Buscar empresa…" value="${esc(F.q || '')}">
      <select id="fst" title="Status">${opt([['abertas', 'Status: Em aberto'], ['atrasada', 'Status: Atrasadas'], ['dia', 'Status: Hoje'], ['finalizado', 'Status: Encerradas'], ['naorealizada', 'Status: Não realizadas'], ['todas', 'Status: Todas']], foco)}</select>
      <select id="fdt" title="Data programada">${opt([['', 'Data: qualquer'], ['hoje', 'Data: hoje'], ['semana', 'Data: esta semana'], ['mes', 'Data: este mês'], ['custom', 'Data: personalizado']], VD.per)}</select>
      ${VD.per === 'custom' ? `<input id="fde" type="date" value="${VD.de}" title="De"><input id="fate" type="date" value="${VD.ate}" title="Até">` : ''}
      ${verEquipe ? `<select id="fr"><option value="">Todos os responsáveis</option>${opt(op.responsaveis.map(x => [x.id, x.nome]), F.resp)}</select>` : ''}
      <select id="fv"><option value="">Todos os vendedores</option>${opt(op.vendedores.map(x => [x.id, x.nome]), F.vend)}</select>
      <select id="fra" title="Segmento do cadastro da empresa"><option value="">Segmento da empresa: todos</option>${opt(op.ramos.map(x => [x.id, x.nome]), F.ramo)}</select>
      <select id="fs" title="Linha de negócio"><option value="">Todas as linhas (Motores, Peças…)</option>${opt(op.segmentos.map(s => [s, s]), F.seg)}</select>
      <select id="ft"><option value="">Industrial e marítimo</option>${opt([['industrial', 'Industrial'], ['marítimo', 'Marítimo']], F.tipo)}</select>
      <select id="fc"><option value="">Todas as classes</option>${opt([['A', 'Classe A'], ['B', 'Classe B'], ['C', 'Classe C']], F.classe)}</select>
    </div>
    <div class="bar2"><span class="hint">${dados.total ? `${de}–${ate} de ${dados.total}` : '0'} visita(s)${filtrado ? ' · <a href="#" id="flimpa">limpar filtros</a>' : ''}</span>
      <div class="bar2r"><label class="sl2">Ordenar<select id="fo">${opt([['data', 'Situação e data'], ['prazo', 'Data programada'], ['empresa', 'Empresa'], ['segmento', 'Segmento'], ['cargo', 'Cargo'], ['classe', 'Classe'], ...(verEquipe ? [['responsavel', 'Responsável']] : [])], VP.ord)}</select></label>
        <div class="seg2"><button data-vw="cards" class="${VP.view === 'cards' ? 'on' : ''}" title="Cartões">▦ Cartões</button><button data-vw="tabela" class="${VP.view === 'tabela' ? 'on' : ''}" title="Tabela">☰ Tabela</button></div>
        <button class="btn sm" id="vcsv">Exportar CSV</button></div></div>
    ${corpo}
    ${dados.total > 0 ? `<div class="pager"><div class="pg-i">Itens por página <select id="psz">${opt([[10, '10'], [20, '20'], [50, '50'], [100, '100']], VQ.size)}</select></div>
      <div class="pg-b"><button data-p="1" ${dados.pagina <= 1 ? 'disabled' : ''} title="Primeira">«</button><button data-p="${dados.pagina - 1}" ${dados.pagina <= 1 ? 'disabled' : ''}>‹ Anterior</button>
      ${janela.map(n => `<button data-p="${n}" class="${n === dados.pagina ? 'on' : ''}">${n}</button>`).join('')}
      <button data-p="${dados.pagina + 1}" ${dados.pagina >= dados.paginas ? 'disabled' : ''}>Próxima ›</button><button data-p="${dados.paginas}" ${dados.pagina >= dados.paginas ? 'disabled' : ''} title="Última">»</button></div></div>` : ''}`;
  document.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { foco = foco === b.dataset.f ? 'abertas' : b.dataset.f; refaz(); });
  const q = $('#fq'); q.oninput = () => { F.q = q.value; clearTimeout(tDebounce); tDebounce = setTimeout(async () => { const p = q.selectionStart; await refaz(); const n = $('#fq'); if (n) { n.focus(); n.setSelectionRange(p, p); } }, 350); };
  $('#fst').onchange = e => { foco = e.target.value; refaz(); };
  $('#fdt').onchange = e => { VD.per = e.target.value; if (VD.per === 'custom' && !VD.de) { VD.de = dados.hoje; VD.ate = dados.hoje; } refaz(); };
  if ($('#fde')) $('#fde').onchange = e => { VD.de = e.target.value; refaz(); };
  if ($('#fate')) $('#fate').onchange = e => { VD.ate = e.target.value; refaz(); };
  if ($('#fr')) $('#fr').onchange = e => { F.resp = e.target.value; refaz(); };
  $('#fv').onchange = e => { F.vend = e.target.value; refaz(); };
  $('#fra').onchange = e => { F.ramo = e.target.value; refaz(); };
  $('#fs').onchange = e => { F.seg = e.target.value; salvaF(); refaz(); };
  $('#ft').onchange = e => { F.tipo = e.target.value; salvaF(); refaz(); };

const mesDe = iso => new Date(iso).toLocaleDateString('en-CA', { timeZone: 'America/Sao_Paulo' }).slice(0, 7);
const mesNome = m => { const [y, n] = m.split('-'); return ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'][+n - 1] + ' de ' + y; };
const HF = { mes: null, quem: '', seg: '', motivo: '' };
function hist(d) {
  const todos = d.reprogramacoes.filter(x => !x.tipo);
  const meses = [...new Set(todos.map(x => mesDe(x.at)))].sort().reverse();
  if (HF.mes === null) HF.mes = meses.includes(mesDe(new Date().toISOString())) ? mesDe(new Date().toISOString()) : (meses[0] || '');
  const h = todos.filter(x => (!HF.mes || mesDe(x.at) === HF.mes) && (!HF.quem || x.autorNome === HF.quem) && (!HF.seg || x.segmento === HF.seg) && (!HF.motivo || x.motivo.toLowerCase().includes(HF.motivo.toLowerCase())));
  const conta = (k) => { const o = {}; h.forEach(x => { o[x[k]] = (o[x[k]] || 0) + 1; }); return Object.entries(o).sort((a, b) => b[1] - a[1]); };
  const porAutor = conta('autorNome'), porMotivo = conta('motivo'), porSeg = conta('segmento');
  const dias = x => Math.round((new Date(x.nova) - new Date(x.anterior)) / 864e5);
  const media = h.length ? Math.round(h.reduce((a, x) => a + dias(x), 0) / h.length) : 0;
  const quems = [...new Set(todos.map(x => x.autorNome))].sort(), segs = [...new Set(todos.map(x => x.segmento))].filter(Boolean).sort();
  const barras = (lista, chave) => { const max = lista[0]?.[1] || 1; return lista.slice(0, 8).map(([k, v]) => `<button class="bar ${HF[chave] === k ? 'on' : ''}" data-hf="${chave}" data-v="${esc(k)}"><span class="bl">${esc(k)}</span><span class="bt"><i style="width:${Math.max(6, v / max * 100)}%"></i></span><b>${v}</b></button>`).join('') || '<div class="hint">Sem dados no período.</div>'; };
  const opt = (arr, cur) => arr.map(x => `<option value="${esc(x)}" ${cur === x ? 'selected' : ''}>${esc(x)}</option>`).join('');
  const abre = x => (dados && dados.visitas || []).some(v => v.id === x.card);
  const link = (x) => d.base ? `<div class="links" style="justify-content:flex-start;margin-top:4px">${x.empresaId ? `<a href="${d.base}/crm/company/details/${x.empresaId}/" target="_top">Abrir empresa</a>` : ''}<a href="${d.base}/crm/type/1036/details/${x.card}/" target="_top">Abrir card</a></div>` : '';
  $('#main').innerHTML = `

      <button class="btn" id="hc">Exportar CSV</button></div>
    <div class="stats s4">

      <div class="stat amber"><i>☺</i><div><b>${porAutor.length}</b><span>Vendedores</span></div></div>
      <div class="stat red"><i>⇥</i><div><b>${media > 0 ? '+' : ''}${media} dias</b><span>Adiamento médio</span></div></div>
      <div class="stat blue"><i>?</i><div><b style="font-size:15px;line-height:1.2">${esc(porMotivo[0]?.[0] || '—')}</b><span>Motivo mais comum</span></div></div></div>
    <div class="two"><div class="panel"><h2>Por vendedor</h2>${barras(porAutor, 'quem')}</div><div class="panel"><h2>Por motivo</h2>${barras(porMotivo, 'motivo')}</div></div>
    ${porSeg.length > 1 ? `<div class="panel" style="margin-top:12px"><h2>Por segmento</h2>${barras(porSeg, 'seg')}</div>` : ''}
    <h2>Histórico <em>${h.length}</em></h2>
    <div class="tw"><table><tr><th>Quando</th><th>Empresa</th><th>De → Para</th><th>Motivo</th><th>Quem</th><th>Ações</th></tr>${h.map(x => `<tr><td>${new Date(x.at).toLocaleString('pt-BR')}</td><td><b>${esc(x.empresa)}</b><div class="hint">${esc(x.segmento)} · ${esc(x.cargo)}</div>${link(x)}</td><td>${fmt(x.anterior)} → <b>${fmt(x.nova)}</b><div class="hint">${dias(x) > 0 ? '+' : ''}${dias(x)} dia(s)</div></td><td>${esc(x.motivo)}</td><td>${esc(x.autorNome)}</td><td style="white-space:nowrap">${abre(x) ? `<button class="btn sm pri" data-reg="${x.card}">Registrar visita</button> <button class="btn sm" data-rep="${x.card}">Alterar visita</button>` : '<span class="hint">Visita já realizada</span>'}</td></tr>`).join('') || '<tr><td colspan=6 class="hint">Nenhuma alteração neste filtro.</td></tr>'}</table></div>`;

  document.querySelectorAll('[data-rep]').forEach(b => b.onclick = async () => { const id = +b.dataset.rep; const r = await api(`/api/visitas?escopo=auto&page=1&size=1&status=abertas&cardId=${id}`); dados = { hoje: r.hoje, visitas: r.visitas }; reagendarVisita(id); });

  $('#hq').onchange = e => { HF.quem = e.target.value; hist(d); };

  const hx = $('#hx'); hx.oninput = () => { HF.motivo = hx.value; const p = hx.selectionStart; hist(d); const n = $('#hx'); n.focus(); n.setSelectionRange(p, p); };

  };
}

  return `<div class="g5">${kpi('Visitas em aberto', nf(ab.length), 'fila total (clique para ver todas)', '#6366f1', ['situacao'], ['__todas'], null, '◷')}${kpi('Atrasadas', nf(atr.length), `${pct(atr.length, ab.length)}% da fila`, COR.atrasada, ['situacao'], ['atrasada'], null, '!')}${kpi('Visitas hoje', nf(hoje.length), '', '#d97706', ['situacao'], ['dia'], null, '★')}${kpi('Próximos 7 dias', nf(p7), `${nf(prox.length)} no prazo no total`, COR.aguardando, ['situacao'], ['aguardando'], null, '→')}${kpi('Não realizadas', nf(F.cards.filter(c => c.situacao === 'naorealizada').length), 'perdidas por não registrar no mês', '#64748b', ['situacao'], ['naorealizada'], null, '✕')}${kpi('Atraso médio', mediaAtr ? mediaAtr + ' dias' : '—', atr.length ? `maior: ${Math.max(...atr.map(c => -c.dias))} dias` : 'nenhuma atrasada', mediaAtr ? COR.atrasada : '#64748b', null, null, null, '⏱')}</div>
   <div class="g3">${vz('Situação da fila', rosca([{ nome: 'Atrasadas', valor: aoutros(['situacao']).filter(c => c.situacao === 'atrasada').length, cor: COR.atrasada, val: 'atrasada' }, { nome: 'Hoje', valor: aoutros(['situacao']).filter(c => c.situacao === 'dia').length, cor: COR.dia, val: 'dia' }, { nome: 'No prazo', valor: aoutros(['situacao']).filter(c => c.situacao === 'aguardando').length, cor: COR.aguardando, val: 'aguardando' }], 'situacao'))}
     ${vz('Fila por segmento', hstack(linhas('seg', segs, c => c.segmento), ser, 'seg'))}
     ${vz('Fila por cargo', hstack(linhas('cargo', ['Vendedor', 'Supervisor', 'Coordenador', 'Gerente', 'Diretor'], c => c.cargo), ser, 'cargo'))}</div>
   <div class="g3">${vz('Vencimentos nas próximas 8 semanas', colunas(rotS, rotS.map((_, i) => i), [{ nome: 'Visitas', cor: PBI[0], valores: vencem }], 'semana'), 's2')}
     ${vz('Tempo de atraso', hbar(AGING.map(([r, a, b], i) => [r, agBase.filter(c => -c.dias >= a && -c.dias <= b).length, COR.atrasada, i]), { keys: ['aging'] }))}</div>
   <div class="g3">${vz('Mapa de atrasos: segmento × cargo', matriz(aoutros(['seg', 'cargo']), segs, ['Vendedor', 'Supervisor', 'Coordenador', 'Gerente', 'Diretor']), 's2')}
     ${vz('Atrasadas por responsável', hbar(respAtr, { keys: ['resp'] }))}</div>
   <div class="g3">${vz('Fila por classe', hbar(['A', 'B', 'C'].map((k, i) => [`Classe ${k}`, cl.filter(c => c.classe === k).length, PBI[i], k]), { keys: ['classe'] }))}
     ${vz('Fila por tipo de empresa', rosca(contar(aoutros(['tipo']), c => c.tipo).map(([k, n], i) => ({ nome: k, valor: n, cor: PBI[i % PBI.length] }))))}
     ${vz('Fila por responsável (todas)', hbar(contar(aoutros(['resp']), c => c.respNome).slice(0, 8).map(([n, v]) => [n, v, PBI[1], String((DB.dados.cards.find(c => c.respNome === n) || {}).resp)]), { keys: ['resp'] }))}</div>
   ${detalhe(dets, [
    { h: 'Empresa', txt: r => r.empresa, html: r => lk(urlE(r.empresaId), r.empresa) }, { h: 'Segmento da empresa', txt: r => r.ramo || '' }, { h: 'Linha', txt: r => r.segmento }, { h: 'Cargo', txt: r => r.cargo }, { h: 'Classe', txt: r => r.classe },
    { h: 'Responsável', txt: r => r.respNome }, { h: 'Programada', txt: r => (r.data || '').split('-').reverse().join('/'), ord: r => r.data || '' },
    { h: 'Situação', txt: r => SIT[r.situacao], html: r => pill(r.situacao), ord: r => SO[r.situacao] },
    { h: 'Prazo', txt: r => r.situacao === 'finalizado' || r.situacao === 'naorealizada' ? '' : r.dias < 0 ? `${-r.dias} dia(s) de atraso` : r.dias === 0 ? 'Hoje' : `em ${r.dias} dia(s)`, ord: r => r.dias ?? 9e9 },
    { h: 'Card', txt: () => 'Abrir', html: r => lk(urlC(r.id), 'Abrir card') },
    { h: 'Ações', txt: () => '', html: r => r.situacao === 'naorealizada' ? '<span class="hint">Não realizada</span>' : r.situacao === 'finalizado' ? '<span class="hint">Realizada</span>' : `<button class="mini" data-reg="${r.id}">Registrar visita</button> <button class="mini" data-rep="${r.id}">Alterar visita</button>` }], 'fila-de-visitas')}`;
}
function paginaReg() {
  const F = dashFiltra(), v = F.visitas;
  const ant = v.filter(x => x.antecipada).length, cd = v.filter(x => x.desvio !== null), np = cd.filter(x => x.desvio <= 0).length, atr = cd.filter(x => x.desvio > 0);
  const media = atr.length ? Math.round(atr.reduce((a, x) => a + x.desvio, 0) / atr.length) : 0;
  const mesAtual = DB.dados.hoje.slice(0, 7), mesAnt = (() => { const [y, m] = mesAtual.split('-').map(Number); const d = new Date(y, m - 2, 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; })();
  const nA = v.filter(x => x.dia.slice(0, 7) === mesAtual).length, nP = v.filter(x => x.dia.slice(0, 7) === mesAnt).length;
  const vendedores = new Set(v.map(x => x.resp)).size;
  const nReal = DB.dados.cards.filter(c => c.situacao === 'naorealizada').length;
  const vo = ex => dashFiltra(ex).visitas;
  const mm = F.meses, cx = mm.map(m => vo(['mes']).filter(x => x.dia.slice(0, 7) === m));
  const segs = contar(vo(['seg']), x => x.segmento).map(([k, n], i) => [k, n, PBI[i % PBI.length]]);
  const porVend = contar(vo(['resp']), x => x.respNome).slice(0, 10).map(([n, k]) => [n, k, PBI[0], String((DB.dados.visitas.find(x => x.respNome === n) || {}).resp)]);
  const antBase = vo(['ant']);
  const det = [...v].sort((a, b) => b.quando.localeCompare(a.quando));
  return `<div class="g5">${kpi('Visitas registradas', nf(v.length), `últimos ${DB.f.meses} meses`, '#6366f1', null, null, null, '✓')}${kpi('Visitas no mês', nf(nA), `mês anterior: ${nf(nP)}`, PBI[0], ['mes'], [mesAtual], nP ? Math.round((nA - nP) / nP * 100) : null, '▤')}${kpi('Visitas antecipadas', nf(ant), `${pct(ant, v.length)}% do total`, PBI[0], ['ant'], ['true'], null, '⚑')}${kpi('Visitas não realizadas', nf(nReal), 'perdidas por não registrar no mês', '#64748b', null, null, null, '✕')}${kpi('Cumprimento no prazo', cd.length ? pct(np, cd.length) + '%' : '—', 'realizadas até a data programada', PBI[0], ['prazo'], ['no'], null, '◎')}${kpi('Atraso médio', atr.length ? media + ' dias' : '—', `${nf(atr.length)} fora do prazo · ${nf(vendedores)} vendedor(es)`, atr.length ? COR.atrasada : '#64748b', ['prazo'], ['fora'], null, '⏱')}</div>
   <div class="g2w">${vz('Visitas por mês', colunas(mm.map(mesCurto), mm, [{ nome: 'No prazo / antecipadas', cor: PBI[0], valores: cx.map(a => a.filter(x => x.desvio === null || x.desvio <= 0).length) }, { nome: 'Fora do prazo', cor: COR.atrasada, valores: cx.map(a => a.filter(x => x.desvio > 0).length) }], 'mes'))}
     ${vz('Antecipada x programada', rosca([{ nome: 'Antecipadas', valor: antBase.filter(x => x.antecipada).length, cor: PBI[0], val: 'true' }, { nome: 'Na data / depois', valor: antBase.filter(x => !x.antecipada).length, cor: PBI[1], val: 'false' }], 'ant'))}</div>
   <div class="g3">${vz('Visitas por segmento', hbar(segs, { keys: ['seg'] }))}${vz('Visitas por vendedor', hbar(porVend, { keys: ['resp'] }))}${vz('Visitas por cargo', rosca(contar(vo(['cargo']), x => x.cargo).map(([k, n], i) => ({ nome: k, valor: n, cor: PBI[i % PBI.length] })), 'cargo'))}</div>
   ${detalhe(det, [
    { h: 'Quando', txt: r => new Date(r.quando).toLocaleString('pt-BR'), ord: r => r.quando }, { h: 'Empresa', txt: r => r.empresa || '—', html: r => lk(urlE(r.empresaId), r.empresa || '—') }, { h: 'Vendedor', txt: r => r.respNome },
    { h: 'Segmento', txt: r => r.segmento }, { h: 'Cargo', txt: r => r.cargo || '—' }, { h: 'Programada', txt: r => (r.programada || '').split('-').reverse().join('/'), ord: r => r.programada || '' },
    { h: 'Prazo', txt: r => r.desvio === null ? '—' : r.desvio < 0 ? `${-r.desvio} dia(s) antes` : r.desvio === 0 ? 'No dia' : `${r.desvio} dia(s) depois`, ord: r => r.desvio ?? 0, html: r => r.desvio === null ? '—' : r.desvio < 0 ? `<b style="color:#059669">${-r.desvio} d antes</b>` : r.desvio === 0 ? 'No dia' : `<b style="color:${COR.atrasada}">${r.desvio} d depois</b>` }], 'registro-de-visitas')}`;
}
function paginaRep() {
  const F = dashFiltra(), r = F.reprog, mediaD = r.length ? Math.round(r.reduce((a, x) => a + x.dias, 0) / r.length) : 0;
  const ro = ex => dashFiltra(ex).reprog, mm = F.meses;
  const det = [...r].sort((a, b) => b.at.localeCompare(a.at));
  return `<div class="g4">${kpi('Visitas alteradas', nf(r.length), `últimos ${DB.f.meses} meses`, '#0f172a')}${kpi('Vendedores que alteraramam', nf(new Set(r.map(x => x.quem)).size), '', PBI[0])}${kpi('Adiamento médio', (mediaD > 0 ? '+' : '') + mediaD + ' dias', '', COR.atrasada)}${kpi('Motivo mais comum', esc(contar(r, x => x.motivo)[0]?.[0] || '—'), '', PBI[3])}</div>
   <div class="g2w">${vz('Visitas alteradas por mês', colunas(mm.map(mesCurto), mm, [{ nome: 'Visitas alteradas', cor: PBI[3], valores: mm.map(m => ro(['mes']).filter(x => x.at.slice(0, 7) === m).length) }], 'mes'))}${vz('Por segmento', rosca(contar(ro(['seg']), x => x.segmento).map(([k, n], i) => ({ nome: k, valor: n, cor: PBI[i % PBI.length] })), 'seg'))}</div>
   <div class="g2">${vz('Por motivo', hbar(contar(ro(['motivo']), x => x.motivo).slice(0, 8), { cor: PBI[3], keys: ['motivo'] }))}${vz('Por vendedor', hbar(contar(ro(['quem']), x => x.quem).slice(0, 8), { cor: PBI[1], keys: ['quem'] }))}</div>
   ${detalhe(det, [{ h: 'Quando', txt: x => new Date(x.at).toLocaleString('pt-BR'), ord: x => x.at }, { h: 'Empresa', txt: x => x.empresa || '—', html: x => lk(urlE(x.empresaId), x.empresa || '—') }, { h: 'Segmento', txt: x => x.segmento }, { h: 'Cargo', txt: x => x.cargo },
    { h: 'Adiado', txt: x => `${x.dias > 0 ? '+' : ''}${x.dias} dia(s)`, ord: x => x.dias }, { h: 'Motivo', txt: x => x.motivo }, { h: 'Quem', txt: x => x.quem }, { h: 'Card', txt: () => 'Abrir', html: x => lk(urlC(x.card), 'Abrir card') }], 'reprogramacoes')}`;
}
function dashDesenha() {
  const d = DB.dados, f = DB.f;
  if (DB.sel.situacao === '__todas') delete DB.sel.situacao;
  const sel = (id, rot, opcoes, cur) => `<label class="sl"><span>${rot}</span><select id="${id}">${opcoes.map(([v, t]) => `<option value="${esc(v)}" ${String(cur) === String(v) ? 'selected' : ''}>${esc(t)}</option>`).join('')}</select></label>`;
  const segs = [...new Set(d.cards.map(c => c.segmento))].filter(Boolean).sort();
  const resps = [...new Map([...d.cards.map(c => [String(c.resp), c.respNome]), ...d.visitas.map(v => [String(v.resp), v.respNome])]).entries()].sort((a, b) => a[1].localeCompare(b[1]));
  const temTipo = d.cards.some(c => c.tipo);
  const vends = [...new Set([...d.cards.map(c => c.vendedor), ...d.visitas.map(v => v.vendedor), ...d.reprog.map(r => r.vendedor)].filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const ramos = [...new Set([...d.cards.map(c => c.ramo), ...d.visitas.map(v => v.ramo), ...d.reprog.map(r => r.ramo)].filter(Boolean))].sort((a, b) => a.localeCompare(b));
  const empresas = [...new Set([...d.cards.map(c => c.empresa), ...d.visitas.map(v => v.empresa)].filter(Boolean))].sort((a, b) => a.localeCompare(b)).slice(0, 800);
  const pagina = { fila: paginaFila, reg: paginaReg, rep: paginaRep }[DB.pag]();
  const chips = Object.entries(DB.sel).map(([k, v]) => `<span class="chip" data-rm="${k}">${esc(SELNOME[k] || k)}: <b>${esc(selTxt(k, v))}</b> ✕</span>`).join('');
  document.body.classList.add('wide');
  const scrollY = window.scrollY;
  $('#main').innerHTML = `<div class="pbi">
    <div class="pbi-top"><div class="pbi-t"><b>Indicadores de visitas</b><span>${d.visao === 'tudo' ? 'Todos os responsáveis' : 'Sua equipe'} · atualizado ${new Date(d.geradoEm).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} · <a href="#" id="s_r2">atualizar</a></span></div>
      <div class="pbi-s">${sel('s_m', 'Período', [[3, 'Últimos 3 meses'], [6, 'Últimos 6 meses'], [12, 'Últimos 12 meses']], f.meses)}<label class="sl"><span>Empresa</span><input id="s_e" list="dl_emp" placeholder="Buscar empresa…" value="${esc(f.emp)}"><datalist id="dl_emp">${empresas.map(x => `<option value="${esc(x)}">`).join('')}</datalist></label>${sel('s_v', 'Vendedor', [['', 'Todos'], ...vends.map(x => [x, x])], f.vend)}${sel('s_ra', 'Segmento da empresa', [['', 'Todos'], ...ramos.map(x => [x, x])], f.ramo)}${sel('s_s', 'Linha', [['', 'Todas'], ...segs.map(x => [x, x])], f.seg)}${resps.length > 1 ? sel('s_r', 'Responsável', [['', 'Todos'], ...resps], f.resp) : ''}${temTipo ? sel('s_t', 'Tipo', [['', 'Todos'], ['industrial', 'Industrial'], ['marítimo', 'Marítimo']], f.tipo) : ''}${sel('s_c', 'Classe', [['', 'Todas'], ['A', 'A'], ['B', 'B'], ['C', 'C']], f.classe)}<button class="sl-x" id="s_x">Limpar tudo</button></div></div>
    <div class="pbi-pg">${[['fila', 'Fila de visitas'], ['reg', 'Registro de visitas'], ['rep', 'Visitas alteradas']].map(([k, t]) => `<button class="${DB.pag === k ? 'on' : ''}" data-pg="${k}">${t}</button>`).join('')}</div>
    ${chips ? `<div class="chips-bar"><span>Filtros aplicados:</span>${chips}</div>` : '<div class="chips-bar dica">Dica: clique em qualquer barra, fatia, coluna ou indicador para filtrar a página e ver os registros abaixo.</div>'}
    <div class="pbi-cv">${pagina}</div>
</div>`;
  const lig = (id, k, num) => { const e = $('#' + id); if (e) e.onchange = () => { f[k] = num ? +e.value : e.value; DB.tab.pg = 0; dashDesenha(); }; };
  lig('s_m', 'meses', true); lig('s_v', 'vend'); lig('s_ra', 'ramo'); lig('s_s', 'seg'); lig('s_r', 'resp'); lig('s_t', 'tipo'); lig('s_c', 'classe');
  const se = $('#s_e'); if (se) se.oninput = () => { f.emp = se.value; DB.tab.pg = 0; const p = se.selectionStart; dashDesenha(); const n = $('#s_e'); n.focus(); n.setSelectionRange(p, p); };
  $('#s_x').onclick = () => { Object.assign(f, { meses: 6, seg: '', ramo: '', resp: '', tipo: '', classe: '', emp: '', vend: '' }); DB.sel = {}; DB.tab = { col: null, dir: 1, q: '', pg: 0 }; dashDesenha(); };
  $('#s_r2').onclick = async e => { e.preventDefault(); await dashboard(); };
  document.querySelectorAll('[data-pg]').forEach(b => b.onclick = () => { DB.pag = b.dataset.pg; DB.sel = {}; DB.tab = { col: null, dir: 1, q: '', pg: 0 }; dashDesenha(); });
  document.querySelectorAll('[data-rm]').forEach(c => c.onclick = () => { delete DB.sel[c.dataset.rm]; DB.tab.pg = 0; dashDesenha(); });
  document.querySelectorAll('.pbi [data-sel]').forEach(el => el.addEventListener('click', e => { e.stopPropagation(); clicou(el); }));
  document.querySelectorAll('.srt').forEach(th => th.onclick = () => { const i = +th.dataset.col; DB.tab.dir = DB.tab.col === i ? -DB.tab.dir : 1; DB.tab.col = i; dashDesenha(); });
  const dq = $('#dq'); if (dq) dq.oninput = () => { DB.tab.q = dq.value; DB.tab.pg = 0; const p = dq.selectionStart; dashDesenha(); const n = $('#dq'); n.focus(); n.setSelectionRange(p, p); };
  const dx = $('#dx'); if (dx) dx.onclick = () => DB.exportar();
  document.querySelectorAll('[data-pn]').forEach(b => b.onclick = () => { DB.tab.pg += +b.dataset.pn; dashDesenha(); });
  dados = { hoje: DB.dados.hoje, visitas: DB.dados.cards.filter(c => c.situacao !== 'finalizado' && c.situacao !== 'naorealizada') };
  document.querySelectorAll('.pbi [data-reg]').forEach(b => b.onclick = () => registrar(+b.dataset.reg));
  document.querySelectorAll('.pbi [data-rep]').forEach(b => b.onclick = () => reagendarVisita(+b.dataset.rep));
  window.scrollTo(0, scrollY);
}

init();
</script>
