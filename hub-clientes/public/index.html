<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hub de Clientes</title>
<style>
:root{
  --bg:#f3f4fa;--bg2:#eaecf6;--panel:#fff;--panel2:#f8f9fd;--ink:#14172b;--mut:#6b7090;--line:#e4e7f2;
  --brand:#5b5bf0;--brand2:#8b5cf6;--brand-soft:#ececff;--brand-ink:#fff;
  --reuniao:#14915f;--contato:#2563eb;--sem_contato:#d03a2f;--pendente:#7c82a0;--atrasado:#d97706;
  --reuniao-bg:#e2f6ec;--contato-bg:#e6efff;--sem_contato-bg:#fde8e5;--pendente-bg:#edeff7;--atrasado-bg:#fef0d9;
  --verde:#14915f;--amarelo:#e0a800;--vermelho:#d03a2f;
  --sh1:0 1px 2px rgba(25,30,70,.06),0 1px 3px rgba(25,30,70,.04);--sh2:0 8px 24px rgba(25,30,70,.10);--sh3:0 24px 60px rgba(25,30,70,.22);
  --r:16px;--glass:rgba(255,255,255,.72)
}
@media(prefers-color-scheme:dark){:root{
  --bg:#0d0f1c;--bg2:#13162a;--panel:#171a2e;--panel2:#1c2038;--ink:#eceefb;--mut:#9aa0c0;--line:#272b47;
  --brand:#8281ff;--brand2:#b08cff;--brand-soft:#23265a;--brand-ink:#0d0f1c;
  --reuniao:#4cc38a;--contato:#6ea4ff;--sem_contato:#ff7f70;--pendente:#9aa0c0;--atrasado:#f6a928;
  --reuniao-bg:#143026;--contato-bg:#16294a;--sem_contato-bg:#3a1e1b;--pendente-bg:#252945;--atrasado-bg:#3a2c12;
  --verde:#4cc38a;--amarelo:#f1c232;--vermelho:#ff7f70;--sh1:none;--sh2:0 8px 24px rgba(0,0,0,.4);--sh3:0 24px 60px rgba(0,0,0,.6);--glass:rgba(23,26,46,.75)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg.i{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* shell */
.shell{display:flex;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;width:76px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 0}
.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--brand),var(--brand2));display:grid;place-items:center;color:#fff;font-weight:800;font-size:17px;margin-bottom:12px;box-shadow:0 6px 16px rgba(91,91,240,.4)}
.rb{width:52px;padding:8px 0 6px;border:0;background:none;border-radius:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;transition:.15s}
.rb svg{width:21px;height:21px}
.rb:hover{background:var(--panel2);color:var(--ink)}.rb.on{background:var(--brand-soft);color:var(--brand)}.rb[disabled]{opacity:.45;cursor:default}
main{flex:1;min-width:0;padding:22px 28px 56px;max-width:1500px}
.fade{animation:fade .25s ease}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:12px 14px;align-items:center;margin-bottom:18px}
.ttl{flex:1;min-width:220px}.ttl h1{margin:0;font-size:24px;letter-spacing:-.02em}.ttl p{margin:2px 0 0;color:var(--mut)}
.pill{display:flex;align-items:center;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:var(--sh1)}
.pill button{border:0;background:none;border-radius:999px;color:var(--mut);display:flex;align-items:center;gap:7px;padding:7px 14px;font-weight:600;transition:.15s;white-space:nowrap}
.pill button:hover{color:var(--ink)}.pill button.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;box-shadow:0 4px 12px rgba(91,91,240,.35)}
.mes{padding:3px 4px}.mes button{padding:6px;width:32px;height:32px;justify-content:center}.mes b{min-width:140px;text-align:center;font-weight:700}.mes button:disabled{opacity:.35;cursor:default}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:8px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;box-shadow:var(--sh1);transition:.15s}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn.pri{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(91,91,240,.35)}.btn.pri:hover{filter:brightness(1.08);color:#fff}
.btn.dan{color:var(--sem_contato)}.btn.dan:hover{border-color:var(--sem_contato);color:var(--sem_contato)}.btn.ico{padding:8px 10px}.btn:disabled{opacity:.55;cursor:default}.btn.big{padding:12px 20px;font-size:15px;border-radius:14px}

/* cards & generic */
.box,.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1)}
.box{padding:18px}.box h3{margin:0 0 14px;font-size:14px;display:flex;justify-content:space-between;align-items:center}.box h3 small{color:var(--mut);font-weight:500}
.grid{display:grid;gap:14px;margin-bottom:14px}.g3{grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}.g2{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.empty{color:var(--mut);padding:26px;text-align:center}
.err{background:var(--sem_contato-bg);color:var(--sem_contato);padding:14px;border-radius:12px}
.skel{height:90px;border-radius:var(--r);background:linear-gradient(90deg,var(--bg2),var(--panel),var(--bg2));background-size:200% 100%;animation:sk 1.2s infinite}@keyframes sk{to{background-position:-200% 0}}

/* status tokens */
.s-reuniao{--c:var(--reuniao);--b:var(--reuniao-bg)}.s-contato{--c:var(--contato);--b:var(--contato-bg)}.s-sem_contato{--c:var(--sem_contato);--b:var(--sem_contato-bg)}.s-pendente{--c:var(--pendente);--b:var(--pendente-bg)}.s-atrasado{--c:var(--atrasado);--b:var(--atrasado-bg)}.s-na{--c:var(--line);--b:var(--bg)}
.badge{white-space:nowrap;flex-shrink:0;display:inline-flex;gap:5px;align-items:center;font-size:11.5px;font-weight:700;padding:3px 10px 3px 8px;border-radius:999px;background:var(--b);color:var(--c)}
.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.chip{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:8px;background:var(--pendente-bg);color:var(--mut);white-space:nowrap;display:inline-flex;align-items:center;gap:5px}
.chip.warn{background:var(--atrasado-bg);color:var(--atrasado)}.chip.brand{background:var(--brand-soft);color:var(--brand)}
.sd{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 0 3px color-mix(in srgb,currentColor 18%,transparent)}.sd.verde{background:var(--verde);color:var(--verde)}.sd.amarelo{background:var(--amarelo);color:var(--amarelo)}.sd.vermelho{background:var(--vermelho);color:var(--vermelho)}
.av{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px;flex-shrink:0}.av.sm{width:28px;height:28px;border-radius:9px;font-size:11px}.av.lg{width:52px;height:52px;border-radius:16px;font-size:18px}
.hist{display:flex;gap:3px}.hist i{flex:1;height:5px;border-radius:3px;background:var(--c);opacity:.95}.hist i.s-na{opacity:.5}

/* home */
.hero{position:relative;overflow:hidden;border-radius:24px;padding:34px 36px;color:#fff;background:radial-gradient(1200px 400px at 90% -20%,rgba(255,255,255,.28),transparent),linear-gradient(135deg,#4338ca,#7c3aed 60%,#c026d3);box-shadow:var(--sh2);display:flex;flex-wrap:wrap;gap:26px;align-items:center;margin-bottom:22px}
.hero h1{margin:0 0 6px;font-size:32px;letter-spacing:-.03em}.hero p{margin:0;opacity:.85;max-width:460px}
.hero .ring{margin-left:auto;display:flex;align-items:center;gap:18px}.hero .ring b{font-size:34px;display:block;line-height:1}.hero .ring span{opacity:.85;font-size:13px}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.modc{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:22px;box-shadow:var(--sh1);display:flex;flex-direction:column;gap:12px;transition:.2s}
.modc:not(.off):hover{transform:translateY(-3px);box-shadow:var(--sh2);border-color:var(--brand)}
.modc.off{opacity:.55;border-style:dashed}
.modc .mi{width:50px;height:50px;border-radius:16px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center}.modc .mi svg{width:26px;height:26px}
.modc h3{margin:0;font-size:18px}.modc p{margin:0;color:var(--mut);flex:1}
.stats{display:flex;gap:10px;flex-wrap:wrap}.stats .chip{font-size:12px}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:14px}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:center}
.kpi .ki{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:var(--b,var(--brand-soft));color:var(--c,var(--brand))}
.kpi .n{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1}.kpi .l{color:var(--mut);font-size:12.5px;line-height:1.3}
.kpi.big{grid-column:span 2}.kpi .ringw{margin-right:2px}

/* bars */
.bar{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--pendente-bg);gap:2px}.bar i{display:block;background:var(--c);border-radius:999px}
.row{display:grid;grid-template-columns:84px 1fr 54px;gap:10px;align-items:center;margin:9px 0;font-size:13px}.row span:last-child{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}.row span:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--mut);margin-top:12px}.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--c)}
.vc{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:6px}.vc .col1{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.vc .stk{width:100%;max-width:46px;display:flex;flex-direction:column-reverse;gap:2px;justify-content:flex-start}.vc .stk i{display:block;background:var(--c);border-radius:5px;min-height:3px}
.vc small{color:var(--mut);font-size:11.5px;font-weight:600}.vc .pc{font-size:11px;font-weight:700}

/* alerts */
.alert{display:flex;gap:12px;align-items:center;padding:10px 8px;border-radius:12px;cursor:pointer;transition:.12s}.alert:hover{background:var(--panel2)}
.alert .t{flex:1;min-width:0;font-weight:600}.alert .t small{color:var(--mut);display:block;font-weight:400}

/* toolbar */
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.sb{position:relative;flex:1;min-width:230px;max-width:380px}.sb svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--mut)}
.tools input,.tools select{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:9px 12px;box-shadow:var(--sh1)}.sb input{width:100%;padding-left:38px}

/* register screen */
.reg{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:16px;align-items:start}
.rl{display:flex;flex-direction:column;gap:8px;max-height:calc(100vh - 210px);overflow:auto;padding:2px 4px 2px 2px}
.ri{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;cursor:pointer;transition:.12s;box-shadow:var(--sh1)}
.ri:hover{border-color:var(--brand)}.ri.sel{border-color:var(--brand);background:var(--brand-soft)}
.ri .tx{flex:1;min-width:0}.ri b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.ri small{color:var(--mut);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn{position:sticky;top:12px;max-height:calc(100vh - 210px);overflow:auto;padding:0}.pn .x{display:none}.pn .dh{border-radius:var(--r) var(--r) 0 0}
.pn .empty{padding:70px 24px}.pn .empty svg{width:44px;height:44px;color:var(--brand);margin-bottom:10px;opacity:.7}

/* kanban */
.board{display:flex;gap:14px;overflow-x:auto;padding:2px 2px 16px;align-items:flex-start;scroll-snap-type:x proximity}
.col{width:282px;flex-shrink:0;background:var(--bg2);border-radius:18px;padding:10px;scroll-snap-align:start}
.col h4{margin:2px 4px 10px;font-size:13px;display:flex;justify-content:space-between;align-items:center}
.col h4 em{font-style:normal;background:var(--panel);border-radius:999px;padding:1px 10px;font-size:12px;color:var(--mut);box-shadow:var(--sh1)}
.col .pg{height:3px;border-radius:3px;background:var(--line);margin:0 4px 10px;overflow:hidden}.col .pg i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand2))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:8px;cursor:pointer;box-shadow:var(--sh1);transition:.15s}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:var(--brand)}
.card .hd{display:flex;gap:10px;align-items:center}.card .nm{font-weight:700;line-height:1.25;word-break:break-word}.card .sub{color:var(--mut);font-size:12px;word-break:break-all}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 8px}.card .ft{color:var(--mut);font-size:12px;margin-bottom:8px}

/* table */
.tw{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh1);overflow:auto}
table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);background:var(--panel2);position:sticky;top:0}tr:last-child td{border-bottom:0}
tr.c{cursor:pointer;transition:.1s}tr.c:hover{background:var(--panel2)}.who{display:flex;gap:10px;align-items:center}.who small{display:block;color:var(--mut)}

/* drawer / panel */
.scrim{position:fixed;inset:0;background:rgba(10,12,30,.45);backdrop-filter:blur(2px);z-index:9;opacity:0;pointer-events:none;transition:.2s}.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;inset:0 0 0 auto;width:min(620px,100%);background:var(--panel);border-left:1px solid var(--line);box-shadow:var(--sh3);overflow:auto;z-index:10;transform:translateX(104%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:0}
.drawer.on{transform:none}
.dh{position:sticky;top:0;z-index:2;background:linear-gradient(135deg,var(--brand-soft),var(--panel));padding:18px 22px;border-bottom:1px solid var(--line)}
.dh .top1{display:flex;gap:14px;align-items:center}.dh h2{margin:0;font-size:19px;letter-spacing:-.01em;word-break:break-word}.dh .sub{color:var(--mut);font-size:13px;word-break:break-all}
.x{position:absolute;right:14px;top:14px;border:0;background:var(--panel);width:34px;height:34px;border-radius:11px;display:grid;place-items:center;box-shadow:var(--sh1)}
.dh .meta{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 10px}
.db{padding:6px 22px 22px}
.info{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}.info div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}.info small{display:block;color:var(--mut);font-size:11.5px}.info b{font-size:14px}
.warnb{background:var(--atrasado-bg);color:var(--atrasado);border-radius:12px;padding:10px 12px;font-weight:600;margin:12px 0}
.sec{margin:22px 0 10px;font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);font-weight:700}
label{display:block;font-size:12.5px;color:var(--mut);margin:12px 0 5px;font-weight:600}
.f input[type=text],.f input[type=date],.f select,.f textarea{width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:9px 12px;transition:.12s}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--brand);outline:0;box-shadow:0 0 0 3px var(--brand-soft)}.f textarea{min-height:76px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opt{position:relative;margin:0;color:var(--ink)}.opt input{position:absolute;opacity:0}
.opt span{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;padding:14px 8px;border:1.5px solid var(--line);border-radius:14px;background:var(--panel2);font-weight:700;font-size:13px;transition:.15s;cursor:pointer;color:var(--ink)}
.opt span svg{width:24px;height:24px;color:var(--c)}.opt:hover span{border-color:var(--c)}
.opt input:checked+span{border-color:var(--c);background:var(--b);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 22%,transparent)}.opt input:focus-visible+span{outline:2px solid var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}.seg label{margin:0;border:1.5px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;color:var(--ink);font-size:13px;display:flex;gap:7px;align-items:center;background:var(--panel2)}.seg input{accent-color:var(--brand)}
.seg label:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.act{position:sticky;bottom:0;background:linear-gradient(0deg,var(--panel) 70%,transparent);padding:14px 0 2px;margin-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hint{color:var(--mut);font-size:12px;margin-top:8px}
.tl{position:relative;padding-left:22px}.tl:before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:2px;background:var(--line);border-radius:2px}
.tl .it{position:relative;margin:0 0 14px;background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.tl .it:before{content:"";position:absolute;left:-21px;top:16px;width:12px;height:12px;border-radius:50%;background:var(--c);border:3px solid var(--panel)}
.tl .it p{margin:6px 0 0;color:var(--mut);white-space:pre-wrap}
.toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;z-index:30;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;box-shadow:var(--sh3);font-weight:600}.toast.on{opacity:1;transform:translate(-50%,0)}

@media(max-width:1100px){.g2{grid-template-columns:1fr}}
@media(max-width:820px){
  .shell{display:block}
  .rail{position:sticky;z-index:8;width:auto;height:auto;flex-direction:row;padding:8px 12px;border-right:0;border-bottom:1px solid var(--line);overflow-x:auto}.logo{margin:0 8px 0 0;width:38px;height:38px}
  .rb{width:auto;flex-direction:row;gap:7px;padding:8px 12px;font-size:13px}
  main{padding:14px 14px 48px}.hero{padding:24px}.hero h1{font-size:25px}.hero .ring{margin-left:0}
  .reg{grid-template-columns:1fr}.rl{max-height:300px}.pn{position:static;max-height:none}
  .two,.info{grid-template-columns:1fr}.opts{grid-template-columns:1fr}.kpi.big{grid-column:auto}
  .pill{overflow-x:auto;max-width:100%}.pill button span{display:none}.pill button{padding:8px 12px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <nav class="rail" aria-label="Menu">
    <div class="logo" title="Hub de Clientes">H</div>
    <button class="rb" id="nHome" title="Início"><span id="iHome"></span>Início</button>
    <button class="rb" id="nReg" title="Registro de Visita"><span id="iReg"></span>Visitas</button>
    <button class="rb" disabled title="Novas funções em breve"><span id="iMore"></span>Em breve</button>
  </nav>
  <main>
    <div class="top" id="top">
      <div class="ttl"><h1>Registro de Visita</h1><p id="sub"></p></div>
      <div class="pill mes"><button id="mAnt" title="Mês anterior" aria-label="Mês anterior"></button><b id="mLbl"></b><button id="mPro" title="Próximo mês" aria-label="Próximo mês"></button></div>
      <div class="pill" id="tabs"></div>
      <button class="btn" id="syn" title="Ajusta as etapas pela Próxima Renovação"></button>
      <button class="btn ico" id="rec" title="Recarregar do Bitrix24" aria-label="Recarregar"></button>
    </div>
    <div id="view"><div class="skel"></div></div>
  </main>
</div>
<div class="scrim" id="sc"></div>
<aside class="drawer" id="dr" aria-label="Cliente"></aside>
<div class="toast" id="toast" role="status"></div>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const P = { home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>', clip:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4h6v3H9zM9 12h6M9 16h4"/>',
  list:'<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>', chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', board:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="10" rx="1.5"/><rect x="17" y="4" width="4" height="13" rx="1.5"/>',
  hist:'<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>', refresh:'<path d="M21 12a9 9 0 0 1-15.5 6.2L3 16"/><path d="M3 21v-5h5M3 12A9 9 0 0 1 18.5 5.8L21 8"/><path d="M21 3v5h-5"/>',
  sync:'<path d="M17 3l4 4-4 4M21 7H8a4 4 0 0 0-4 4M7 21l-4-4 4-4M3 17h13a4 4 0 0 0 4-4"/>', left:'<path d="M15 6l-6 6 6 6"/>', right:'<path d="M9 6l6 6-6 6"/>', search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
  x:'<path d="M6 6l12 12M18 6L6 18"/>', check:'<path d="M5 12l5 5 9-10"/>', chat:'<path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.4A8 8 0 1 1 21 12z"/>', ban:'<circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6 6 0 0 1 3.5 6"/>', clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>', alert:'<path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18h.01"/>',
  puzzle:'<path d="M10 4a2 2 0 1 1 4 0v2h4v4h-2a2 2 0 1 0 0 4h2v4h-4v-2a2 2 0 1 0-4 0v2H6v-4h2a2 2 0 1 0 0-4H6V6h4z"/>', arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>', link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3A4 4 0 0 0 11 18.7l1-1"/>' };
const ic = (n, c = '') => `<svg class="i ${c}" viewBox="0 0 24 24" aria-hidden="true">${P[n]}</svg>`;
const ST = { reuniao:['Reunião feita','check'], contato:['Só contato','chat'], sem_contato:['Sem contato','ban'], pendente:['Pendente','clock'], atrasado:['Atrasado','alert'], na:['—',''] };
const SAUDE = { verde:'Verde', amarelo:'Amarelo', vermelho:'Vermelho' };
const REN = { provavel:'Provável', indefinido:'Indefinida', improvavel:'Improvável' };
const CANAL = { reuniao:'Reunião presencial', video:'Videochamada', whatsapp:'WhatsApp', telefone:'Telefone', email:'E-mail', outro:'Outro' };
const TABS = [['reg','clip','Registrar'],['hist','hist','Visitas'],['dash','chart','Acompanhamento'],['board','board','Kanban'],['lista','list','Lista']];
let S = null, mes = null, view = 'home', tab = 'reg', filtro = { q:'', status:'', resp:'' }, openId = null;
const pct = v => Math.round(v * 100) + '%';
const mesNome = m => { const [y, mo] = m.split('-'); const t = new Date(+y, mo - 1, 1).toLocaleDateString('pt-BR', { month:'long', year:'numeric' }); return t[0].toUpperCase() + t.slice(1); };
const mesCurto = m => { const [y, mo] = m.split('-'); return new Date(+y, mo - 1, 1).toLocaleDateString('pt-BR', { month:'short' }).replace('.', '') + '/' + y.slice(2); };
const addMes = (m, n) => { const [y, mo] = m.split('-').map(Number), t = y * 12 + mo - 1 + n; return `${Math.floor(t/12)}-${String(t%12+1).padStart(2,'0')}`; };
const fdata = d => d ? d.split('-').reverse().join('/') : '';
function toast(t) { const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(() => e.classList.remove('on'), 4500); }
async function api(path, opt) {
  const r = await fetch(path, { ...opt, headers: opt?.body ? { 'Content-Type':'application/json' } : {} });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Erro ' + r.status);
  return j;
}
const ini = n => (String(n).replace(/[^\p{L}\p{N} ]/gu, ' ').trim().split(/\s+/).slice(0, 2).map(w => w[0]).join('') || '?').toUpperCase();
const hue = n => { let h = 0; for (const ch of String(n)) h = (h * 31 + ch.charCodeAt(0)) % 360; return h; };
const av = (n, sz = '') => `<span class="av ${sz}" style="background:linear-gradient(135deg,hsl(${hue(n)} 62% 52%),hsl(${(hue(n) + 40) % 360} 62% 42%))">${esc(ini(n))}</span>`;
const badge = s => `<span class="badge s-${s}">${ST[s][0]}</span>`;
const sd = s => s ? `<span class="sd ${s}" title="Saúde: ${SAUDE[s]}"></span>` : '';
const ring = (v, size = 120, w = 12, col = 'var(--brand)', track = 'var(--line)') => { const r = (size - w) / 2, c = 2 * Math.PI * r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="${pct(v)}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${w}"/><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round" stroke-dasharray="${c * Math.min(1, v)} ${c}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`; };
const ORDER = ['reuniao','contato','sem_contato','atrasado','pendente'];
const stack = v => !v.total ? '<div class="bar"></div>' : `<div class="bar" title="${ORDER.map(k => ST[k][0] + ': ' + v[k]).join(' · ')}">` + ORDER.map(k => v[k] ? `<i class="s-${k}" style="width:${v[k]/v.total*100}%"></i>` : '').join('') + '</div>';
const legend = () => '<div class="leg">' + ORDER.map(k => `<span class="s-${k}"><span class="dot"></span>${ST[k][0]}</span>`).join('') + '</div>';
const hist = c => `<div class="hist">${c.historico.map(h => `<i class="s-${h.status}" title="${esc(mesNome(h.mes))}: ${ST[h.status][0]}"></i>`).join('')}</div>`;

/* chrome */
$('#iHome').innerHTML = ic('home'); $('#iReg').innerHTML = ic('clip'); $('#iMore').innerHTML = ic('puzzle');
$('#mAnt').innerHTML = ic('left'); $('#mPro').innerHTML = ic('right');
$('#syn').innerHTML = ic('sync') + '<span>Sincronizar etapas</span>'; $('#rec').innerHTML = ic('refresh');
$('#tabs').innerHTML = TABS.map(([k, i, l]) => `<button data-t="${k}">${ic(i)}<span>${l}</span></button>`).join('');

async function load() {
  try { S = await api('/api/estado' + (mes ? '?mes=' + mes : '')); mes = S.mes; render(); }
  catch (e) { $('#view').innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function render() {
  const home = view === 'home';
  $('#nHome').classList.toggle('on', home); $('#nReg').classList.toggle('on', !home);
  $('#top').style.display = home ? 'none' : '';
  if (home) { closeDr(); $('#view').innerHTML = `<div class="fade">${homeV()}</div>`; $('#go').onclick = () => { view = 'app'; render(); }; return; }
  if (tab === 'reg') closeDr();
  $('#mLbl').textContent = mesNome(mes);
  $('#mPro').disabled = mes >= S.hoje.slice(0, 7);
  const g = S.dashboard.geral; $('#sub').textContent = `${g.reuniao + g.contato} de ${g.total} clientes atendidos em ${mesNome(mes).toLowerCase()}`;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab));
  $('#view').innerHTML = `<div class="fade">${tab === 'dash' ? dash() : tab === 'reg' ? regV() : tab === 'hist' ? histV() : tools() + (tab === 'board' ? board() : lista())}</div>`;
  bind();
  if (openId) drawer(openId, true);
}

function homeV() {
  const g = S.dashboard.geral, f = g.reuniao + g.contato, cob = S.dashboard.cobertura;
  return `<section class="hero"><div><h1>Hub de Clientes</h1><p>Acompanhe cada cliente do funil de contratos ativos, registre as visitas do mês e antecipe renovações.</p></div>
    <div class="ring">${ring(cob, 118, 12, '#fff', 'rgba(255,255,255,.25)')}<div><b>${pct(cob)}</b><span>${f} de ${g.total} clientes<br>atendidos em ${esc(mesNome(S.mes))}</span></div></div></section>
    <div class="mods">
    <div class="modc"><div class="mi">${ic('clip')}</div><h3>Registro de Visita</h3><p>Registre a visita ou contato mensal de cada cliente e veja quem ainda falta.</p>
      <div class="stats"><span class="chip warn">${ic('clock')}${g.pendente + g.atrasado} sem registro</span><span class="chip brand">${ic('check')}${f} atendidos</span></div>
      <button class="btn pri big" id="go">Entrar no Registro de Visita ${ic('arrow')}</button></div>
    <div class="modc off"><div class="mi">${ic('puzzle')}</div><h3>Novas funções</h3><p>Mais módulos de gestão chegam em breve ao hub.</p></div></div>`;
}
const ORD = { atrasado:0, pendente:1, sem_contato:2, contato:3, reuniao:4 };
function rlItems() {
  const l = filtrados().sort((a, b) => ORD[a.status] - ORD[b.status] || a.nome.localeCompare(b.nome));
  return l.map(c => `<div class="ri ${c.id === openId ? 'sel' : ''}" data-open="${c.id}">${av(c.nome)}<div class="tx"><b>${esc(c.nome)}</b><small>${esc(c.etapa)} · ${esc(c.responsavel || 'Sem responsável')}</small></div><span class="s-${c.status}">${badge(c.status)}</span></div>`).join('') || '<div class="empty">Nenhum cliente encontrado.</div>';
}
const regVazio = () => `<div class="empty">${ic('clip')}<br><b>Selecione um cliente</b><br>Atrasados e pendentes aparecem primeiro na lista.</div>`;
function regV() { return tools() + `<div class="reg"><div class="rl" id="rl">${rlItems()}</div><div class="pn box" id="pn">${regVazio()}</div></div>`; }
function histV() {
  const nome = Object.fromEntries(S.clientes.map(c => [c.id, c]));
  const l = S.registros.filter(r => nome[r.dealId]).sort((a, b) => (b.data || b.mes).localeCompare(a.data || a.mes));
  if (!l.length) return `<div class="box empty">${ic('hist')}<br>Nenhuma visita registrada ainda.</div>`;
  return `<div class="tw"><table><thead><tr><th>Data</th><th>Cliente</th><th>Mês</th><th>Resultado</th><th>Canal</th><th>Resumo</th><th>Registrado por</th></tr></thead><tbody>` + l.map(r => {
    const st = r.reuniaoRealizada ? 'reuniao' : r.contatoFeito ? 'contato' : 'sem_contato', c = nome[r.dealId];
    return `<tr class="c" data-open="${r.dealId}" data-mes="${r.mes}"><td>${fdata(r.data) || '—'}</td><td><div class="who">${av(c.nome, 'sm')}<b>${esc(c.nome)}</b></div></td><td>${esc(mesCurto(r.mes))}</td><td>${badge(st)}</td><td>${esc(CANAL[r.canal] || '—')}</td><td>${esc((r.resumo || r.motivo || '').slice(0, 80))}</td><td>${esc(r.criadoPor || '')}</td></tr>`; }).join('') + '</tbody></table></div>';
}
function dash() {
  const D = S.dashboard, g = D.geral, A = D.resumoAlertas;
  const kp = (i, n, l, cls = '') => `<div class="kpi ${cls ? 's-' + cls : ''}"><div class="ki">${ic(i)}</div><div><div class="n">${n}</div><div class="l">${l}</div></div></div>`;
  const mx = Math.max(1, ...D.serie.map(m => m.total));
  const serie = `<div class="vc">${D.serie.map(m => `<div class="col1" title="${ORDER.map(k => ST[k][0] + ': ' + m[k]).join(' · ')}"><span class="pc">${m.total ? pct((m.reuniao + m.contato) / m.total) : '–'}</span><div class="stk" style="height:${m.total / mx * 112}px">${ORDER.map(k => m[k] ? `<i class="s-${k}" style="height:${m[k] / m.total * 100}%"></i>` : '').join('')}</div><small>${esc(mesCurto(m.mes))}</small></div>`).join('')}</div>`;
  const etapas = D.porEtapa.map(e => `<div class="row"><span>${esc(e.etapa)}</span>${stack(e)}<span>${e.total}</span></div>`).join('');
  const resp = D.porResponsavel.map(e => `<div class="row"><span title="${esc(e.nome)}">${esc(e.nome)}</span>${stack(e)}<span>${e.reuniao + e.contato}/${e.total}</span></div>`).join('');
  const tipos = { atrasado:['Atraso','warn'], sem_contato:['Sem contato','warn'], saude:['Saúde','warn'], renovacao:['Renovação','warn'], mover:['Mover','brand'] };
  const nm = Object.fromEntries(S.clientes.map(c => [c.id, c]));
  const al = D.alertas.slice(0, 40).map(a => `<div class="alert" data-open="${a.dealId}">${av(a.nome, 'sm')}<span class="t">${esc(a.nome)}<small>${esc(a.etapa)} · ${esc(a.detalhe)}</small></span><span class="chip ${tipos[a.tipo][1]}">${tipos[a.tipo][0]}</span></div>`).join('');
  return `<div class="kpis">
    <div class="kpi big"><div class="ringw">${ring(D.cobertura, 84, 10, 'var(--reuniao)')}</div><div><div class="n">${pct(D.cobertura)}</div><div class="l">com contato no mês<br>${g.reuniao + g.contato} de ${g.total} clientes · ${pct(D.reuniaoPct)} com reunião</div></div></div>
    ${kp('users', g.total, 'clientes ativos no funil')}
    ${kp('clock', g.pendente + g.atrasado, `sem registro no mês<br>${g.atrasado} em atraso`, 'atrasado')}
    ${kp('ban', g.sem_contato, 'registrados sem contato', 'sem_contato')}
    ${kp('sync', A.mover, 'para mover de etapa')}
  </div>
  <div class="grid g2">
    <div class="box"><h3>Contato por mês <small>% com contato · últimos 6 meses</small></h3>${serie}${legend()}</div>
    <div class="box"><h3>Saúde dos clientes</h3>
      ${['verde','amarelo','vermelho','sem'].map(k => `<div class="row"><span>${k === 'sem' ? 'Sem avaliação' : SAUDE[k]}</span><div class="bar"><i style="width:${g.total ? D.saude[k] / g.total * 100 : 0}%;background:${k === 'sem' ? 'var(--pendente)' : 'var(--' + k + ')'}"></i></div><span>${D.saude[k]}</span></div>`).join('')}
      <div class="leg">Encerrados: ${D.encerrados.assinados} assinados · ${D.encerrados.cancelados} cancelados</div></div>
  </div>
  <div class="grid g3">
    <div class="box"><h3>Por etapa do ciclo <small>${esc(mesNome(mes))}</small></h3>${etapas}${legend()}</div>
    <div class="box"><h3>Por responsável</h3>${resp || '<div class="empty">Sem dados</div>'}</div>
    <div class="box"><h3>Atenção <small>${D.alertas.length} alerta(s)</small></h3>${al || `<div class="empty">${ic('check')}<br>Nenhum alerta</div>`}</div>
  </div>`;
}
function tools() {
  const rs = [...new Set(S.clientes.filter(c => c.tipoEtapa === 'mes').map(c => c.responsavel).filter(Boolean))].sort();
  return `<div class="tools"><div class="sb">${ic('search')}<input id="q" placeholder="Buscar cliente ou domínio…" value="${esc(filtro.q)}"></div>
    <select id="fs"><option value="">Todas as situações</option>${['reuniao','contato','sem_contato','pendente','atrasado'].map(k => `<option value="${k}" ${filtro.status === k ? 'selected' : ''}>${ST[k][0]}</option>`).join('')}</select>
    <select id="fr"><option value="">Todos os responsáveis</option>${rs.map(r => `<option ${filtro.resp === r ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>`;
}
const filtrados = () => S.clientes.filter(c => c.tipoEtapa === 'mes' && c.status !== 'na' &&
  (!filtro.status || c.status === filtro.status) && (!filtro.resp || c.responsavel === filtro.resp) &&
  (!filtro.q || (c.nome + ' ' + c.dominio).toLowerCase().includes(filtro.q.toLowerCase())));
function card(c) {
  return `<div class="card s-${c.status}" data-open="${c.id}"><div class="hd">${av(c.nome)}<div style="min-width:0"><div class="nm">${esc(c.nome)}</div>${c.dominio && c.nome !== c.dominio ? `<div class="sub">${esc(c.dominio)}</div>` : ''}</div></div>
    <div class="meta">${badge(c.status)} ${sd(c.saude)} ${c.mover?.vencida ? `<span class="chip brand" title="Ação de ciclo pendente">${ic('sync')}mover</span>` : ''}</div>
    <div class="ft">${esc(c.responsavel || 'Sem responsável')}${c.diasSemContato !== null ? ' · ' + c.diasSemContato + 'd sem contato' : ''}${c.proxRenovacao ? '<br>Renova em ' + fdata(c.proxRenovacao) : ''}</div>${hist(c)}</div>`;
}
function board() {
  const l = filtrados(), tot = Math.max(1, l.length);
  return '<div class="board">' + S.etapas.map(e => { const cs = l.filter(c => c.etapaId === e.id);
    return `<div class="col"><h4><span>${esc(e.nome)}</span><em>${cs.length}</em></h4><div class="pg"><i style="width:${cs.length / tot * 100}%"></i></div>${cs.map(card).join('') || '<div class="empty">—</div>'}</div>`; }).join('') + '</div>';
}
function lista() {
  const l = filtrados().sort((a, b) => a.mesCiclo - b.mesCiclo || a.nome.localeCompare(b.nome));
  if (!l.length) return `<div class="box empty">Nenhum cliente encontrado.</div>`;
  return `<div class="tw"><table><thead><tr><th>Cliente</th><th>Etapa</th><th>Situação do mês</th><th>Último contato</th><th>Renovação</th><th>Saúde</th><th>Responsável</th></tr></thead><tbody>` +
    l.map(c => `<tr class="c" data-open="${c.id}"><td><div class="who">${av(c.nome, 'sm')}<div><b>${esc(c.nome)}</b>${c.dominio ? `<small>${esc(c.dominio)}</small>` : ''}</div></div></td><td>${esc(c.etapa)}</td><td>${badge(c.status)}</td><td>${c.ultimoContato ? fdata(c.ultimoContato.slice(0, 10)) + ' <small style="color:var(--mut)">(' + c.diasSemContato + 'd)</small>' : '—'}</td><td>${c.proxRenovacao ? fdata(c.proxRenovacao) : '—'}</td><td>${sd(c.saude)} ${c.saude ? SAUDE[c.saude] : '—'}</td><td>${esc(c.responsavel || '—')}</td></tr>`).join('') + '</tbody></table></div>';
}
function bind() {
  document.querySelectorAll('[data-open]').forEach(e => e.onclick = async () => { if (e.dataset.mes && e.dataset.mes !== mes) { mes = e.dataset.mes; openId = +e.dataset.open; await load(); } else drawer(+e.dataset.open); });
  const refil = () => { if (tab === 'reg') { $('#rl').innerHTML = rlItems(); document.querySelectorAll('#rl [data-open]').forEach(e => e.onclick = () => drawer(+e.dataset.open)); } else render(); };
  const q = $('#q'); if (q) { q.oninput = () => { filtro.q = q.value; if (tab === 'reg') refil(); else { const p = q.selectionStart; render(); const n = $('#q'); n.focus(); n.setSelectionRange(p, p); } }; $('#fs').onchange = e => { filtro.status = e.target.value; refil(); }; $('#fr').onchange = e => { filtro.resp = e.target.value; refil(); }; }
}
const closeDr = () => { $('#dr').classList.remove('on'); $('#sc').classList.remove('on'); };
document.querySelectorAll('#tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; openId = null; render(); });
$('#nHome').onclick = () => { view = 'home'; render(); };
$('#nReg').onclick = () => { view = 'app'; render(); };
$('#mAnt').onclick = () => { mes = addMes(mes, -1); load(); };
$('#mPro').onclick = () => { mes = addMes(mes, 1); load(); };
$('#rec').onclick = () => load();
$('#sc').onclick = () => { closeDr(); openId = null; };
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#dr').classList.contains('on')) { closeDr(); openId = null; } });
$('#syn').onclick = async () => {
  try {
    const pl = await api('/api/sincronizar');
    if (!pl.mover.length) return toast(`Etapas já estão corretas pela renovação.${pl.ignorados.length ? ' ' + pl.ignorados.length + ' card(s) sem data ou com renovação vencida não são movidos.' : ''}`);
    if (!confirm(`Mover ${pl.mover.length} card(s) conforme a Próxima Renovação?\n\n` + pl.mover.slice(0, 15).map(m => `${m.titulo}: ${m.de} → ${m.para}`).join('\n'))) return;
    const r = await api('/api/sincronizar', { method:'POST', body:'{}' }); toast(`${r.movidos.length} card(s) movido(s)`); await load();
  } catch (e) { toast(e.message); }
};

function drawer(id, keep) {
  const c = S.clientes.find(x => x.id === id); const inline = tab === 'reg' && $('#pn'); const dr = inline ? $('#pn') : $('#dr');
  if (!c) { closeDr(); openId = null; if (inline) dr.innerHTML = regVazio(); return; }
  if (inline) document.querySelectorAll('#rl .ri').forEach(e => e.classList.toggle('sel', +e.dataset.open === id));
  openId = id;
  const r = c.registro || {}, regs = S.registros.filter(x => x.dealId === id).sort((a, b) => b.mes.localeCompare(a.mes));
  const cur = r.reuniaoRealizada ? 'reuniao' : r.contatoFeito ? 'contato' : c.registro ? 'nenhum' : '';
  const keepForm = keep && $('#fm') ? new FormData($('#fm')) : null;
  const opt = (v, st, t) => `<label class="opt s-${st}"><input type="radio" name="res" value="${v}" ${cur === v ? 'checked' : ''} required><span>${ic(ST[st][1])}${t}</span></label>`;
  dr.innerHTML = `<div class="dh"><button class="x" id="dx" aria-label="Fechar">${ic('x')}</button>
    <div class="top1">${av(c.nome, 'lg')}<div style="min-width:0;padding-right:36px"><h2>${esc(c.nome)}</h2><div class="sub">${[c.dominio, c.etapa, c.responsavel || 'Sem responsável'].filter(Boolean).map(esc).join(' · ')}</div></div></div>
    <div class="meta">${badge(c.status)} ${sd(c.saude)} <span class="chip">${ic('check')}${c.sequencia} mês(es) seguidos com contato</span>${c.diasNaEtapa !== null ? `<span class="chip">${c.diasNaEtapa}d na etapa</span>` : ''}</div>${hist(c)}</div>
    <div class="db">
    <div class="info"><div><small>Próxima renovação</small><b>${c.proxRenovacao ? fdata(c.proxRenovacao) : 'não informada'}</b></div><div><small>Etapa pela renovação</small><b>${c.mesEsperado !== null ? 'Mês ' + c.mesEsperado : '—'}</b></div></div>
    ${c.mover?.motivo === 'renovacao_vencida' ? '<div class="warnb">Renovação vencida: o cliente renovou ou cancelou?</div>' : ''}
    <a class="chip brand" href="https://${esc(S.portal)}/crm/deal/details/${c.id}/" target="_blank" rel="noopener">${ic('link')}Abrir card no Bitrix24</a>
    <div class="sec">Visita · ${esc(mesNome(mes))}</div>
    <form class="f" id="fm">
      <div class="opts">${opt('reuniao', 'reuniao', 'Reunião realizada')}${opt('contato', 'contato', 'Só contato')}${opt('nenhum', 'sem_contato', 'Sem contato')}</div>
      <div id="comC"><div class="two"><div><label>Data do contato</label><input type="date" name="data" value="${esc(r.data || '')}" max="${esc(S.hoje)}"></div>
        <div><label>Canal</label><select name="canal">${Object.entries(CANAL).map(([k, v]) => `<option value="${k}" ${r.canal === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
        <label>Participantes</label><input type="text" name="participantes" value="${esc(r.participantes || '')}" maxlength="300" placeholder="Quem participou"></div>
      <div id="semC"><label>Motivo de não ter havido contato/reunião</label><textarea name="motivo" maxlength="1000">${esc(r.motivo || '')}</textarea></div>
      <label>Resumo</label><textarea name="resumo" maxlength="4000" placeholder="O que foi conversado">${esc(r.resumo || '')}</textarea>
      <label>Próximos passos</label><textarea name="proximosPassos" maxlength="2000">${esc(r.proximosPassos || '')}</textarea>
      <div class="two"><div><label>Saúde do cliente</label><div class="seg">${['', 'verde','amarelo','vermelho'].map(k => `<label><input type="radio" name="saude" value="${k}" ${(r.saude || '') === k ? 'checked' : ''}>${k ? SAUDE[k] : '—'}</label>`).join('')}</div></div>
        <div><label>Intenção de renovar</label><select name="renovacao"><option value="">—</option>${Object.entries(REN).map(([k, v]) => `<option value="${k}" ${r.renovacao === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
      <label>Próximo contato</label><input type="date" name="proximoContato" value="${esc(r.proximoContato || '')}">
      <div class="act"><button class="btn pri big" id="sv">${ic('check')}${c.registro ? 'Atualizar registro' : 'Salvar registro'}</button>
        ${c.registro ? `<button type="button" class="btn dan" id="del">Excluir registro</button>` : ''}</div>
      <div class="hint">Ao salvar, o registro também é lançado na linha do tempo do card no Bitrix24.</div>
    </form>
    <div class="sec">Ciclo do cliente</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap">
      ${c.mesCiclo < 12 ? `<button class="btn ${c.mover?.tipo === 'avancar' ? 'pri' : ''}" data-mv="avancar">Avançar para Mês ${c.mesCiclo + 1}</button>` : `<button class="btn ${c.mover ? 'pri' : ''}" data-mv="renovar">Renovou → voltar ao Mês 0</button>`}
      <button class="btn dan" data-mv="cancelar">Cancelar cliente</button></div>
    <div class="sec">Histórico</div>
    <div class="tl">${regs.map(x => { const s = x.reuniaoRealizada ? 'reuniao' : x.contatoFeito ? 'contato' : 'sem_contato';
      return `<div class="it s-${s}"><b>${esc(mesNome(x.mes))}</b> &nbsp;${badge(s)} ${sd(x.saude)}
        <p>${x.data ? fdata(x.data) + ' · ' + esc(CANAL[x.canal] || '') : esc(x.motivo || '')}${x.resumo ? '\n' + esc(x.resumo) : ''}${x.proximosPassos ? '\n➜ ' + esc(x.proximosPassos) : ''}</p></div>`; }).join('') || '<div class="empty" style="padding:12px">Nenhum registro ainda.</div>'}</div></div>`;
  if (!inline) { dr.classList.add('on'); $('#sc').classList.add('on'); }
  const f = $('#fm');
  if (keepForm) for (const [k, v] of keepForm) { const el = f.elements[k]; if (!el) continue; if (el.length) [...el].forEach(x => x.checked = x.value === v); else el.value = v; }
  const sync = () => {
    const v = f.res.value, co = v === 'reuniao' || v === 'contato';
    $('#comC').style.display = co ? '' : 'none'; $('#semC').style.display = v === 'nenhum' ? '' : 'none';
  };
  f.querySelectorAll('[name=res]').forEach(x => x.onchange = sync);
  if (!f.data.value) f.data.value = mes === S.hoje.slice(0, 7) ? S.hoje : '';
  sync();
  $('#dx').onclick = inline ? null : () => { closeDr(); openId = null; };
  f.onsubmit = async e => {
    e.preventDefault(); const b = $('#sv'); b.disabled = true;
    const fd = Object.fromEntries(new FormData(f)), v = fd.res; delete fd.res;
    const body = { ...fd, dealId: id, mes, reuniaoRealizada: v === 'reuniao', contatoFeito: v === 'contato' };
    try { const r = await api('/api/registros', { method:'POST', body: JSON.stringify(body) }); toast(r.timeline ? 'Registro salvo e lançado no card ✔' : 'Registro salvo (não foi possível lançar no card do Bitrix24)'); openId = null; await load(); drawer(id); }
    catch (er) { toast(er.message); b.disabled = false; }
  };
  const del = $('#del'); if (del) del.onclick = async () => {
    if (!confirm('Excluir o registro deste mês? (o comentário já lançado no Bitrix24 permanece)')) return;
    try { await api(`/api/registros?dealId=${id}&mes=${mes}`, { method:'DELETE' }); toast('Registro excluído'); await load(); } catch (er) { toast(er.message); }
  };
  dr.querySelectorAll('[data-mv]').forEach(b => b.onclick = async () => {
    const a = b.dataset.mv, msg = { avancar:`Mover ${c.nome} para o Mês ${c.mesCiclo + 1}?`, renovar:`${c.nome} renovou? Voltar para o Mês 0.`, cancelar:`Mover ${c.nome} para CANCELADOS?` }[a];
    if (!confirm(msg)) return;
    try { const r = await api(`/api/clientes/${id}/mover`, { method:'POST', body: JSON.stringify({ acao: a }) }); toast(`${r.de} → ${r.para}`); openId = null; closeDr(); await load(); } catch (er) { toast(er.message); }
  });
}
load();
</script>
</body>
</html>
